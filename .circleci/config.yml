# Based on sample: https://github.com/circle-makotom/circle-advanced-setup-workflow/blob/f406e786e28dc1d73c5d1f841a64124b1fa2fa65/.circleci/config.yml

# Config for the setup workflow and common resources (jobs, commands) for main workflows
# `common-` prefix is added for common resources (to avoid conflicts with module resources)

version: 2.1

setup: << pipeline.parameters.run-setup >>

# All pipeline parameters need to be defined equally both for the setup workflow and main workflows
# These parameters will be passed to both of them
parameters:
  run-setup:
    description: Whether it is a setup workflow or a continuation
    type: boolean
    default: true
  force-all:
    description: Emergency valve - forcibly build all the modules
    type: boolean
    default: false
  custom-parameter:
    description: Some string to pass
    type: string
    default: ""

# Custom commands aimed for the main workflows and jobs
commands:
  deploy-dp-dags:
    parameters:
      dp-dags-location:
        description: The location of the root folder for data product notebooks
        type: string
    steps:
      - checkout
      - aws-cli/setup:
          role_arn: "arn:aws:iam::362686812061:role/CircleCIRoleForOIDC_Generic"
          region: us-east-1
      - run:
          name: Deploy Data Product Dags and modules to Artifacts Bucket
          command: |
            # Ensure the bucket variable is set
            if [ -z "$NUBEPRODUCT_ARTIFACTS_BUCKET" ]; then
              echo "Error: NUBEPRODUCT_ARTIFACTS_BUCKET environment variable is not set"
              exit 1
            fi

            aws s3 rm s3://$NUBEPRODUCT_ARTIFACTS_BUCKET/dags/src --recursive

            aws s3 sync \
                << parameters.dp-dags-location >> s3://$NUBEPRODUCT_ARTIFACTS_BUCKET/dags \
                --cache-control "max-age=86400" 
  deploy-dbt-project:
    parameters:
      dp-dbt-project-location:
        description: The location of the root folder for data product dbt project
        type: string
    steps:
      - checkout:
          depth: 0
      - run:
          name: Fetch main branch
          command: git fetch origin main
      - aws-cli/setup:
          role_arn: "arn:aws:iam::362686812061:role/CircleCIRoleForOIDC_Generic"
          region: us-east-1
      - run:
          name: Handle Python version
          command: |
            # Remove the .python-version file completely
            rm -f .python-version
      - run:
          name: Setup DBT environment
          command: |
            pip install dbt-core dbt-databricks
      - run:
          name: Create DBT profiles directory and configuration
          command: |
            # Create the profiles directory
            mkdir -p ~/.dbt
            
            # Create the profiles.yml file with environment variables
            cat > ~/.dbt/profiles.yml \<< EOF
            nubeproduct:
              outputs:
                dev:
                  catalog: null
                  host: dbc-ff5dddaf-fe0f.cloud.databricks.com
                  http_path: /sql/1.0/warehouses/2f8b52bf3d2088a2
                  schema: testing
                  threads: 4
                  token: ${DBT_TOKEN}
                  type: databricks
                prod:
                  catalog: null
                  host: dbc-ff5dddaf-fe0f.cloud.databricks.com
                  http_path: /sql/1.0/warehouses/2f8b52bf3d2088a2
                  schema: dp
                  threads: 4
                  token: ${DBT_TOKEN}
                  type: databricks
              target: dev
            EOF
            
            # Make sure the file exists and has content (for debugging)
            echo "DBT profiles.yml created:"
            ls -la ~/.dbt/
            cat ~/.dbt/profiles.yml | grep -v token # Print file without exposing token
      - run:
          name: Run DBT deps
          command: |
            cd << parameters.dp-dbt-project-location >>
            dbt deps
      - run:
          name: Run updated DBT models
          command: |
            # Create a temp directory for storing the comparison state
            mkdir -p state
            
            echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
            echo "Current commit: $(git rev-parse HEAD)"
            
            # When on main, compare with previous commit
            if [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]; then
              # Check if previous commit exists (in case this is the first commit)
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                BASE_COMMIT=$(git rev-parse HEAD~1)
                echo "On main, comparing with previous commit: $BASE_COMMIT"
              else
                echo "This appears to be the first commit on main"
                # You could set some default baseline or empty state here
                BASE_COMMIT=$(git rev-list --max-parents=0 HEAD)
                echo "Using initial commit as base: $BASE_COMMIT"
              fi
            # When on main, use previous commit on main
            elif [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]; then
              BASE_COMMIT=$(git rev-parse HEAD~1)
              echo "On main branch, comparing with previous commit: $BASE_COMMIT"
            # For any other branch, find common ancestor with main
            else
              BASE_COMMIT=$(git merge-base HEAD origin/main)
              echo "On feature branch, comparing with main common ancestor: $BASE_COMMIT"
            fi
            
            # Check out the base commit to generate the manifest
            echo "Generating manifest from base commit..."
            git checkout $BASE_COMMIT
            cd << parameters.dp-dbt-project-location >>
            dbt compile --target prod
            
            if [ $? -ne 0 ]; then
              echo "ERROR: Failed to compile dbt models on base commit"
              git checkout $(git rev-parse HEAD)
              exit 1
            fi
            
            cp target/manifest.json ../state/
            echo "Manifest generated and saved to state/manifest.json"
            
            # Switch back to the current commit
            echo "Switching back to current commit"
            cd ..
            git checkout -
            cd << parameters.dp-dbt-project-location >>
            
            echo "Running modified models and their downstream dependencies..."
            # List the modified models
            dbt ls --select state:modified+ --resource-type model --state ../state
            
            # Count how many models are modified
            MODIFIED_COUNT=$(dbt ls --select state:modified+ --resource-type model --state ../state | wc -l)
            MODIFIED_COUNT=$(echo $MODIFIED_COUNT | tr -d '[:space:]')
            
            echo "Number of modified models: $MODIFIED_COUNT"
            
            if [ "$MODIFIED_COUNT" -gt 0 ]; then
              echo "Running modified models:"
              # Run the modified models
              dbt run --select state:modified+ --state ../state --full-refresh
              
              if [ $? -ne 0 ]; then
                echo "ERROR: Failed to run modified dbt models"
                exit 1
              fi
              
              echo "Successfully ran all modified models and their dependencies"
            else
              echo "No models were modified. Nothing to run."
            fi
      - run:
          name: Deploy Data Product Project to Artifacts Bucket
          command: |
            # Ensure the bucket variable is set
            if [ -z "$NUBEPRODUCT_ARTIFACTS_BUCKET" ]; then
              echo "Error: NUBEPRODUCT_ARTIFACTS_BUCKET environment variable is not set"
              exit 1
            fi

            aws s3 rm s3://$NUBEPRODUCT_ARTIFACTS_BUCKET/dags/dbt --recursive

            aws s3 sync \
                << parameters.dp-dbt-project-location >> s3://$NUBEPRODUCT_ARTIFACTS_BUCKET/dags/dbt/nubeproduct \
                --cache-control "max-age=86400" 
            

# Common jobs for the main workflows
jobs:
  common-pre:
    docker:
      - image: alpine
    steps:
      - run: echo 'Jobs with `common-` prefix are intended to be shared among modules'
  debug-branch:
    docker:
      - image: alpine
    steps:
      - run: 
          name: Debug branch info
          command: |
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "PR Number: ${CIRCLE_PR_NUMBER}"
            echo "PR Username: ${CIRCLE_PR_USERNAME}"
            echo "PR Reponame: ${CIRCLE_PR_REPONAME}"
  
workflows:
  # The setup workflow
  setup-workflow:
    when: << pipeline.parameters.run-setup >>
   
    jobs:
      - debug-branch:
          filters:
            branches:
              only:
                - main
                - /pull\/.*/
      - config-splitting/setup-dynamic-config:
          filters:
            branches:
              only:
                - main
          context:
            - dbt-data-products-prd01
          force-all: << pipeline.parameters.force-all >>
          base-revision: main
          # A list of domain/data-product to be included in deployment TEST
          # this is used by list-changed-modules to see whether dp has changed
          # TODO: check whether only sub-components has changed
          modules: |
            nubeproduct
            dags/src

orbs:
  aws-cli: circleci/aws-cli@4.1.3
  # An "embedded" orb to facilitate config splitting
  config-splitting:
    # Dependencies
    orbs:
      continuation: circleci/continuation@0.1.2
      aws-cli: circleci/aws-cli@4.1.3
    # Commands for the setup workflow
    commands:
      list-changed-modules:
        parameters:
          modules:
            description: |
              Directories which should be built upon changes.
              Each row represents a space-separated list of the root directories for modules, each of which must has own `.circleci/config.yml`.
              The first item of the list will be tested for changes, and will be added to the filtered list of modules if there are any changes.
              The subsequent items, if there are any, will also be added to the filtered list of modules if there are any changes in the directory specified as the first item.

              CAVEAT: Directory names having white spaces cannot be specified.
            type: string
          modules-filtered:
            description: Path to the file where the filtered list of modules is generated
            type: string
            default: /tmp/modules-filtered.txt
          base-revision:
            description: Revision to compare with the current HEAD
            type: string
            default: main
          force-all:
            description: Emergency valve - forcibly build all the modules
            type: boolean
            default: false
        steps:
          - aws-cli/setup:
              role_arn: "arn:aws:iam::362686812061:role/CircleCIRoleForOIDC_Generic"
              region: us-east-1
          - run:
              name: Generate the list of modules having changes
              command: |
                # Add each module to `modules-filtered` if 1) `force-all` is set to `true`, 2) there is a diff against `base-revision`, 3) there is no `HEAD~1` (i.e., this is the very first commit for the repo) OR 4) there is a diff against the previous commit
                cat \<< EOD | sed -e '/^$/d' | while read row; do module="$(echo "$row" | awk '{ print $1 }')"; if [ << parameters.force-all >> == 'true' ] || [ $(git diff --name-only << parameters.base-revision >> "$module" | wc -l) -gt 0 ] || (! git rev-parse --verify HEAD~1) || [ $(git diff --name-only HEAD~1 "$module" | wc -l) -gt 0 ]; then echo "$row" | sed -e 's/ /\n/g' >> << parameters.modules-filtered >>; fi; done
                << parameters.modules >>
                EOD
      merge-modular-configs:
        parameters:
          modules:
            description: Path to the file for the list of the modules to build
            type: string
            default: /tmp/modules-filtered.txt
          shared-config:
            description: Path to the config providing shared resources (such as prerequisite jobs and common commands)
            type: string
            default: .circleci/config.yml
          continue-config:
            description: Path to the internally-used config for continuation
            type: string
            default: .circleci/continue-config.yml
        steps:
          - run:
              name: Merge configs
              command: |
                # If `modules` is unavailable, stop this job without continuation
                if [ ! -f "<< parameters.modules >>" ] || [ ! -s "<< parameters.modules >>" ]
                then
                  echo 'Nothing to merge. Halting the job.'
                  circleci-agent step halt
                  exit
                fi

                # Convert a list of dirs to a list of config.yml
                sed -i -e 's/$/\/.circleci\/config.yml/g' "<< parameters.modules >>"

                # If `shared-config` exists, append it at the end of `modules`
                if [ -f << parameters.shared-config >> ]
                then
                  echo "<< parameters.shared-config >>" >> "<< parameters.modules >>"
                fi

                xargs -a "<< parameters.modules >>" yq -y -s 'reduce .[] as $item ({}; . * $item)' | tee "<< parameters.continue-config >>"

    jobs:
      # The job for the setup workflow
      setup-dynamic-config:
        parameters:
          modules:
            description: Directories which should be tested for changes; one directory per line. Each directory must have `.circleci/config.yml`.
            type: string
          base-revision:
            description: Revision to compare with the current HEAD
            type: string
            default: main
          force-all:
            description: Emergency valve - forcibly build all the modules
            type: boolean
            default: false
          modules-filtered:
            description: Path to the file where the filtered list of modules is generated
            type: string
            default: /tmp/modules-filtered.txt
          shared-config:
            description: Path to the config providing shared resources (such as prerequisite jobs and common commands)
            type: string
            default: .circleci/config.yml
          continue-config:
            description: Path to the internally-used config for continuation
            type: string
            default: .circleci/continue-config.yml
        docker:
          - image: cimg/python:3.9
        steps:
          - checkout
          - run:
              name: Handle Python version
              command: |
                # Remove the .python-version file completely
                rm -f .python-version
          - run:
              name: Install yq
              command: pip install yq
          - list-changed-modules:
              modules: << parameters.modules >>
              modules-filtered: << parameters.modules-filtered >>
              base-revision: << parameters.base-revision >>
              force-all: << parameters.force-all >>
          - merge-modular-configs:
              modules: << parameters.modules-filtered >>
              shared-config: << parameters.shared-config >>
              continue-config: << parameters.continue-config >>
          - continuation/continue:
              configuration_path: << parameters.continue-config >>
              parameters: '{"run-setup":false}'