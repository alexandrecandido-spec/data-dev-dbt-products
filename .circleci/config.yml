# Based on sample: https://github.com/circle-makotom/circle-advanced-setup-workflow/blob/f406e786e28dc1d73c5d1f841a64124b1fa2fa65/.circleci/config.yml

# Config for the setup workflow and common resources (jobs, commands) for main workflows
# `common-` prefix is added for common resources (to avoid conflicts with module resources) 

version: 2.1

setup: << pipeline.parameters.run-setup >>

# All pipeline parameters need to be defined equally both for the setup workflow and main workflows
# These parameters will be passed to both of them
parameters:
  run-setup:
    description: Whether it is a setup workflow or a continuation
    type: boolean
    default: true
  force-all:
    description: Emergency valve - forcibly build all the modules
    type: boolean
    default: false
  custom-parameter:
    description: Some string to pass
    type: string
    default: ""
  dags-or-nbks-only-changes:
    description: Flag to indicate if only dags or notebooks module has changes
    type: boolean
    default: false

# Custom commands aimed for the main workflows and jobs
commands:
  create-dbt-profiles:
    steps:
      - run:
          name: Create DBT profiles directory and configuration
          command: |
            # Create the profiles directory
            mkdir -p ~/.dbt
            
            # Create the profiles.yml file with environment variables
            cat > ~/.dbt/profiles.yml \<< EOF
            nubeproduct:
              outputs:
                dev:
                  catalog: data_products_dev
                  host: dbc-ff5dddaf-fe0f.cloud.databricks.com
                  http_path: /sql/1.0/warehouses/2f8b52bf3d2088a2
                  schema: testing
                  threads: 4
                  token: ${DBT_TOKEN}
                  type: databricks
                prod:
                  catalog: data_products_prd
                  host: dbc-ff5dddaf-fe0f.cloud.databricks.com
                  http_path: /sql/1.0/warehouses/2f8b52bf3d2088a2
                  schema: data
                  threads: 4
                  token: ${DBT_TOKEN}
                  type: databricks
              target: dev
            EOF
            
            # Make sure the file exists and has content (for debugging)
            echo "DBT profiles.yml created:"
            ls -la ~/.dbt/
            cat ~/.dbt/profiles.yml | grep -v token # Print file without exposing token
  deploy-nbks-workspace:
    parameters:
      nbk-location:
        type: string
        description: The location of the root folder for databricks notebooks
    steps:
      - checkout
      - aws-cli/setup:
          role_arn: "arn:aws:iam::362686812061:role/CircleCIRoleForOIDC_Generic"
          region: us-east-1
      - run:
                name: Handle Python version
                command: |
                  # Remove the .python-version file completely
                  rm -f .python-version
      - run:
          name: Set Environment Variables and Databricks Configuration
          command: |
            secrets=$(aws secretsmanager get-secret-value --secret-id de-turbn/prd/dbkwksp-svc/dbt/01 --query SecretString --output text)
            echo "export DATABRICKS_TOKEN=$(echo $secrets | jq -r '.ServiceToken')" >> "$BASH_ENV"
            echo "export DATABRICKS_HOST=$(echo $secrets | jq -r '.DatabricksHost')" >> "$BASH_ENV"

            echo "Databricks host is: ${DATABRICKS_HOST}"
      - run:
          name: Install Databricks CLI and dependencies
          command: |
            pip install databricks-cli==0.17.6
            pip install urllib3==1.26.15
      - run:
          name: Deploy Data Product Notebooks to Data Engineer Databricks Workspace
          command: |
            databricks workspace import_dir << parameters.nbk-location >>  /target/dbt-products -o
  deploy-dp-dags:
    parameters:
      dp-dags-location:
        description: The location of the root folder for data product notebooks
        type: string
    steps:
      - checkout
      - aws-cli/setup:
          role_arn: "arn:aws:iam::362686812061:role/CircleCIRoleForOIDC_Generic"
          region: us-east-1
      - run:
          name: Deploy Data Product Dags and modules to Artifacts Bucket
          command: |
            # Ensure the bucket variable is set
            if [ -z "$NUBEPRODUCT_ARTIFACTS_BUCKET" ]; then
              echo "Error: NUBEPRODUCT_ARTIFACTS_BUCKET environment variable is not set"
              exit 1
            fi

            aws s3 rm s3://$NUBEPRODUCT_ARTIFACTS_BUCKET/dags/src --recursive

            aws s3 sync \
                << parameters.dp-dags-location >> s3://$NUBEPRODUCT_ARTIFACTS_BUCKET/dags/src \
                --cache-control "max-age=86400" 
  test-dbt-project:
    parameters:
      dp-dbt-project-location:
        description: The location of the root folder for data product dbt project
        type: string
      skip-tests:
        description: Flag to indicate if tests should not be run
        type: boolean
        default: false
    steps:
      - run:
          name: Skip if not a Pull Request
          command: |
            if [ -z "$CIRCLE_PULL_REQUEST" ]; then
              echo "Not a PR pipeline (CIRCLE_PULL_REQUEST is empty). Skipping dbt tests."
              circleci step halt
            fi
      - when:
          condition: << parameters.skip-tests >>
          steps:
            - run: echo 'Changes on dags do not trigger dbt test, but this job runs to satisfy GitHub required checks'
      - unless:
          condition: << parameters.skip-tests >>
          steps:
            - checkout
            - run:
                name: Fetch main branch
                command: git fetch origin main
            - aws-cli/setup:
                role_arn: "arn:aws:iam::362686812061:role/CircleCIRoleForOIDC_Generic"
                region: us-east-1
            - run:
                name: Handle Python version
                command: |
                  # Remove the .python-version file completely
                  rm -f .python-version
            - run:
                name: Setup DBT environment
                command: |
                  pip install dbt-core==1.9.1 dbt-databricks==1.9.1
            - create-dbt-profiles
            - run:
                name: Run DBT deps
                command: |
                  cd << parameters.dp-dbt-project-location >>
                  dbt deps
            - run:
                name: Static check (no artifacts, no state)
                command: |
                  set -euo pipefail

                  REPO_ROOT="$(pwd)"
                  PROJECT_DIR="<< parameters.dp-dbt-project-location >>"
                  cd "$REPO_ROOT"

                  if [ ! -d "$PROJECT_DIR" ]; then
                    echo "ERROR: PROJECT_DIR no existe: $PROJECT_DIR"; ls -la; exit 1
                  fi

                  TMP_WORKDIR="$(mktemp -d)"
                  export DBT_TARGET_PATH="$TMP_WORKDIR/target"

                  git fetch origin main >/dev/null 2>&1 || true
                  mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD -- "$PROJECT_DIR")

                  if [ "${#CHANGED[@]}" -eq 0 ]; then
                    echo "No hay cambios dentro de $PROJECT_DIR. Nada que validar."; exit 0
                  fi

                  SELECTORS=()
                  for f in "${CHANGED[@]}"; do
                    case "$f" in
                      *.sql|*.yml|*.yaml|*.csv|*.md|*.py)
                        rel="${f#$PROJECT_DIR/}"
                        dir="$(dirname "$rel")"

                        # Normalización segura para raíz
                        if [ -z "$dir" ] || [ "$dir" = "." ] || [ "$dir" = "./" ]; then
                          dir="*"
                        fi

                        # Limpiezas
                        dir="${dir#./}"
                        dir="${dir%/}"

                        # Evita ensuciar con macros (no son model/test/snapshot)
                        if [ "$dir" = "macros" ]; then
                          continue
                        fi

                        if [[ ! " ${SELECTORS[*]} " =~ " path:${dir} " ]]; then
                          SELECTORS+=("path:${dir}")
                        fi
                      ;;
                    esac
                  done

                  if [ "${#SELECTORS[@]}" -eq 0 ]; then
                    echo "Cambios fuera de recursos dbt (o no relevantes). Nada que validar."; exit 0
                  fi

                  echo "Selectores derivados de git diff:"
                  printf '  - %s\n' "${SELECTORS[@]}"

                  # Aplica '+' a cada selector
                  SELECTORS_PLUS=()
                  for s in "${SELECTORS[@]}"; do
                    SELECTORS_PLUS+=("${s}+")
                  done
                  SELECT_EXPR="${SELECTORS_PLUS[*]}"
                  echo "SELECT_EXPR: ${SELECT_EXPR}"

                  cd "$PROJECT_DIR"
                  dbt deps

                  echo "Listado del delta (ls):"
                  dbt ls \
                    --select "${SELECT_EXPR}" \
                    --indirect-selection=cautious \
                    --resource-type model \
                    --resource-type test \
                    --resource-type snapshot \
                    || true

                  echo "Parse estático del proyecto (sin tocar warehouse):"
                  # IMPORTANTE: usar parse en lugar de compile para evitar run_query / hooks
                  dbt parse \
                    --partial-parse \
                    --quiet
                no_output_timeout: 30m


  deploy-dbt-project:
    parameters:
      dp-dbt-project-location:
        description: The location of the root folder for data product dbt project
        type: string
    steps:
      - checkout
      - run:
          name: Fetch main branch
          command: git fetch origin main
      - aws-cli/setup:
          role_arn: "arn:aws:iam::362686812061:role/CircleCIRoleForOIDC_Generic"
          region: us-east-1
      - run:
          name: Handle Python version
          command: |
            # Remove the .python-version file completely
            rm -f .python-version
      - run:
          name: Setup DBT environment
          command: |
            pip install dbt-core==1.9.1 dbt-databricks==1.9.1
      - create-dbt-profiles
      - run:
          name: Run DBT deps
          command: |
            cd << parameters.dp-dbt-project-location >>
            dbt deps
      - run:
          name: Backup seeds/ (si existen)
          command: |
            set -euo pipefail
            if [ -z "${NUBEPRODUCT_ARTIFACTS_BUCKET:-}" ]; then
              echo "Error: NUBEPRODUCT_ARTIFACTS_BUCKET no está seteada"
              exit 1
            fi

            BUCKET="$NUBEPRODUCT_ARTIFACTS_BUCKET"
            SRC="s3://$BUCKET/dags/dbt/nubeproduct/seeds/"
            # Usamos workflow id para un prefijo único por ejecución
            BCK="s3://$BUCKET/_backups/seeds/${CIRCLE_WORKFLOW_ID:-manual}/"

            # Guardamos el prefijo en el entorno para re-uso
            echo "export SEEDS_BACKUP_PREFIX=\"$BCK\"" >> "$BASH_ENV"
            source "$BASH_ENV"

            # Solo si existen seeds en S3
            if aws s3 ls "$SRC" >/dev/null 2>&1; then
              echo "Backupeando seeds desde $SRC a $SEEDS_BACKUP_PREFIX ..."
              aws s3 sync "$SRC" "$SEEDS_BACKUP_PREFIX" --delete
            else
              echo "No se encontraron seeds en $SRC; no se hace backup"
            fi
      - run:
          name: Deploy Data Product Project to Artifacts Bucket
          command: |
            # Ensure the bucket variable is set
            if [ -z "$NUBEPRODUCT_ARTIFACTS_BUCKET" ]; then
              echo "Error: NUBEPRODUCT_ARTIFACTS_BUCKET environment variable is not set"
              exit 1
            fi

            aws s3 rm s3://$NUBEPRODUCT_ARTIFACTS_BUCKET/dags/dbt --recursive

            aws s3 sync \
                << parameters.dp-dbt-project-location >> s3://$NUBEPRODUCT_ARTIFACTS_BUCKET/dags/dbt/nubeproduct \
                --cache-control "max-age=86400"
      - run:
          name: Restore seeds/ (si hubo backup)
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            BUCKET="$NUBEPRODUCT_ARTIFACTS_BUCKET"
            DEST="s3://$BUCKET/dags/dbt/nubeproduct/seeds/"

            if [ -n "${SEEDS_BACKUP_PREFIX:-}" ] && aws s3 ls "$SEEDS_BACKUP_PREFIX" >/dev/null 2>&1; then
              echo "Restaurando seeds desde $SEEDS_BACKUP_PREFIX a $DEST ..."
              aws s3 sync "$SEEDS_BACKUP_PREFIX" "$DEST"
            else
              echo "No hay backup de seeds para restaurar"
            fi

      - run:
          name: Cleanup backup de seeds/ (opcional)
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            if [ -n "${SEEDS_BACKUP_PREFIX:-}" ]; then
              echo "Eliminando backup temporal en $SEEDS_BACKUP_PREFIX ..."
              aws s3 rm "$SEEDS_BACKUP_PREFIX" --recursive || true
            fi

  check_if_pr:
    steps:
      - run:
          name: Set PR environment flag
          command: |
            if [ -n "$CIRCLE_PULL_REQUEST" ]; then
              echo "export IS_PR=true" >> $BASH_ENV
              echo "Running in a pull request context: $CIRCLE_PULL_REQUEST"
            else
              echo "export IS_PR=false" >> $BASH_ENV
              echo "Not running in a pull request context"
            fi
            source $BASH_ENV 
            

# Common jobs for the main workflows
jobs:
  common-pre:
    docker:
      - image: alpine
    steps:
      - run: echo 'Jobs with `common-` prefix are intended to be shared among modules'
  check-pr-status:
    docker:
      - image: 'cimg/base:stable'
    steps:
      - check_if_pr
      - run:
          name: Determine whether to continue
          command: |
            if [ "$IS_PR" = "true" ]; then
              echo "This is a pull request, proceeding with build"
            else
              echo "This is not a pull request, halting workflow"
              circleci-agent step halt
              exit 1
            fi       

  
workflows:
  # The setup workflow
  setup-workflow:
    when: << pipeline.parameters.run-setup >>
   
    jobs:
      - config-splitting/setup-dynamic-config:
          context:
            - dbt-data-products-prd01
          force-all: << pipeline.parameters.force-all >>
          base-revision: main
          # A list of domain/data-product to be included in deployment TEST
          # this is used by list-changed-modules to see whether dp has changed
          # TODO: check whether only sub-components has changed
          modules: |
            nubeproduct
            dags/src
            notebooks
  pr-basics:
    when:
      not: << pipeline.parameters.run-setup >>
    jobs:
      - common-pre:
          filters:
            branches:
              ignore: main
      - check-pr-status:
          requires:
            - common-pre
          filters:
            branches:
              ignore: main

orbs:
  aws-cli: circleci/aws-cli@4.1.3
  # An "embedded" orb to facilitate config splitting
  config-splitting:
    # Dependencies
    orbs:
      continuation: circleci/continuation@0.1.2
      aws-cli: circleci/aws-cli@4.1.3
    # Commands for the setup workflow
    commands:
      list-changed-modules:
        parameters:
          modules:
            description: |
              Directories which should be built upon changes.
              Each row represents a space-separated list of the root directories for modules, each of which must has own `.circleci/config.yml`.
              The first item of the list will be tested for changes, and will be added to the filtered list of modules if there are any changes.
              The subsequent items, if there are any, will also be added to the filtered list of modules if there are any changes in the directory specified as the first item.

              CAVEAT: Directory names having white spaces cannot be specified.
            type: string
          modules-filtered:
            description: Path to the file where the filtered list of modules is generated
            type: string
            default: /tmp/modules-filtered.txt
          base-revision:
            description: Revision to compare with the current HEAD
            type: string
            default: main
          force-all:
            description: Emergency valve - forcibly build all the modules
            type: boolean
            default: false
        steps:
          - aws-cli/setup:
              role_arn: "arn:aws:iam::362686812061:role/CircleCIRoleForOIDC_Generic"
              region: us-east-1
          - run:
              name: Generate the list of modules having changes
              command: |
                # Add each module to `modules-filtered` if 1) `force-all` is set to `true`, 2) there is a diff against `base-revision`, 3) there is no `HEAD~1` (i.e., this is the very first commit for the repo) OR 4) there is a diff against the previous commit
                cat \<< EOD | sed -e '/^$/d' | while read row; do module="$(echo "$row" | awk '{ print $1 }')"; if [ << parameters.force-all >> == 'true' ] || [ $(git diff --name-only << parameters.base-revision >> "$module" | wc -l) -gt 0 ] || (! git rev-parse --verify HEAD~1) || [ $(git diff --name-only HEAD~1 "$module" | wc -l) -gt 0 ]; then echo "$row" | sed -e 's/ /\n/g' >> << parameters.modules-filtered >>; fi; done
                << parameters.modules >>
                EOD

                # Si NO hay cambios en nubeproduct, necesitamos igualmente un módulo que provea
                # el job `test-dbt-nubeproduct` (como no-op) para satisfacer el check requerido de GitHub.
                if ! grep -qx "nubeproduct" << parameters.modules-filtered >>; then
                  echo "No changes in 'nubeproduct'. Enabling dags-or-nbks-only-changes and ensuring a fallback module is present."

                  # Garantiza que 'dags/src' esté en la lista (aportará el job test-dbt-nubeproduct no-op)
                  if ! grep -qx "dags/src" << parameters.modules-filtered >>; then
                    echo "dags/src" >> << parameters.modules-filtered >>
                  fi

                  # (Opcional) también podrías asegurar notebooks como segundo fallback:
                  # if ! grep -qx "notebooks" << parameters.modules-filtered >>; then
                  #   echo "notebooks" >> << parameters.modules-filtered >>
                  # fi

                  echo '{"run-setup":false, "dags-or-nbks-only-changes":true}' > /tmp/continuation-params.json
                else
                  echo "Changes detected in 'nubeproduct'. dags-or-nbks-only-changes = false"
                  echo '{"run-setup":false, "dags-or-nbks-only-changes":false}' > /tmp/continuation-params.json
                fi

      merge-modular-configs:
        parameters:
          modules:
            description: Path to the file for the list of the modules to build
            type: string
            default: /tmp/modules-filtered.txt
          shared-config:
            description: Path to the config providing shared resources (such as prerequisite jobs and common commands)
            type: string
            default: .circleci/config.yml
          continue-config:
            description: Path to the internally-used config for continuation
            type: string
            default: .circleci/continue-config.yml
        steps:
          - run:
              name: Merge configs
              command: |
                # If `modules` is unavailable, stop this job without continuation
                if [ ! -f "<< parameters.modules >>" ] || [ ! -s "<< parameters.modules >>" ]
                then
                  echo 'Nothing to merge. Halting the job.'
                  circleci-agent step halt
                  exit
                fi

                # Convert a list of dirs to a list of config.yml
                sed -i -e 's/$/\/.circleci\/config.yml/g' "<< parameters.modules >>"

                # If `shared-config` exists, append it at the end of `modules`
                if [ -f << parameters.shared-config >> ]
                then
                  echo "<< parameters.shared-config >>" >> "<< parameters.modules >>"
                fi

                xargs -a "<< parameters.modules >>" yq -y -s 'reduce .[] as $item ({}; . * $item)' | tee "<< parameters.continue-config >>"

    jobs:
      # The job for the setup workflow
      setup-dynamic-config:
        parameters:
          modules:
            description: Directories which should be tested for changes; one directory per line. Each directory must have `.circleci/config.yml`.
            type: string
          base-revision:
            description: Revision to compare with the current HEAD
            type: string
            default: main
          force-all:
            description: Emergency valve - forcibly build all the modules
            type: boolean
            default: false
          modules-filtered:
            description: Path to the file where the filtered list of modules is generated
            type: string
            default: /tmp/modules-filtered.txt
          shared-config:
            description: Path to the config providing shared resources (such as prerequisite jobs and common commands)
            type: string
            default: .circleci/config.yml
          continue-config:
            description: Path to the internally-used config for continuation
            type: string
            default: .circleci/continue-config.yml
        docker:
          - image: cimg/python:3.11.9
        steps:
          - checkout
          - run:
              name: Handle Python version
              command: |
                # Remove the .python-version file completely
                rm -f .python-version
          - run:
              name: Install yq
              command: pip install yq
          - list-changed-modules:
              modules: << parameters.modules >>
              modules-filtered: << parameters.modules-filtered >>
              base-revision: << parameters.base-revision >>
              force-all: << parameters.force-all >>
          - merge-modular-configs:
              modules: << parameters.modules-filtered >>
              shared-config: << parameters.shared-config >>
              continue-config: << parameters.continue-config >>
          - continuation/continue:
              configuration_path: << parameters.continue-config >>
              parameters: /tmp/continuation-params.json
           