# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'nubeproduct'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'nubeproduct'

dispatch:
  - macro_namespace: dbt
    search_order: ['nubeproduct', 'databricks', 'spark', 'dbt']

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"
  - "logs"

vars:
  'dbt_date:time_zone': 'America/Argentina/Buenos_Aires'

# Configuring models
models:
  nubeproduct:  # project name

    staging:
      +materialized: table
      +schema: staging
      +file_format: delta
      +tags: ["core"]
      +meta:
        openmetadata:
          tier: 'Tier.Silver'
      +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/staging/"
      +post-hook:
        # testing_unity_staging
        - "CREATE TABLE IF NOT EXISTS {{ var('mirror_catalog') }}.{{ this.schema }}.{{ this.identifier }} USING DELTA LOCATION '{{ 
                ('s3://dn-lkh-dev01' if target.name == 'dev' else 's3://dn-lkh-products-prd01') 
                ~ '/data-dev-dbt-products/' 
                ~ (this.schema | replace('testing_', '') | replace('data_', '')) 
                ~ '/' 
                ~ this.identifier 
             }}'"

    intermediate:
      +materialized: ephemeral
      operations:
        +tags: ["operations"]
      partners:
        +tags: ["partners"]
      finance:
        +tags: ["finance"]
      fintech:
        +tags: ["fintech"]
      logistics:
        +tags: ["logistics"]
      marketing:
        +tags: ["marketing"]
      marketing_automation:
        +tags: ["marketing_automation"]
      midmarket:
        +tags: ["midmarket"]
      product:
        +tags: ["product"]
      support:
        +tags: ["support"]
      dimensions:
        +tags: ["dimensions"]
      onboarding:
        +tags: ["onboarding"]
      merchant:
        +tags: ["merchant"]
      partnerships:
        +tags: ["partnerships"]
      cx:
        +tags: ["cx"]
      billing:
        +tags: ["billing"]

    data_product:
      +materialized: table
      +file_format: delta
      +meta:
        openmetadata:
          tier: 'Tier.Gold'

      operations:
        +schema: operations
        +tags: ["operations"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/operations/"

      partners:
        +schema: partners
        +tags: ["partners"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/partners/"

      finance:
        +schema: finance
        +tags: ["finance"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/finance/"

      fintech:
        +schema: fintech
        +tags: ["fintech"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/fintech/"

      logistics:
        +schema: logistics
        +tags: ["logistics"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/logistics/"

      marketing:
        +schema: marketing
        +tags: ["marketing"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/marketing/"

      marketing_automation:
        +schema: marketing_automation
        +tags: ["marketing_automation"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/marketing_automation/"

      midmarket:
        +schema: midmarket
        +tags: ["midmarket"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/midmarket/"

      product:
        +schema: product
        +tags: ["product"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/product/"

      support:
        +schema: support
        +tags: ["support"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/support/"

      dimensions:
        +schema: dimensions
        +tags: ["dimensions"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/dimensions/"

      onboarding:
        +schema: onboarding
        +tags: ["onboarding"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/onboarding/"

      merchant:
        +schema: merchant
        +tags: ["merchant"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/merchant/"

      partnerships:
        +schema: partnerships
        +tags: ["partnerships"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/partnerships/"

      cx:
        +schema: cx
        +tags: ["cx"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/cx/"

      billing:
        +schema: billing
        +tags: ["billing"]
        +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_product/billing/"

      +post-hook:
        # testing_unity_{domain}, donde {domain} = this.schema (marketing, finance, etc.)
        - "CREATE TABLE IF NOT EXISTS {{ var('mirror_catalog') }}.{{ this.schema }}.{{ this.identifier }} USING DELTA LOCATION '{{ 
              ('s3://dn-lkh-dev01' if target.name == 'dev' else 's3://dn-lkh-products-prd01') 
              ~ '/data-dev-dbt-products/data_product/' 
              ~ (this.schema | replace('testing_', '') | replace('data_', '')) 
              ~ '/' 
              ~ this.identifier 
           }}'"

# on-run-end:
#   - "{{ dbt_artifacts.upload_results(results) }}"

seeds:
  nubeproduct:
    +schema: manual
    +file_format: delta
    +location_root: "s3://{{ 'dn-lkh-dev01' if target.name == 'dev' else 'dn-lkh-products-prd01' }}/data-dev-dbt-products/data_manual/"
    +post-hook:
      - "OPTIMIZE {{ this }}"
      - "ALTER TABLE {{ this }} SET TBLPROPERTIES ( \
            delta.autoOptimize.optimizeWrite = true, \
            delta.autoOptimize.autoCompact = true \
          )"
      - "VACUUM {{ this }} RETAIN 168 HOURS"

vars:
  mirror_hms_prefix: "{{ 'testing_unity_dev' if target.name == 'dev' else 'testing_unity_prd' }}"
  mirror_catalog: "{{ 'hive_metastore' if target.name == 'dev' else 'hive_metastore' }}"
  'dbt_date:time_zone': 'America/Argentina/Buenos_Aires'
  required_docs_fail_on_error: true
  required_docs_skip_models: []
