      - name: checkout_filled_shipping_last_name_timestamp
        description: If the cart completed last name field, this field shows its timestamp.
      - name: checkout_filled_shipping_phone_timestamp
        description: If the cart completed phone field, this field shows its timestamp.
      - name: checkout_clicked_shipping_continue_timestamp
        description: If the cart clicked shipping continue (A step that separates contact information from shipping information), this field shows its timestamp.
      - name: checkout_clicked_shipping_continue_to_payment_timestamp
        description: If the cart advanced to payment step, this field shows its timestamp.
      - name: checkout_filled_billing_id_number_timestamp
        description: If the cart completed billing id field, this field shows its timestamp.
      - name: checkout_checked_billing_same_address_timestamp
        description: If the cart checked that billing information is the same as shipping information, this field shows its timestamp.
      - name: checkout_filled_billing_country_timestamp
        description: If the cart completed billing country field, this field shows its timestamp.
      - name: checkout_filled_billing_business_name_timestamp
        description: If the cart completed billing business name field, this field shows its timestamp.
      - name: checkout_filled_billing_trade_name_timestamp
        description: If the cart completed billing trade name field, this field shows its timestamp.
      - name: checkout_filled_billing_state_registration_timestamp
        description: If the cart completed state registration field, this field shows its timestamp.
      - name: checkout_filled_billing_business_activity_timestamp
        description: If the cart completed business activity field, this field shows its timestamp.
      - name: checkout_selected_payment_method_timestamp
        description: If the cart selected payment method, this field shows its timestamp.
      - name: checkout_clicked_payment_complete_order_timestamp
        description: If the cart clicked on complete order, this field shows its timestamp.
      - name: checkout_order_placed_timestamp
        description: If the cart successfully generated an order, this field shows its timestamp.
      - name: checkout_order_placed_timestamp
        description: If the order was paid, this field shows its timestamp.
      - name: wallet
        description: Contains information about Wallet usage on the cart.
      - name: payment_method_name
        description: Payment method selected on checkout_selected_payment_method step.
      - name: payment_method_type
