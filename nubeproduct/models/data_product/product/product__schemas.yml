    config:
      meta:
        tech_steward: "sol.abelleyro@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"    
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:   
          - id
          - store_id
    columns:
      - name: id
        description: id for the order
        tests:
          - not_null
          - unique
      - name: order_completed_at
        description: date checkout completed 
      - name: payment_status
        description: the payment status of the order
      - name: status
        description: the status of the order
      - name: gmv_usd
        description: total amount of the order in USD (includes shipping costs and any discounts applied)
      - name: order_year_month_day_code
        description: partition field from the orders table
      - name: store_id
        description: merchant's store id
        tests:
          - not_null
      - name: was_order_edited
        description: 1 if the order has been edited, 0 otherwise
      - name: order_first_edited_at
        description: the date when the order was first edited
      - name: order_last_edited_at
        description: the date when the order was last edited      
      - name: order_edit_count
        description: the total number of times the order has been edited
      - name: state
        description: the state of the merchant. State_Ok > 0 it is not a trial and we are receiving the payments as expected - awaiting_payment > 1 during the first 10 days after the contract expires - admin_down > 2 from day 10 to day 20 after the contract is expired, admin is blocked (but the store is still live) - store_down > 3 the store is blocked from day 20, we consider it as a churn - state_test > 4 a store created as a test by someone from our company, it is not a trial - state_in_development > 5 stores created via Partners Portal while they are being set up.
      - name: country
        description: merchant's country (from the store_info table)
      - name: currency
        description: merchant's currency (from the store_info table)
      - name: current_segment
        description: merchant's current segment
      - name: first_payment
        description: the date when the merchant made their first payment
      - name: churned_at
        description: the date when the merchant churned
      - name: plan_name
        description: the group name of the merchant's plan (using operations__grouping_plans data product) 
      - name: created_at
        description: the date when the merchant was created
      - name: verified
        description: 1 if the merchant is verified, 0 otherwise
      - name: store_has_edit_orders_available
        description: 1 if the merchant has the edit orders feature available, 0 otherwise (based on tags)
      - name: store_edit_orders_available_at
        description: the date when the edit orders feature was made available to the merchant (tag was added)
      - name: store_edit_orders_user
        description: 1 if the merchant has used the edit orders feature, 0 otherwise
      - name: store_edit_first_use
        description: the date when the merchant first used the edit orders feature
      - name: store_edit_last_use
        description: the date when the merchant last used the edit orders feature
      - name: store_edit_count
        description: the total number of times the merchant has used the edit orders feature (only editing tools present in orders_edit_history)
      - name: sys_audit_created_on
        description: the date when the record was created
      - name: sys_audit_updated_on
        description: the date when the record was updated


  - name: product_orders_b2b
    description: >
      This data product contains all basic information for b2b orders.
      The goal of this data product is to minimize time to access the data and it also has been used to learn how to create a dbt model.
    config:
      meta:
        tech_steward: "matias.scasso@tiendanube.com"
        domain: "product"
        business_owner: "Wagner Moynier"
    columns:
      - name: id
        description: "Unique identifier for the b2b order"
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('orders__mwp_orders')
              field: id
      - name: store_id
        description: "Store id associated with the order"
        tests:
          - not_null
          - relationships:
              to: ref('moltres__mwp_store_info')
              field: store_id
      - name: domain
        description: "Domain associated with the order"
      - name: country
        description: "Country associated with the order"
      - name: state
        description: "State of the store"
      - name: plan
        description: "Plan of the store"
      - name: price_table_id
        description: "Wholesale pricetable id associated with the order"
      - name: percentage_applied
        description: "Percentage of discount applied to the order for being a wholesale order"
      - name: completed_at
        description: "Timestamp when the order was completed"
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."



