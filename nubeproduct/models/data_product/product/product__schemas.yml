      meta:
        owner: "fabrizio.crivella@tiendanube.com"
        business_owner: "Rocio Diez"
        openmetadata:
          domain: "product"
    columns:
      - name: cart_id
        description: Unique identifier of cart.
        tests:
          - not_null
      - name: store_id
        description: Unique identifier of store.
        tests:
          - not_null
      - name: checkout_start_timestamp
        description: If the cart iniciated Checkout, this field shows its timestamp.
      - name: checkout_filled_email_timestamp
        description: If the cart completed email field, this field shows its timestamp.
      - name: checkout_filled_shipping_zipcode_timestamp
        description: If the cart completed zipcode field, this field shows its timestamp.
      - name: checkout_selected_shipping_method_timestamp
        description: If the cart selected shipping method, this field shows its timestamp.
