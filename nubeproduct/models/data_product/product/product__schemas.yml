  - name: g__nuvem_chat__onboarding_funnel__agg_weekly
    description: >
      Weekly aggregated data product that provides counts of NuvemChat stores across different funnel stages (enabled, installed, started_trial, have_paid, churned) 
      grouped by merchant characteristics (plan, state, segment, country). Creates one row per week per combination of these characteristics 
      with aggregated counts for weekly new transitions and cumulative totals. Each week's data is a historical snapshot that never changes.
    config:
      meta:
