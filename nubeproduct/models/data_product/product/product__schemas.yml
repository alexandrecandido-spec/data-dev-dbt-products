    config:
      meta:
        owner: "sol.abelleyro@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"    
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:   
          - id
          - store_id
    columns:
      - name: id
        description: id for the order
        tests:
          - not_null
          - unique
      - name: order_completed_at
        description: date checkout completed 
      - name: payment_status
        description: the payment status of the order
      - name: status
        description: the status of the order
      - name: gmv_usd
        description: total amount of the order in USD (includes shipping costs and any discounts applied)
      - name: order_year_month_day_code
        description: partition field from the orders table
      - name: store_id
        description: merchant's store id
        tests:
          - not_null
      - name: was_order_edited
        description: 1 if the order has been edited, 0 otherwise
      - name: order_first_edited_at
        description: the date when the order was first edited
      - name: order_last_edited_at
        description: the date when the order was last edited      
      - name: order_edit_count
        description: the total number of times the order has been edited
      - name: state
        description: the state of the merchant. State_Ok > 0 it is not a trial and we are receiving the payments as expected - awaiting_payment > 1 during the first 10 days after the contract expires - admin_down > 2 from day 10 to day 20 after the contract is expired, admin is blocked (but the store is still live) - store_down > 3 the store is blocked from day 20, we consider it as a churn - state_test > 4 a store created as a test by someone from our company, it is not a trial - state_in_development > 5 stores created via Partners Portal while they are being set up.
      - name: country
        description: merchant's country (from the store_info table)
      - name: currency
        description: merchant's currency (from the store_info table)
      - name: current_segment
        description: merchant's current segment
      - name: first_payment
        description: the date when the merchant made their first payment
      - name: churned_at
        description: the date when the merchant churned
      - name: plan_name
        description: the group name of the merchant's plan (using operations__grouping_plans data product) 
      - name: created_at
        description: the date when the merchant was created
      - name: verified
        description: 1 if the merchant is verified, 0 otherwise
      - name: store_has_edit_orders_available
        description: 1 if the merchant has the edit orders feature available, 0 otherwise (based on tags)
      - name: store_edit_orders_available_at
        description: the date when the edit orders feature was made available to the merchant (tag was added)
      - name: store_edit_orders_user
        description: 1 if the merchant has used the edit orders feature, 0 otherwise
      - name: store_edit_first_use
        description: the date when the merchant first used the edit orders feature
      - name: store_edit_last_use
        description: the date when the merchant last used the edit orders feature
      - name: store_edit_count
        description: the total number of times the merchant has used the edit orders feature (only editing tools present in orders_edit_history)
      - name: sys_audit_created_on
        description: the date when the record was created
      - name: sys_audit_updated_on
        description: the date when the record was updated


  - name: product_orders_b2b
    description: >
      This data product contains all basic information for b2b orders.
      The goal of this data product is to minimize time to access the data and it also has been used to learn how to create a dbt model.
    config:
      meta:
        owner: "matias.scasso@tiendanube.com"
        domain: "product"
        business_owner: "Wagner Moynier"
    columns:
      - name: id
        description: "Unique identifier for the b2b order"
        tests:
          - not_null
          - unique
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('orders__mwp_orders')
              field: id
      - name: store_id
        description: "Store id associated with the order"
        tests:
          - not_null
          - relationships:
              to: ref('moltres__mwp_store_info')
              field: store_id
      - name: domain
        description: "Domain associated with the order"
      - name: country
        description: "Country associated with the order"
      - name: state
        description: "State of the store"
      - name: plan
        description: "Plan of the store"
      - name: price_table_id
        description: "Wholesale pricetable id associated with the order"
      - name: percentage_applied
        description: "Percentage of discount applied to the order for being a wholesale order"
      - name: completed_at
        description: "Timestamp when the order was completed"
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: product_platform_development_problems
    description: 
      This data product contains the informacion of the github problems tailored for platform development.
      The goal of this dataproduct is to correct the way platform development tracks the open and closed problems individualy by country and improve the kpi trackings.
    config:
      meta:
        owner: "fernando.martinez@tiendanube.com"
        domain: "product"
        business_owner: "Nicolas Loreti"
    columns:
      - name: unique_issue_country
        description: "unique key for the dataproduct."
        tests:
          - not_null
          - unique
      - name: registered_month
        description: "month in which the issue is active"
        tests:
          - not_null
      - name: issue_number
        description: "Unique identifier for the issue"
        tests:
          - not_null
      - name: title
        description: "title of the problem"
        tests:
          - not_null
      - name: repo_name
        description: "repository in which the problem is located"
        tests:
          - not_null
      - name: state
        description: "state of the problem, open or closed"
        tests:
          - not_null
      - name: labels_tipo
        description: "Team assigned to the problem based on its tags."
      - name: platform_country_state
        description: "Status of the problem based on the specific country tags and problem status. it corrects the status for each country affecting it."
      - name: created_at
        description: "date the problem was created"
        tests:
          - not_null
      - name: ticket_closed_at
        description: "date the problem was closed"
      - name: label_closed_date
        description: "date in which the solved_by_app tag was created"
      - name: min_close_date
        description: "minimum date between ticket_closed_at and label_closed_date. it is used to correct the closing date for each country"
      - name: labels_domain
        description: "app domains affected by the problem"
      - name: country
        description: "country affected by the problem. this country might be determined by the country tags, the stores affected by the problem or the solved_by_app tags"
      - name: is_solved_by_app_country
        description: "determines if the problem was solved by the country"
      - name: has_non_tech_enable_tag
        description: "determines if the problem has the non_tech_enable tag"
      - name: has_product_dependent_tag
        description: "determines if the problem has the product_dependent tag"
      - name: max_comments
        description: "total ammount of comments in the problem"
      - name: impacted_stores
        description: "total ammount of stores impacted by the problem"
      - name: dealbreakers
        description: "total ammount of dealbreakers by the problem"
      - name: high_impacted_stores
        description: "total ammount of high impact stores affected by the problem"
      - name: impacted_gmv
        description: "impacted GMV in local currency by the problem"
      - name: impacted_gmv_usd
        description: "impacted GMV in USD by the problem"  

  - name: product_platform_development_issues
    description: 
      This data product contains the informacion of the github issues tailored for platform development.
      The goal of this dataproduct is to correct the way platform development tracks the open and closed problems individualy by country and improve the kpi trackings.
    config:
      meta:
        owner: "fernando.martinez@tiendanube.com"
        domain: "product"
        business_owner: "Nicolas Loreti"
    columns:
      - name: unique_issue_country
        description: "unique key for the dataproduct."
        tests:
          - not_null
          - unique
      - name: registered_month
        description: "month in which the issue is active"
        tests:
          - not_null
      - name: ticket_number
        description: "Unique identifier for the issue"
        tests:
          - not_null
      - name: state
        description: "state of the issue. might be open or closed"
        tests:
          - not_null
      - name: created_at
        description: "date in which the issue was created"
        tests:
          - not_null
      - name: days_open
        description: "ammount of days the issue is or was opened"
        tests:
          - not_null
      - name: closed_at
        description: "date in which the issue was closed. might be null if the issue is still open"
      - name: title
        description: "Name of the issue"
        tests:
          - not_null
      - name: labels_tipo
        description: "Label for the team which the issue was tagged to"
      - name: labels_domain
        description: "App Domain the issue is tagged to"
      - name: labels_country
        description: "Country the Issue is tagged"
      - name: issue_country
        description: "Country the issue is tagged"
      - name: store_country
        description: "country of the stores impacted by the issue"
      - name: url
        description: "URL link to the github repository where the issue is located"
      - name: labels
        description: "All of the labels the issue has"
      - name: has_non_tech_enable_tag
        description: "identifier if the issue has the tag non_tech_enable"
      - name: has_product_dependent_tag
        description: "identifier if the issue has the tag product_dependent"
      - name: has_app_improvement_tag
        description: "identifier if the issue has the tag app_improvement"
      - name: has_new_app_or_integration_tag
        description: "identifier if the issue has the tag new_app_or_integration"
        
  - name: product_platform_issues_and_problem_tag_errors
    description: 
      This dataproduct contains the errors in the tags of the issues and problems.
      It helps the platform team to identify and fix the errors in the tags of the issues and problems for further better tracking of the issues and problems.
    config:
      meta:
        owner: "fernando.martinez@tiendanube.com"
        domain: "product"
        business_owner: "Nicolas Loreti"
    columns:
      - name: unique_issue_repo
        description: "unique key for the dataproduct."
        tests:
          - not_null
          - unique
      - name: ticket_number
        description: "Unique identifier for the issue"
        tests:
          - not_null
      - name: repo_name
        description: "repository in which the issue is located"
        tests:
          - not_null
      - name: state
        description: "state of the issue, open or closed"
        tests:
          - not_null
      - name: created_at
        description: "date the issue was created"
        tests:
          - not_null
      - name: closed_at
        description: "date the issue was closed (nullable for open issues)"
      - name: title
        description: "title of the issue"
        tests:
          - not_null
      - name: url
        description: "url of the issue"
        tests:
          - not_null
      - name: labels
        description: "labels of the issue"
        tests:
          - not_null
      - name: labels_tipo
        description: "type of issue based on its tags"
        tests:
          - not_null
      - name: labels_domain
        description: "app domains affected by the issue"
      - name: labels_country
        description: "country affected by the issue. this country might be determined by the country tags, the stores affected by the issue or the solved_by_app tags"
      - name: has_platform_development_tag
        description: "determines if the issue has the platform development tag"
      - name: is_solved_by_app_br
        description: "determines if the issue was solved by the app in Brazil"
      - name: is_solved_by_app_ar
        description: "determines if the issue was solved by the app in Argentina"
      - name: is_solved_by_app_mx
        description: "determines if the issue was solved by the app in Mexico"
      - name: is_solved_by_app_cl
        description: "determines if the issue was solved by the app in Chile"
      - name: is_solved_by_app_co
        description: "determines if the issue was solved by the app in Colombia"
      - name: domains_label_missing
        description: "determines if the issue has the domains label missing"
      - name: country_tag_missing
        description: "determines if the issue has any country tag missing"
      - name: store_country_missin_tag
        description: "determines if the issue has any store country tag missing"
      - name: store_countries
        description: "countries of the stores affected by the issue"
      - name: missing_countries_tags
        description: "countries missing from the issue"
      - name: platform_development_tag_missing
        description: "determines if the issue has the platform development tag missing"
      - name: solved_by_app_tag_missing
        description: "determines if the issue has the solved by app tag missing for each country. if the problem has the BR tag but does not have the solved_by_app_br tag, then this column will be true for the BR country"
      - name: solved_by_app_missing_countries
        description: "countries missing from the issue"
      - name: sys_audit_created_on
        description: "date the issue was created"
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "date the issue was updated"
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "user who created the issue"
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "user who updated the issue"
        tests:
          - not_null


models:
  - name: product__offline_subscriptions
    description: >
      Contains the list of valid offline plan subscriptions per store, enriched with plan type, duration,
      cost per transaction (CPT), and billing cycle information. This table supports product analytics
      on plan usage and lifecycle in the offline context.
    config:
      meta:
        owner: "barbara.marques@nuvemshop.com.br"
        business_owner: "Tomas Musich"
        openmetadata:
          domain: "product"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
            - subscription_id
    columns:
      - name: subscription_id
        description: Unique identifier of the plan subscription.
        tests:
          - not_null
          - unique
      - name: store_id
        description: Store associated with the subscription.
        tests:
          - not_null
      - name: plan_name
        description: Name or category of the subscribed plan (lowercased).
        tests:
          - not_null
      - name: plan_type
        description: >
          Type of the plan. Classified as 'trial' when the plan category contains the word 'trial',
          otherwise classified as 'regular'.
        tests:
          - not_null
          - accepted_values:
              values: ['trial', 'regular']
      - name: start_date
        description: Date when the subscription started.
        tests:
          - not_null
      - name: effective_end_date
        description: >
          Adjusted end date for the subscription. If there's a subsequent subscription,
          this is set to one second before its start. Otherwise, it falls back to the actual end date
          or a far-future timestamp when no end is defined.
      - name: next_start_date
        description: Start date of the user's subsequent subscription, if it exists. Used in churn-related metrics and analysis.
      - name: cpt
        description: Cost per transaction applied to the subscription, including manual overrides.
        tests:
          - not_null
      - name: bill_cycle
        description: >
          Number of billing cycles estimated from the subscription duration.
          Calculated as the number of 30-day periods between start and effective_end_date,
          with a minimum value of 1.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1

  - name: product_orders_saved_searches
    description:  This data product contains information on usage of the saved searches feature within the orders admin. Each row will have information of a specific saved search with data on what filters are included in the saved search, if that saved search is custom or not, the order in which the merchant has position that saved search, if it is hidden or not, etc. If a saved search is modified, this table will only store the latest version of the saved search. Additionally, if a saved search is deleted, this table will not store that saved search anymore.
    config:
      meta:
        owner: "sol.abelleyro@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"    
    columns:
      - name: saved_search_id
        description: "unique identifier for the saved search"
