  - name: product__non_user_sessions
    description: >
      Data product that contains sessions with high probability of not being user sessions, like merchant sessions or developer tests.
      The rationale and detailed information can be found in the Notion document titled "Modelagem inicial de sessões com UTMs recuperadas 
      e filtragem por qualidade de tráfego e lojas válidas".
      Accessible at: https://www.notion.so/Modelagem-inicial-de-sess-es-com-UTMs-recuperadas-e-filtragem-por-qualidade-de-tr-fego-e-lojas-v-lid-25685d24ee8f80829dc0d9d32975df3c#27e85d24ee8f805d8fd9d233f9c8e5f1
