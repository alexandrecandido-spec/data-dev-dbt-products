      - name: session_timestamp
        description: "Timestamp of the first session matched to the cart via unique_session_key."
      - name: session_base_date
        description: "Base date of the matched session."
      - name: visitor_country
        description: "Country of the visitor as reported in the session."
      - name: ref_domain
        description: "Normalized domain extracted from the referrer URL of the matched session."
      - name: land_domain
        description: "Normalized domain extracted from the landing page URL of the matched session."
      - name: source_name
        description: "Classified traffic source for the session (e.g., Google, Meta, Direct)."
      - name: source_group
        description: "Grouped source channel (e.g., Meta, Alphabet, AI Sources)."
      - name: google_subchannel
        description: "Google subchannel, if available (e.g., Shopping, Search)."
      - name: traffic_type
        description: "Indicates whether the session came from paid or organic traffic."
      - name: is_end_user
        description: "Boolean flag indicating whether the session is likely from a real end-user."
