  - name: s__orders__merchants_auto_cancel_configs__link
    description: > 
      Contains a list of all merchants and their auto cancel configs (if any)
    config:
      meta:
        owner: "sol.abelleyro@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns:
      - name: unique_key
        description: "Unique key for the auto cancel config being set up. If the merchant in the row has no configs, the unique key will be the store_id."
        tests:
          - not_null
          - unique
      - name: store_id
        description: "Store id."
      - name: state
        description: the state of the merchant. State_Ok > 0 it is not a trial and we are receiving the payments as expected - awaiting_payment > 1 during the first 10 days after the contract expires - admin_down > 2 from day 10 to day 20 after the contract is expired, admin is blocked (but the store is still live) - store_down > 3 the store is blocked from day 20, we consider it as a churn - state_test > 4 a store created as a test by someone from our company, it is not a trial - state_in_development > 5 stores created via Partners Portal while they are being set up.
      - name: current_segment
        description: merchant's current segment
      - name: country
        description: merchant's country
      - name: plan
        description: the group name of the merchant's plan (using operations__grouping_plans data product) 
      - name: has_nuvempago
        description: 1 if the merchant has NuvemPago, 0 otherwise (based on if the merchant has nuvem-pago as a payment in at least one order in the past 12 months)
      - name: has_pagonube
        description: 1 if the merchant has Pagonube, 0 otherwise (based on if the merchant has pago-nube as a payment in at least one order in the past 12 months)
      - name: has_configed_feature
        description: 1 if the merchant has configured the auto cancel feature, 0 otherwise. The presence in the orders_auto_cancel_configuration table is enough to consider it configured (can be deactivated since)
      - name: first_config_at
        description: the date when the merchant configured the first auto cancel feature
      - name: overall_active
        description: 1 if the auto cancel feature is active, 0 otherwise (1 config active is enough)
      - name: last_overall_change_at
        description: the date when the last config was changed
      - name: update_stock
        description: 1 if the merchant's stock should be updated when orders are auto canceled, 0 otherwise
      - name: pre_notify_client
        description: 1 if the merchant should be notified before the auto cancel feature is activated, 0 otherwise
      - name: notify_client
        description: 1 if the merchant should be notified after the auto cancel feature is activated, 0 otherwise
      - name: payment_status
        description: the payment status the merchant is configurating auto cancel for
      - name: payment_method_active
        description: 1 if the specific auto cancel config is active, 0 otherwise
      - name: last_change_at
        description: the date when the specific config was last changed
      - name: payment_method
        description: the payment method the merchant is configurating auto cancel for
      - name: expiration_time
        description: the expiration time set for the specific auto cancel config
      - name: sys_audit_created_by
        description: the user who created the row
      - name: sys_audit_updated_on
        description: the date when the row was last updated
      - name: sys_audit_updated_by
        description: the user who last updated the row
  
