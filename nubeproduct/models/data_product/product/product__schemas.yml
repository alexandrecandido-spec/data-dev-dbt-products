  - name: g__traffic__session_carts__agg_daily
    description: >
      Gold model that aggregates sessions by store and traffic dimensions at a daily granularity,
      combining them with cart generation and paid order information. It is used to analyze
      acquisition effectiveness, conversion from session to cart, and directional GMV trends.
      --
      GMV-related fields are included solely for funnel tracking purposes. 
      For official revenue figures, refer to Finance data products and dashboards.
      --
      This model is updated incrementally, processing only the last 30 days from the most recent update.
      Therefore, cart updates are only tracked within 30 days after the original session occurred.
      --
      Data availability:
      - Sessions: from 2024-01-01 onwards
      - Cart linkage to sessions: from 2024-01-23 onwards
      --
      Full documentation available at:
      https://www.notion.so/Gold-g__traffic__session_carts__agg_daily-2a185d24ee8f80f69bb4fdfaf8dc3c5c
    config:
      meta:
        owner: "barbara.marques@nuvemshop.com.br"
        domain: "product"
        business_owner: "Tomas Musich"
    columns:
      - name: base_date
        description: "Partition date for the table, based on the session timestamp."
        tests: 
          - not_null
      - name: store_id
        description: "Store identifier where the session occurred."
        tests: 
          - not_null
      - name: country_code
        description: "Country of the store at the time of update (not necessarily at session time)."
        tests: 
          - not_null
      - name: vertical_name
        description: "Vertical classification of the store, captured at the model update."
      - name: current_plan_type
        description: "Type of the store plan, captured at the model update."
      - name: current_segment
        description: "Segment classification of the store (tiny, small, etc.), captured at the model update."
      - name: is_store_blocked
        description: "Whether the store was blocked, captured at the model update."
      - name: visitor_country
        description: "Country of the visitor based on latest update (not necessarily at session time)."
      - name: device
        description: "Device category (desktop, mobile, etc.) used in the session."
      - name: theme
        description: "Theme identifier of the storefront during the session."
      - name: source_name
        description: "Classified traffic source for the session (e.g., google, meta, direct)."
        tests: 
          - not_null
      - name: source_group
        description: "Grouped classification of `source_name` by parent company or channel family (e.g., meta, alphabet, ai sources)."
        tests: 
          - not_null
      - name: google_subchannel
        description: "Detailed classification of Google Ads campaigns by subchannel (e.g., pmax, shopping, search)."
      - name: traffic_type
        description: "Indicates whether the session came from paid or organic traffic."
        tests: 
          - not_null
      - name: is_end_user
        description: "Boolean flag indicating whether the session is likely from a real end-user."
        tests: 
          - not_null
      - name: storefront
        description: "Storefront domain accessed during the session (store, mobile, pos, etc)."
      - name: total_sessions
        description: "Count of sessions aggregated by the defined key."
      - name: total_unique_sessions
        description: "Count of unique sessions aggregated by the defined key. Must generate the same total as total_sessions."
      - name: total_unique_session_ids
        description: "Count of distinct session_id's aggregated by the defined key."
      - name: total_unique_consumer_ids
        description: "Count of distinct consumer_id's aggregated by the defined key."
      - name: total_sessions_with_carts
        description: "Count of carts matched to sessions aggregated by the defined key."
      - name: total_sessions_with_unique_carts
        description: "Count of unique carts matched to sessions aggregated by the defined key. Must generate the same total as total_sessions_with_carts."
      - name: total_sessions_with_paid_orders
        description: >
          Count of sessions where a cart resulted in a paid order.
          Attention: this is only for funnel reference. For official GMV data, please consult official dashboards and data models, by the Finance team.
      - name: total_usd_sessions_with_paid_orders
        description: >
          Sum of the total order value (USD) of sessions where a cart resulted in a paid order.
          Attention: this is only for funnel reference. For official GMV data, please consult official dashboards and data models, by the Finance team.
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created in this model."
        tests: 
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row in this model."
        tests: 
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp when the row was last updated in this model."
        tests: 
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row in this model."
        tests: 
          - not_null
    tests:
