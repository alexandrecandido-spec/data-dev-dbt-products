version: 2
models:
  - name: product_issues_and_problems_summary
    description: >
      Contains the summary of Issues and Problems with their respective comments and associated stores. 
    config:
      meta:
        owner: "fabrizio.crivella@tiendanube.com"
        business_owner: "Martin Palombo"
        openmetadata:
          domain: "product"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
            - repo_name
            - issue_number
            - store_id
    columns:
      - name: repo_name
        description: Type Issue/Problem
        tests:
          - not_null
      - name: issue_number
        description: Unique identifier of the Issue/Problem.
        tests:
          - not_null
      - name: store_id
        description: Store related to the Issue/Problem.
      - name: state
        description: Status of the Issue/Problem. It can be open or closed.
      - name: author
        description: Creator of the Issue/Problem.
      - name: wip_1_last_updated
        description: >
          Label that identifies if the Issue/Problem is on its first Working in Progress step. Each Issue/Problem
          may or may not be in a WIP status.
  
  - name: product_social_order_source
    description: >
      Data product que classifica a origem de tráfego de pedidos pagos, com base em parâmetros UTM,
      referrer e regras heurísticas. Utilizado para análise de performance de canais pagos e orgânicos.
    config:
      meta:
        owner: "gustavo.braga@nuvemshop.com.br"
        domain: "product"
        owner: "barbara.marques@nuvemshop.com.br"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
    columns:
      - name: order_id
        description: Identificador único do pedido.
        tests:
          - not_null

      - name: utm_source
        description: Parâmetro UTM de origem do tráfego.

      - name: utm_medium
        description: Parâmetro UTM de meio de tráfego.

      - name: http_referrer
        description: Referrer HTTP original da sessão de compra.

      - name: source
        description: Campo bruto de origem capturado no pedido.

      - name: source_details
        description: Detalhamento adicional sobre a origem (ex app_id, nome de campanha).

      - name: source_name
        description: Classificação consolidada da origem do tráfego (ex facebook, google, whatsapp, direct).

      - name: source_type
        description: Tipo de canal de aquisição — pago ou orgânico.

      - name: completed_at
        description: Timestamp de conclusão do pedido.

      - name: year_month_day_code
        description: Código da data no formato YYYYMMDD (usado para particionamento).

      - name: sys_audit_created_on
        description: Timestamp de criação do registro.

      - name: sys_audit_created_by
        description: Usuário ou processo que criou o registro.

      - name: sys_audit_updated_on
        description: Timestamp da última atualização do registro.

      - name: sys_audit_updated_by
        description: Usuário ou processo que atualizou o registro.



  - name: product_platform_mwp_apps_stores
    description: >
      Contains a clean version of the mwp_apps_stores tables after deleting the reinstallations made by the support team
    config:
      meta:
        owner: "fernando.martinez@tiendanube.com"
        domain: "product"
        business_owner: "Nicolas Loreti"
    columns:
      - name: store_app_id
        description: Unique store and app ids combination. used for unique key.
      - name: store_id
        description: store related to the app_id installed.
        tests:
          - not_null
      - name: app_id
        description: app_id installed by the store.
          - not_null
      - name: app_install_date
        description: date in which the app was installed.
          - not_null
      - name: app_uninstall_date
        description: app in which the app was uninstalled. in case of null, the app is still active.
      - name: sys_admin_created_at
        description: date in which the record was created.
      - name: sys_admin_updated_at
        description: date in which the record was last updated.

        
  - name: product_edit_orders
    description: >
      The goal of the edit orders feature is to allow merchants to edit different parts of their orders such as products, discounts and shipping address. The feature also includes a requote system for the cost of shipping.
      This data product contains all orders that have been edited and:
      > the type and details of the edit made (product, discount, shipping address)
      > data on the merchant (when the feature was enabled for them, when they first used it, etc)
      > The requotes that have been made on each fulfillment order after each edit
    config:
      meta:
        owner: "sol.abelleyro@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo" 
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:   
          - store_id
          - id
          - edit_id
          - line_edit_id
          - fulfillment_order_id
    columns:
      - name: edit_action_id
        description: unique id for each edit action (combines line_edit_id, edit_type, order_id, fulfillment_order_id). This is used to identify unique edits since id field constructed from the unions between individual edition tables may not be unique.
        tests:
          - unique
          - not_null
      - name: line_edit_id
        description: id for each action within an edition. There are multiple line_edit_id per edit_id (id from the individual edition tables that are unioned in union_edit_types)
        tests:
          - not_null
      - name: extra
        description: extra information about the line edit. This field includes the coupon id that was modified. If the edit is an edition of a coupon discount, it shows the old_coupon data (this helps distinguish edits on coupons vs adding a new coupon)
      - name: edit_type
        description: the type of edit (product, discount, shipping-address)
      - name: edit_action
        description: the action of the edit (add, remove, edit). This is the raw action from each of the individual edition tables that are unioned in union_edit_types. However, some additions in the discount table are actually edits. We can differentiate between the two by checking the extra field.
      - name: amount
        description: the amount of the edit when the type is discount (the value of the deleted/added discount)
      - name: amount_usd
        description: the amount of the edit when the type is discount in USD (the value of the deleted/added discount)
      - name: line_item_id
        description: the line item id (or product) of the edit when the type is product. This is the id of the product that was added/removed/edited.
      - name: previous_product_qty
        description: previous product amount in order
      - name: new_product_qty
        description: new product amount in order
      - name: edit_id
        description: id for the edition (edit_history table). Can include multiple actions in the same edition (2 products added, coupon removed, etc)
        tests:
          - not_null
      - name: edit_at
        description: the date when the edit was made (edit_history table)
      - name: edit_year_month_code
        description: partition field for edit_at (YYYYMM)
      - name: app_id
        description: the app id where the edit is made (2602 is new admin so not an external app)
      - name: skip_shipping_requote
        description: 1 if the merchant has skipped the shipping requote, 0 otherwise. This option was created because requoting fails at times, and this allows the merchant to save the edit anyways.
      - name: previous_total
        description: the total amount of the order before the edit (total includes shipping costs and any discounts applied)
      - name: total_delta
        description: the difference between the previous total and the total after the edit (total includes shipping costs and any discounts applied)
      - name: previous_total_usd
        description: the total amount of the order before the edit in USD (total includes shipping costs and any discounts applied)
      - name: total_delta_usd
        description: the difference between the previous total and the total after the edit in USD (total includes shipping costs and any discounts applied)
      - name: previous_subtotal
        description: the subtotal amount of the order before the edit (subtotal only includes products)
      - name: subtotal_delta
        description: the difference between the previous subtotal and the subtotal after the edit (subtotal only includes products)
      - name: previous_subtotal_usd
        description: the subtotal amount of the order before the edit in USD (subtotal only includes products)
      - name: subtotal_delta_usd
        description: the difference between the previous subtotal and the subtotal after the edit in USD (subtotal only includes products)
      - name: fulfillment_order_id
        description: shipping requotes happen by fulfillment order within each order.
      - name: previous_merchant_cost
        description: the previous merchant cost shipping
      - name: new_merchant_cost
        description: the new merchant cost shipping
      - name: previous_consumer_cost
        description: the previous consumer cost shipping
      - name: new_consumer_cost
        description: the new consumer cost shipping
      - name: previous_merchant_cost_usd
        description: the previous merchant cost shipping in USD
      - name: new_merchant_cost_usd
        description: the new merchant cost shipping in USD
      - name: previous_consumer_cost_usd
        description: the previous consumer cost shipping in USD
      - name: new_consumer_cost_usd
        description: the new consumer cost shipping in USD
      - name: id
        description: order id for each order
        tests:
          - not_null
      - name: order_completed_at
        description: date checkout completed 
        tests:
          - not_null
      - name: payment_status
        description: the payment status of the order
      - name: status
        description: the status of the order
      - name: gmv_usd
        description: total amount of the order in USD (includes shipping costs and any discounts applied)
      - name: was_order_edited
        description: 1 if the order has been edited, 0 otherwise
      - name: order_first_edited_at
        description: the date when the order was first edited
      - name: order_last_edited_at
        description: the date when the order was last edited
      - name: order_edit_count
        description: the total number of times the order has been edited
      - name: store_id
        description: merchant's store id
        tests:
          - not_null
      - name: state
        description: the state of the merchant. State_Ok > 0 it is not a trial and we are receiving the payments as expected - awaiting_payment > 1 during the first 10 days after the contract expires - admin_down > 2 from day 10 to day 20 after the contract is expired, admin is blocked (but the store is still live) - store_down > 3 the store is blocked from day 20, we consider it as a churn - state_test > 4 a store created as a test by someone from our company, it is not a trial - state_in_development > 5 stores created via Partners Portal while they are being set up.
      - name: country
        description: merchant's country (from the store_info table)
        tests:
          - not_null
      - name: currency
        description: merchant's currency (from the store_info table)
      - name: current_segment
        description: merchant's current segment
      - name: first_payment
        description: the date when the merchant made their first payment
      - name: churned_at
        description: the date when the merchant churned
      - name: plan_name
        description: the group name of the merchant's plan (using operations__grouping_plans data product) 
      - name: created_at
        description: the date when the merchant was created
      - name: verified
        description: 1 if the merchant is verified, 0 otherwise
      - name: store_has_edit_orders_available
        description: 1 if the merchant has the edit orders feature available, 0 otherwise (based on tags)
      - name: store_edit_orders_available_at
        description: the date when the edit orders feature was made available to the merchant (tag was added)
      - name: store_edit_orders_user
        description: 1 if the merchant has used the edit orders feature, 0 otherwise
      - name: store_edit_first_use
        description: the date when the merchant first used the edit orders feature
      - name: store_edit_last_use
        description: the date when the merchant last used the edit orders feature
      - name: store_edit_count
        description: the total number of times the merchant has used the edit orders feature (only editing tools present in orders_edit_history)
      - name: sys_audit_created_on
        description: the date when the record was created
      - name: sys_audit_updated_on
        description: the date when the record was updated

  - name: product_edit_orders_stores_enablement
