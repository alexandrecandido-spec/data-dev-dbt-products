  - name: s__traffic__session__event
    description: >
      Silver model that consolidates user sessions enriched with traffic source and traffic type classification.
      It integrates standardized UTM parameters, normalized referrer and landing domains, and end-user identification.
      This model serves as the canonical source of truth for traffic analysis, 
      attribution modeling, and acquisition performance tracking.
      Full documentation available at:
      https://www.notion.so/Silver-s__traffic__session__event-25685d24ee8f80829dc0d9d32975df3c
    config:
      meta:
        owner: "barbara.marques@nuvemshop.com.br"
        domain: "product"
        business_owner: "Tomas Musich"
    columns:
    - name: unique_session_key
      description: "Deterministic technical key for each session (MD5 of session_id, consumer_id, store_id)."
      tests:
        - not_null
        - unique
    - name: session_timestamp
      description: "Original timestamp of the session event."
      tests:
        - not_null
    - name: base_date
      description: "Partition date for the table, based on the session timestamp."
      tests:
        - not_null
    - name: session_id
      description: "Identifier of the session generated by the storefront visitor."
    - name: consumer_id
      description: "Identifier of the consumer (visitor) associated with the session."
    - name: store_id
      description: "Store identifier where the session occurred."
      tests:
        - not_null
    - name: visitor_country
      description: "Country of the visitor as reported in the session."
    - name: device
      description: "Device category (desktop, mobile, etc.) used in the session."
    - name: theme
      description: "Theme identifier of the storefront during the session."
    - name: user_agent
      description: "User agent string of the device/browser from the session."
    - name: ip_address
      description: "IP address of the visitor during the session."
    - name: utm_source
      description: "Normalized UTM parameter indicating the traffic source (original or extracted via fallback)."
    - name: utm_medium
      description: "Normalized UTM parameter indicating the traffic medium."
    - name: utm_campaign
      description: "Normalized UTM parameter indicating the traffic campaign."
    - name: utm_term
      description: "Normalized UTM parameter indicating the keyword used in paid search."
    - name: utm_content
      description: "Normalized UTM parameter indicating the ad creative or variation."
    - name: landing_page
      description: "Landing page URL of the session, extracted from the first navigation."
    - name: http_referral
      description: "Referrer URL from which the session originated."
    - name: ref_domain
      description: "Normalized domain extracted from the referrer URL (referral origin)."
    - name: land_domain
      description: "Normalized domain extracted from the landing page URL (destination)."
    - name: source_name
      description: Classified traffic source for the session (e.g., google, meta, direct).
      tests:
        - not_null
    - name: traffic_type
      description: Indicates whether the session came from paid or organic traffic.
      tests:
        - not_null
    - name: source_group
      description: Grouped classification of `source_name` by parent company or channel family (e.g., meta, alphabet, ai sources).
      tests:
        - not_null
    - name: google_subchannel
      description: Detailed classification of Google Ads campaigns by subchannel (e.g., pmax, shopping, search).
    - name: is_end_user
      description: Boolean flag indicating whether the session is likely from a real end-user.
      tests:
        - not_null
    - name: sys_audit_created_on
      description: "Timestamp when the row was originally created in this model."
      tests:
        - not_null
    - name: sys_audit_created_by
      description: "System or user that created the row in this model."
      tests:
        - not_null
    - name: sys_audit_updated_on
      description: "Timestamp when the row was last updated in this model."
      tests:
        - not_null
    - name: sys_audit_updated_by
      description: "System or user that last updated the row in this model."
      tests:
        - not_null

