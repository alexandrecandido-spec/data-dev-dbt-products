version: 2
models:
  - name: onboarding_preference_types 
    description: Table containing the sales channel chosen by the merchant. 
    config:
      meta:
        owner: "ynara.oliveira@nuvemshop.com.br"
        domain: "operations"
        business_owner: "Francisco Ramirez"
    columns:
      - name: store_id
        description: Merchant's unique identification code
        tests:
          - not_null
          - unique
      - name: created_at
        description: Merchant's creation date
        tests:
          - not_null
      - name: onboarding_type
        description: Merchant's sales channel, as selected in the pre-onboarding questionnaire
        tests:
          - not_null
          - accepted_values:
              values: ['Online', 'PDV', 'Chat', 'PDV + Online', 'PDV + Chat']
      - name: sys_audit_created_on
        description: "Timestamp of when this record was created in our data warehouse"
      - name: sys_audit_created_by
        description: "System identifier of the process that created this record"
      - name: sys_audit_updated_on
        description: "Timestamp of when this record was last updated in our data warehouse"
      - name: sys_audit_updated_by
        description: "System identifier of the process that last updated this record"
