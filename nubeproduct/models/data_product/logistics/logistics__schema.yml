version: 2

models:
  - name: logistics_billing__nuvem_envio
    description: >
      Unified billing dataset with enriched information per store and billing cycle.
      This data product includes store metadata, payment history, invoice details,
      and shipping costs (by carrier), ready for consumption by business areas.
      Only one record per store and billing_cycle_id is returned (rnk = 1).
    config:
      meta:
        owner: "gustavo.oliveira@nuvemshop.com.br"
        domain: "logistics"
        business_owner: "Mônica Orlando"
    columns:
      - name: store_id
        description: "Store identifier"
        tests: [not_null]
      - name: billing_cycle_id
        description: "Identifier of the billing cycle"
        tests: [not_null]
      - name: domain
        description: "Store's name"
      - name: cycle_status
        description: "Current status of the billing cycle"
      - name: payment_expiration_date
        description: "Due date for the billing cycle payment"
      - name: created_at
        description: "Date the billing cycle was created"
      - name: payment_history_paid_at
        description: "Date when the billing was paid"
      - name: id_type
        description: "Tax identifier type (e.g. CPF or CNPJ)"
      - name: id_number
        description: "CPF or CNPJ"
      - name: business_name
        description: "Legal business name of the merchant"
      - name: invoice_emission_date
        description: "Date the invoice was issued"
      - name: invoice_number
        description: "Invoice number"
      - name: billing_cycle_end_date
        description: "End date of the billing cycle period"
      - name: number
        description: "Receipt number"
      - name: original_payment_value
        description: "Original value before any adjustments"
      - name: payment_value
        description: "Final value due after adjustments"
      - name: adjustment_value
        description: "Value adjusted manually or via penalties/discounts"
      - name: invoice_value
        description: "Value declared in the invoice"
      - name: receipt_value
        description: "Value listed in the receipt"
      - name: penalty_value
        description: "Penalty applied to the billing cycle"
      - name: payment_method_fee_value
        description: "Fee applied due to selected payment method"
      - name: correios_cost_value
        description: "Shipping cost using Correios"
      - name: jadlog_cost_value
        description: "Shipping cost using Jadlog"
      - name: loggi_cost_value
        description: "Shipping cost using Loggi"
      - name: mandae_cost_value
        description: "Shipping cost using Mandae"

  - name: logistics_shipping__orders_shipping_options
    description: >
      Standardized view of the shipping options selected by customers when placing orders,
      specifically for shipments made via shipping apps.
    config:
      meta:
        owner: "gustavo.oliveira@nuvemshop.com.br"
        domain: "logistics"
        business_owner: "Simone Harnik"
    columns:
      - name: order_id
        description: "Order identifier"
        tests: [not_null, unique]
      - name: store_id
        description: "Store identifier"
        tests: [not_null]
      - name: shipping_option_result
        description: "Classification of shipping_option in the format Grouper - Partner - Service"
      - name: carrier_name
        description: "Grouper name"
      - name: shipping_partner
        description: "Partner name, if any"
      - name: year_month_code
        description: "Date of order creation in the format YearMonth"
      - name: shipping_service
        description: "Logistic service select by the client"

  - name: logistics_gsv__orders
    description: >
      Final materialized table that consolidates shipments in Brazil and paid orders
      not linked to shipments. It provides a unified view of logistics performance,
      including GSV, GMV, shipment type, carrier details, and Nuvem Envio adoption.
      This dataset feeds dashboards and financial/logistics reporting.
    config:
      meta:
        owner: "gustavo.oliveira@nuvemshop.com.br"
        domain: "logistics"
        business_owner: "Simone Harnik"
    columns:
      - name: shipment_id
        description: "Unique shipment identifier (either from fulfillment, delivery order, or paid order)."
        tests: [not_null, unique]
      - name: order_id
        description: "Unique order identifier"
      - name: delivery_order_id
        description: "Unique delivery order identifier"
      - name: payment_status
        description: "Payment status associated with the order/shipment (e.g., paid, cancelled, detatched)."
        tests: [not_null]
      - name: store_id
        description: "Store identifier related to the shipment."
        tests: [not_null]
      - name: domain
        description: "Domain of the store linked to the shipment."
      - name: current_segment
        description: "Current commercial segment of the store."
      - name: vertical_name
        description: "Vertical classification of the store."
      - name: plan
        description: "Commercial plan of the store."
      - name: store_creation_date
        description: "Date when the store was created in the platform."
      - name: store_state_name
        description: "State of the store (geographical or operational)."
      - name: completed_at
        description: "Date when the order was completed."
      - name: posted_at
        description: "Final posting date, either posted_at or completed_at."
      - name: postage_label_created_at
        description: "Date when the postage label was created."
      - name: shipment_type
        description: "Shipment classification (Fulfillment order, Paid order, Cancelled order, etc.)."
        tests: [not_null]
      - name: gsv
        description: "Gross Shipment Value associated with the shipment."
      - name: gmv
        description: "Gross Merchandise Value associated with the shipment."
      - name: flg_gsv
        description: "Flag indicating whether the record contributes to GSV (1=yes, 0=no)."
      - name: flg_gmv
        description: "Flag indicating whether the record contributes to GMV (1=yes, 0=no)."
      - name: flg_shipment
        description: "Flag indicating that the record represents a shipment."
      - name: flg_multicd
        description: "Flag indicating multiple fulfillments (multi-CD)."
      - name: flg_ne_selected
        description: "Flag indicating if Nuvem Envio was selected as the carrier."
      - name: flg_ne_enabled
        description: "Flag indicating if Nuvem Envio was enabled for the store."
      - name: selected_shipping_partner
        description: "Name of the selected shipping partner."
      - name: delivery_shipping_partner
        description: "Standardized shipping partner derived from carrier_code."
      - name: carriers
        description: "List of all carriers linked to the shipment (aggregated)."
      - name: delivery_status
        description: "Final delivery status (created, posted, etc.)."
      - name: country
        description: "Country of the store/shipment."
        tests:
          - accepted_values:
              values: ['BR', 'AR', 'MX']
      - name: sys_audit_created_on
        description: "System audit timestamp when the record was first created."
      - name: sys_audit_created_by
        description: "System audit user/process that created the record."
      - name: sys_audit_updated_on
        description: "System audit timestamp when the record was last updated."
      - name: sys_audit_updated_by
        description: "System audit user/process that last updated the record."

  - name: logistics_gsv__daily_summary
    description: >
      Daily aggregated table that summarizes shipments and orders in Brazil.
      Provides aggregated counts and values for both GSV and GMV,
      broken down by store, date, and segment. Used for reporting and monitoring
      logistics and sales performance trends.
    config:
      meta:
        owner: "gustavo.oliveira@nuvemshop.com.br"
        domain: "logistics"
        business_owner: "Simone Harnik"
    columns:
      - name: ref_date
        description: "Reference date for the aggregation (day granularity)."
        tests: [not_null]
      - name: store_id
        description: "Store identifier."
        tests: [not_null]
      - name: domain
        description: "Domain of the store."
      - name: current_segment
        description: "Current commercial segment of the store."
      - name: vertical_name
        description: "Vertical classification of the store."
      - name: plan
        description: "Commercial plan of the store."
      - name: store_creation_date
        description: "Date when the store was created in the platform."
      - name: store_state_name
        description: "State of the store (geographical or operational)."
      - name: country
        description: "Country of the store/shipment."
        tests:
          - accepted_values:
              values: ['BR', 'AR', 'MX']
      - name: sum_type
        description: "Type of value: GSV or GMV"
      - name: total_value
        description: "Aggregated GSV or GMV value for the day."
      - name: orders_qty
        description: "Total number of orders contributing to GMV on the given day."

  - name: g__operations__funnel_merchants__agg_daily
    description: "Merchant-level funnel tracking for Nuvem Envio adoption and engagement."
    config:
      meta:
        owner: "gustavo.oliveira@nuvemshop.com.br"
        domain: "logistics"
        business_owner: "Simone Harnik"
    columns:
      - name: granularity
        description: Defines the aggregation level of the metric (day, week, or month).
        tests:
          - not_null
          - accepted_values:
              values: ['day', 'week', 'month']
      - name: tier
        description: Funnel stage name representing each step in the merchant adoption flow.
        tests:
          - not_null
      - name: current_segment
        description: Merchant segmentation used for analytical grouping (e.g., SMB, Enterprise).
      - name: vertical_name
        description: Business vertical or industry category of the merchant.
      - name: plan
        description: Merchants subscription plan in Nuvemshop.
      - name: country
        description: ISO country code where the merchant operates.
        tests:
          - not_null
      - name: ref_period
        description: Reference date for the metric, corresponding to the defined granularity.
        tests:
          - not_null
      - name: qty
        description: Number of unique merchants that reached the funnel stage for that period.
        tests:
          - not_null
      - name: sys_audit_created_on
        description: Timestamp indicating when the record was first created in the data product.
      - name: sys_audit_created_by
        description: Identifier of the system or job that created the record.
      - name: sys_audit_updated_on
        description: Timestamp indicating the last update to the record.
      - name: sys_audit_updated_by
        description: Identifier of the system or job that last updated the record.

  - name: g__operations__funnel_orders__agg_daily
    description: "Order-level funnel analysis for tracking operational funnel conversion."
    config:
      meta:
        owner: "gustavo.oliveira@nuvemshop.com.br"
        domain: "logistics"
        business_owner: "Simone Harnik"
    columns:
      - name: tier
        description: Funnel stage name representing each step in the order journey.
        tests:
          - not_null
      - name: store_id
        description: Unique identifier of the merchant (store) associated with the order.
        tests:
          - not_null
      - name: domain
        description: Merchant domain name.
      - name: current_segment
        description: Merchant segmentation (e.g., SMB, Enterprise).
      - name: vertical_name
        description: Business vertical or industry category of the merchant.
      - name: plan
        description: Merchant subscription plan in Nuvemshop.
      - name: store_creation_date
        description: Date store was created on the platform.
      - name: store_state_name
        description: Merchant registered state or province name.
      - name: ref_date
        description: Reference date (daily) for the metric.
        tests:
          - not_null
      - name: ref_week
        description: Reference week start date for the metric.
        tests:
          - not_null
      - name: ref_month
        description: Reference month start date for the metric.
        tests:
          - not_null
      - name: country
        description: ISO country code where the merchant operates.
        tests:
          - not_null
      - name: qty
        description: Total number of shipments (orders) that reached the funnel stage.
        tests:
          - not_null
      - name: sys_audit_created_on
        description: Timestamp indicating when the record was first created in the data product.
      - name: sys_audit_created_by
        description: Identifier of the system or job that created the record.
      - name: sys_audit_updated_on
        description: Timestamp indicating the last update to the record.
      - name: sys_audit_updated_by
        description: Identifier of the system or job that last updated the record.
