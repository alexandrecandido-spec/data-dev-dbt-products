version: 2

sources:
  - name: dp_orders
    database: null
    schema: dp_orders
    tables:
      - name: recurring_orders

  - name: dp_orders
    database: null
    schema: orders
    tables:
      - name: mwp_order_products_deleted

  - name: dp_moltres
    database: null
    schema: moltres
    tables:
      - name: mwp_tags
      - name: mwp_plans
      - name: mwp_plans_countries
      - name: mwp_store_info
      - name: mwp_store_settings

  - name: dp_finances
    database: null
    schema: finances
    tables:
      - name: dp_currency_conversion

  - name: dp_finance
    database: null
    schema: dp_finance
    tables:
      - name: finance_exchange_rate
 
  - name: dp_credito
    description: "Source containing tables generated by the credit data team"
    database: null
    schema: credito_dev
    tables:
      - name: engine_offers
        description: "Offers generated by out engine"
      - name: policies
        description: "Credit policies defined by underwriting team"

  - name: dp_third_party
    database: null
    schema: third_party
    tables:
      - name: midmarket_hubspot_deals

  - name: dp_data_manual
    database: null
    schema: "{{ 'testing_manual' if target.name == 'dev' else 'data_manual' }}"
    tables:
      - name: operations__grouping_plans_aux
      - name: dimensions__segment_type
      - name: dimensions__region
      - name: logistics__shipping_classification

  - name: dp_uplift
    database: null
    schema: uplift
    tables:
      - name: distributions

  - name: dp_hubspot
    database: raw
    schema: hubspot
    tables:
      - name: deals_archived