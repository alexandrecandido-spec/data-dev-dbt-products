version: 2

sources:
  - name: dp_orders
    database: null
    schema: dp_orders
    tables:
      - name: recurring_orders
  - name: dp_moltres
    database: null
    schema: moltres
    tables:
      - name: mwp_tags
      - name: mwp_store_settings
      - name: mwp_plans_countries
      - name: mwp_plans
  - name: dp_finances
    database: null
    schema: finances
    tables:
      - name: dp_currency_conversion
  - name: dp_finance
    database: null
    schema: dp_finance
    tables:
      - name: finance_exchange_rate
  - name: dp_credito
    description: "Source containing tables generated by the credit data team"
    database: null
    schema: credito_dev
    tables:
      - name: engine_offers
        description: "Offers generated by out engine"
      - name: policies
        description: "Credit policies defined by underwriting team"
  - name: edit_history_and_requotes
    description: "Additional tables with edit history and requotes on each edition"
    database: null
    schema: orders
    tables:
      - name: orders_edit_history_shipping
        description: "Contains information about all requotes after an edit"
      - name: orders_edit_history
        description: "Contains information about all editions and their timestamps"