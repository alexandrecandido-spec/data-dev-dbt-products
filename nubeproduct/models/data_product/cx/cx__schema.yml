version: 2

models:
  - name: s__general__zendesk_user__ref
    meta:
      owner: "felipe.lorenzo@tiendanube.com"
      domain: "cx"
      business_owner: "gabriela.silva@nuvemshop.com.br"
    description: >
      User attributes for Zendesk integration from active stores.
      Deduplicated by email (priority: oldest user_id, then lowest store_id).
      Names formatted from first_name/last_name with fallback to 'User-{id}'.
      Phone numbers normalized to E.164 format with Argentine-specific handling.
    columns:
      - name: user_id
        description: "Unique identifier of the user. Primary key."
        tests:
          - not_null
          - unique
      - name: email
        description: "User email address. Unique. Deduplicated by oldest user_id, then lowest store_id. Non-null only."
        tests:
          - not_null
          - unique
      - name: name
        description: "User name. Format: 'First Last', 'First', 'Last', or 'User-{user_id}' (fallback)."
        tests:
          - not_null
      - name: phone
        description: "Store owner phone number in E.164 format. Format: '+' followed by 8-15 digits (e.g., +5491150081400). Null if unavailable or invalid."
        tests:
          - dbt_utils.expression_is_true:
              expression: "is null or (startswith(phone, '+') and regexp_like(phone, '^[+][0-9]{8,15}$'))"
      - name: has_store
        description: "Indicates if user has a store. Always true (filtered by active stores)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "= true"
      - name: user_is_partner
        description: "Indicates if user is also a partner. Boolean."
        tests:
          - not_null
      - name: partner_id
        description: "Partner ID. Null if user is not a partner."
      - name: organization_id
        description: "Zendesk organization id matched by external_id = store_id. Null if no match."
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: bigint
          - dbt_utils.expression_is_true:
              expression: "is null or organization_id > 0"
      - name: year_month_day_code
        description: "Partition key. Format: YYYYMMDD (integer)."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Row creation timestamp."
      - name: sys_audit_created_by
        description: "System/user that created the row."
      - name: sys_audit_updated_on
        description: "Row last update timestamp."
      - name: sys_audit_updated_by
        description: "System/user that last updated the row."

  - name: s__general__zendesk_groups__ref
    meta:
      owner: "felipe.lorenzo@tiendanube.com"
      domain: "cx"
      business_owner: "Carolina Leon"
    description: >
      Contains the list of Zendesk groups.
    columns:
      - name: group_id
        description: Unique identifier of the group. Unique key.
        tests:
          - not_null
          - unique
      - name: group_url
        description: URL of the group.
      - name: group_name
        description: Name of the group.
      - name: group_description
        description: Description of the group.
      - name: is_default
        description: Flag indicating if the group is the default group.
      - name: is_deleted
        description: Flag indicating if the group is deleted.
      - name: group_created_at
        description: Timestamp when the group was created.
      - name: sys_audit_created_on
        description: Timestamp when the row was originally created.
      - name: sys_audit_created_by
        description: System or user that created the row.
      - name: sys_audit_updated_on
        description: Timestamp when the row was last updated.
      - name: sys_audit_updated_by
        description: System or user that last updated the row.

  - name: s__general__zendesk_macros__ref
    meta:
      owner: "felipe.lorenzo@tiendanube.com"
      domain: "cx"
      business_owner: "Carolina Leon"
    description: >
      Contains the list of Zendesk macros.
    columns:
      - name: macro_id
        description: Unique identifier of the macro. Unique key.
        tests:
          - not_null
          - unique
      - name: macro_url
        description: URL of the macro.
      - name: macro_title
        description: Title of the macro.
      - name: macro_description
        description: Description of the macro.
      - name: is_active
        description: Flag indicating if the macro is active.
      - name: macro_created_at
        description: Timestamp when the macro was created.
      - name: comment_mode_is_public
        description: Flag indicating if the comment mode is public.
      - name: comment_value_html
        description: HTML content of the comment.
      - name: current_tags
        description: Current tags of the macro.
      - name: status
        description: Status of the macro.
      - name: restriction_type
        description: Type of the restriction.
      - name: restriction_id
        description: ID of the restriction.
      - name: restriction_ids
        description: IDs of the restrictions.
      - name: sys_audit_created_on
        description: Timestamp when the row was originally created.
      - name: sys_audit_created_by
        description: System or user that created the row.
      - name: sys_audit_updated_on
        description: Timestamp when the row was last updated.
      - name: sys_audit_updated_by
        description: System or user that last updated the row.
      - name: side_conversation_flg
        description: Flag indicating if the macro is for a side conversation.

  - name: s__general__zendesk_tickets_events_event
    description: >
      Table that containing the historical events of Zendesk tickets.
      Each record represents a change in a specific ticket field at a given timestamp.
      This dataset standardizes raw ticket audit data for analytical usage.
    meta:
      domain: "cx"
      owner: "valeria.nascimento@nuvemshop.com.br"
      business_owner: "Operations"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticket_id
            - event_id
    columns:
      - name: ticket_id
        description: "Unique identifier of the ticket in Zendesk."
        tests:
          - not_null
      - name: event_timestamp
        description: "Timestamp indicating when the event occurred (UTC)."
        tests:
          - not_null
      - name: event_id
        description: "Unique identifier of the event within the ticket's history."
        tests:
          - not_null
      - name: field_name
        description: "Name of the field that was changed in the event (e.g., status, group_id, assignee_id, satisfaction_score)."
        tests:
          - not_null
      - name: field_value
        description: "Value assigned to the field at the time of the event."
      - name: year_month_day_code
        description: "Date key in YYYYMMDD format used for partitioning and joining with date dimensions."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the row."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."
        tests:
          - not_null

  - name: s__general__zendesk_macro_usage_event
    description: >
      Table that captures Macro usage events from Zendesk ticket audits.
      Each record represents a macro applied to a ticket at a given timestamp,
      based on Zendesk audit logs (MacroAppliedEvent).
      The dataset standardizes raw audit data for analytical usage.
    meta:
      domain: "cx"
      owner: "valeria.nascimento@nuvemshop.com.br"
      business_owner: "Operations"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticket_id
            - audit_id
            - macro_id
    columns:
      - name: ticket_id
        description: "Unique identifier of the ticket in Zendesk."
        tests:
          - not_null
      - name: audit_id
        description: "Identifier of the audit entry where the macro was applied. Mirrors the Zendesk audit id."
        tests:
          - not_null
      - name: author_id
        description: "Zendesk user id that triggered the macro application (agent or system)."
        tests:
          - not_null
      - name: macro_id
        description: "Identifier of the macro applied to the ticket."
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the macro was applied (UTC)."
        tests:
          - not_null
      - name: year_month_day_code
        description: "Date key in YYYYMMDD format used for partitioning and joining with date dimensions."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the row."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."
        tests:
          - not_null
  
  - name: s__general__zendesk_chats_event
    description: >
      Table that captures chat messages derived from Zendesk ticket audits history
      (e.g., ChatMessage items). Each record represents a single message in the
      conversation timeline for a ticket. The index column provides a
      chronological, sequential position for the message inside each ticket.
    meta:
      domain: "cx"
      owner: "valeria.nascimento@nuvemshop.com.br"
      business_owner: "Operations"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticket_id
            - index
    columns:
      - name: actor_id
        description: "Identifier of the message author (end-user, agent or system)."
        tests:
          - not_null
      - name: actor_type
        description: "Type of the actor that sent the message (e.g., end-user, agent, system)."
        tests:
          - not_null
          - accepted_values:
             values: ['end-user','agent','system']
      - name: audit_id
        description: "Identifier of the audit entry where the message was recorded."
        tests:
          - not_null
      - name: chat_index
        description: "Zero-based sequential ordering of messages per ticket (artificial index)."
        tests:
          - not_null
      - name: chat_timestamp
        description: "UTC timestamp of the message, normalized from the message payload."
        tests:
          - not_null
      - name: ticket_id
        description: "Unique identifier of the ticket in Zendesk."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the row."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."
        tests:
          - not_null

  - name: s__general__zendesk_tickets_status__scd
    description: >
      Slowly-changing dimension (type 2–like) that tracks the lifecycle of Zendesk ticket statuses.
      Each row represents a status version for a ticket with its valid time range.
    meta:
      domain: "cx"
      owner: "valeria.nascimento@nuvemshop.com.br"
      business_owner: "Operations"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticket_id
            - version
    columns:
      - name: ticket_id
        description: "Unique identifier of the ticket in Zendesk."
        tests:
          - not_null
      - name: event_id
        description: "Monotonic event identifier from Zendesk used to guarantee deterministic ordering within each ticket."
        tests:
          - not_null
      - name: assignee_id
        description: "Latest known assignee responsible for the ticket at the moment of this satisfaction event. Forward-filled from previous assignee changes; uses -1 when no assignee existed at that point."
        tests:
          - not_null
      - name: group_id
        description: "Latest known Zendesk group associated with the ticket at the moment of this satisfaction event. Forward-filled from previous group changes; uses -1 when no group existed at that point."
        tests:
          - not_null
      - name: status
        description: "Normalized (lowercased) status value captured from ticket events."
        tests:
          - not_null
          - accepted_values:
             values: ['new','open','pending','hold','solved','closed','deleted']
      - name: valid_from
        description: "Start timestamp (UTC) when this status version became active."
        tests:
          - not_null
      - name: valid_to
        description: "End timestamp (UTC) when this status version stopped being active (2100-12-31 for current version)."
        tests:
          - not_null
      - name: version
        description: "Monotonic version number per ticket (1, 2, 3, …) computed by event order."
        tests:
          - not_null
      - name: is_current
        description: "Flag indicating the current active status version for the ticket (1=current, 0=historical)."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the row."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."
        tests:
          - not_null

  - name: s__general__zendesk_satisfaction_score__event
    description: >
      Event-level table that tracks Zendesk ticket satisfaction score changes,
      along with the latest known assignee_id and group_id at the moment of each
      satisfaction event. Each row represents a point in time when a
      satisfaction-related event occurred, after applying a forward-fill logic
      for assignee and group attributes.
    meta:
      domain: "cx"
      owner: "valeria.nascimento@nuvemshop.com.br"
      business_owner: "Operations"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticket_id
            - event_id
    columns:
      - name: ticket_id
        description: "Unique identifier of the ticket in Zendesk."
        tests:
          - not_null
      - name: event_timestamp
        description: "UTC timestamp when the satisfaction or related event occurred in Zendesk."
        tests:
          - not_null
      - name: event_id
        description: "Monotonic event identifier from Zendesk used to guarantee deterministic ordering within each ticket."
        tests:
          - not_null
      - name: satisfaction_score
        description: "Satisfaction score value captured at this event. Represents the most recent non-null score up to this point in time (e.g., offered, good, bad)."
        tests:
          - not_null
          - accepted_values:
              values: ['offered', 'good', 'bad']
      - name: assignee_id
        description: "Latest known assignee responsible for the ticket at the moment of this satisfaction event. Forward-filled from previous assignee changes; uses -1 when no assignee existed at that point."
        tests:
          - not_null
      - name: group_id
        description: "Latest known Zendesk group associated with the ticket at the moment of this satisfaction event. Forward-filled from previous group changes; uses -1 when no group existed at that point."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created by the dbt process."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row (usually the dbt job user)."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the row by the dbt process."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row (usually the dbt job user)."
        tests:
          - not_null

  - name: s__general__zendesk_interactions__event
    description: >
      Event-level table that consolidates public Zendesk ticket interactions (comments/messages) with
      enriched context: actor role, direction (in/out), conversational grouping, lag-based references
      to previous interactions, time deltas, and the latest known assignee_id and group_id at the
      moment of each interaction. Built from ticket comments (including legacy snapshot) joined with
      ticket events timelines for assignee/group.
    meta:
      domain: "cx"
      owner: "valeria.nascimento@nuvemshop.com.br"
      business_owner: "Operations"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticket_id
            - interaction_id
    columns:
      - name: ticket_id
        description: "Unique identifier of the ticket in Zendesk."
        tests:
          - not_null
      - name: interaction_id
        description: "Unique identifier of the interaction (comment/message) within the ticket timeline."
        tests:
          - not_null
      - name: interaction_timestamp
        description: "UTC timestamp when the interaction occurred."
        tests:
          - not_null
      - name: author_id
        description: "Zendesk user id that authored the interaction."
        tests:
          - not_null
      - name: author_type
        description: "Normalized author role derived from user profile (e.g., agent, end-user)."
        tests:
          - not_null
          - accepted_values:
              values: ['admin','agent','end-user']
      - name: interaction_type
        description: "Direction of the interaction: 'in' (customer/end-user) or 'out' (agent)."
        tests:
          - not_null
          - accepted_values:
              values: ['in','out']
      - name: source
        description: "Raw source/type from comments (e.g., 'Comment', 'VoiceComment')."
      - name: is_bot_interaction
        description: "Flag indicating if the interaction was produced by a bot account."
        tests:
          - not_null
      - name: ticket_interaction_rank
        description: "Sequential index per ticket (chronological ordering of interactions starting at 1)."
        tests:
          - not_null
      - name: interaction_group_id
        description: "Conversational group id (gaps-and-islands) for consecutive interactions by the same author type."
        tests:
          - not_null
      - name: is_start_interaction_group
        description: "Flag indicating the first row of a consecutive interaction group."
        tests:
          - not_null
      - name: is_end_interaction_group
        description: "Flag indicating the last row of a consecutive interaction group."
        tests:
          - not_null
      - name: is_start_in_interaction
        description: "Flag indicating the first 'in' interaction after an 'out' (or at the beginning of the ticket)."
        tests:
          - not_null
      - name: previous_in_interaction_id
        description: "Interaction id of the latest prior 'in' interaction for this ticket; -1 when none exists."
        tests:
          - not_null
      - name: previous_out_interaction_id
        description: "Interaction id of the latest prior 'out' interaction for this ticket; -1 when none exists."
        tests:
          - not_null
      - name: previous_in_interaction_time
        description: "Elapsed time in seconds since the previous 'in' interaction; 0 when none exists."
        tests:
          - not_null
      - name: previous_out_interaction_time
        description: "Elapsed time in seconds since the previous 'out' interaction; 0 when none exists."
        tests:
          - not_null
      - name: assignee_id
        description: "Latest known assignee responsible for the ticket at the interaction timestamp (forward-filled); -1 when unknown."
        tests:
          - not_null
      - name: group_id
        description: "Latest known Zendesk group associated with the ticket at the interaction timestamp (forward-filled); -1 when unknown."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created by the dbt process."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row (usually the dbt job user)."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the row by the dbt process."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row (usually the dbt job user)."
        tests:
          - not_null

  - name: s__general__zendesk_tickets_label__ref
    description: >
      Reference table containing comprehensive Zendesk ticket information with enriched labels and attributes.
      Includes ticket metadata, custom fields extracted from Zendesk (store attributes, topics, SLA, satisfaction),
      and flags derived from tags and external IDs. Materialized incrementally using merge strategy with ticket_id as unique key.
    meta:
      domain: "cx"
      owner: "felipe.lorenzo@tiendanube.com"
      business_owner: "Carolina Leon"
    columns:
      - name: ticket_id
        description: "Unique identifier of the ticket in Zendesk. Primary key."
        tests:
          - not_null
          - unique
      - name: external_id
        description: "External identifier of the ticket in Zendesk. May contain parent ticket reference for side conversations."
      - name: url
        description: "URL of the ticket in Zendesk."
      - name: created_at
        description: "Timestamp when the ticket was created in Zendesk (UTC)."
      - name: updated_at
        description: "Timestamp when the ticket was last updated in Zendesk (UTC). Used for incremental processing."
      - name: due_at
        description: "Timestamp when the ticket is due in Zendesk (UTC). Null if no due date set."
      - name: status
        description: "Current status of the ticket in Zendesk"
      - name: type
        description: "Type of the ticket in Zendesk"
      - name: priority
        description: "Priority level of the ticket in Zendesk"
      - name: ticket_form_id
        description: "Identifier of the ticket form used to create the ticket."
      - name: has_incidents
        description: "Flag indicating if the ticket has associated incidents."
      - name: is_public
        description: "Flag indicating if the ticket is public."
      - name: subject
        description: "Subject line of the ticket."
      - name: raw_subject
        description: "Original subject line of the ticket before any processing."
      - name: description
        description: "Description or body content of the ticket."
      - name: tags
        description: "JSON array of tags associated with the ticket. Used to derive flags like is_bot, is_automation, is_spam."
      - name: custom_fields
        description: "JSON array containing custom field values from Zendesk. Source for extracted fields like store attributes, topics, SLA."
      - name: requester_id
        description: "Zendesk user ID of the person who requested the ticket."
      - name: recipient
        description: "Email address of the ticket recipient."
      - name: organization_id
        description: "Zendesk organization ID associated with the ticket."
      - name: assignee_id
        description: "Zendesk user ID of the agent assigned to the ticket. Null if unassigned."
      - name: group_id
        description: "Zendesk group ID responsible for the ticket. Null if no group assigned."
      - name: brand_id
        description: "Zendesk brand ID associated with the ticket."
      - name: submitter_id
        description: "Zendesk user ID of the person who submitted the ticket."
      - name: parent_ticket_id
        description: "Ticket ID of the parent ticket (extracted from external_id for side conversations). Null if not a side conversation."
      - name: problem_id
        description: "Problem ticket ID if this ticket is linked to a problem. Null otherwise."
      - name: followup_ids
        description: "Array of ticket IDs that are follow-ups to this ticket."
      - name: collaborator_ids
        description: "Array of Zendesk user IDs who are collaborators on the ticket."
      - name: follower_ids
        description: "Array of Zendesk user IDs who are following the ticket."
      - name: email_cc_ids
        description: "Array of email addresses or user IDs CC'd on the ticket."
      - name: forum_topic_id
        description: "Forum topic ID if the ticket originated from a forum topic. Null otherwise."
      - name: sharing_agreement_ids
        description: "Array of sharing agreement IDs associated with the ticket."
      - name: via_channel
        description: "Channel through which the ticket was created (extracted from via field)"
      - name: allow_channelback
        description: "Flag indicating if channelback is allowed for this ticket."
      - name: allow_attachments
        description: "Flag indicating if attachments are allowed for this ticket."
      - name: satisfaction_score
        description: "Satisfaction score from the rating (extracted from satisfaction_rating JSON). Null if not rated."
      - name: satisfaction_reason
        description: "Reason provided for the satisfaction rating (extracted from satisfaction_rating JSON)."
      - name: satisfaction_comment
        description: "Comment provided with the satisfaction rating (extracted from satisfaction_rating JSON)."
      - name: sla
        description: "SLA value as stored in custom fields (e.g., '2h', '30m', 'x')."
      - name: sla_min
        description: "SLA value converted to minutes. Extracted from sla field: hours multiplied by 60, minutes as-is. Null if sla is null or 'x'."
      - name: main_topic
        description: "Main topic classification extracted from custom fields. Used for ticket categorization."
      - name: secondary_topic
        description: "Secondary topic classification extracted from custom fields. Provides additional categorization detail."
      - name: subtopic
        description: "Subtopic classification extracted from custom fields. Most granular level of topic categorization."
      - name: is_partner
        description: "Flag indicating if the ticket is associated with a partner (extracted from custom fields)."
      - name: store_status
        description: "Status of the store associated with the ticket (extracted from custom fields)."
      - name: store_status_by_order
        description: "Store status classification by order type (extracted from custom fields)."
      - name: store_tier_np_pn
        description: "Store tier classification (NP/PN) extracted from custom fields."
      - name: store_plan
        description: "Store plan type extracted from custom fields"
      - name: client_segment
        description: "Client segment classification extracted from custom fields."
      - name: client_profile
        description: "Client profile classification extracted from custom fields."
      - name: team_guru
        description: "Team guru assignment extracted from custom fields."
      - name: squad_guru
        description: "Squad guru assignment extracted from custom fields."
      - name: bu_guru
        description: "Business unit guru assignment extracted from custom fields."
      - name: is_bot
        description: "Flag indicating if the ticket was created or handled by a bot. Derived from tags containing 'cloud-humans-csat'."
      - name: is_automation
        description: "Flag indicating if the ticket is related to automation. Derived from tags containing 'monitorear_consumers' or 'monitorar_consumers'."
      - name: is_merged
        description: "Flag indicating if the ticket was closed by merge. Derived from tags containing 'closed_by_merge'."
      - name: is_spam
        description: "Flag indicating if the ticket is marked as spam. Derived from tags containing 'spam'."
