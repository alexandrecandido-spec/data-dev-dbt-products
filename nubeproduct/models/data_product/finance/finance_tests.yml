version: 2
models:
  - name: finance_paid_orders_summary
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
            - store_id
            - storefront
            - completed_at
    columns:
      - name: store_id
        tests:
          - not_null
      - name: storefront
        tests:
          - not_null
      - name: completed_at
        tests:
          - not_null
      - name: gmv_usd
        tests:
          - not_null
      - name: orders
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "orders IS NOT NULL"
  - name: finance_store_segments
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
            - datemonth
            - store_id
    columns:
      - name: store_id
        tests:
          - not_null
      - name: datemonth
        tests:
          - not_null
      - name: segment
        tests:
          - not_null
      - name: segment
        tests:
          - accepted_values:
              values: ["top-seller", "large-seller", "medium-seller", "small-seller", "tiny-seller", "struggling-seller", "no-seller"]
      - name: segment_on_platform
        tests:
          - accepted_values:
              values: ["top-seller", "large-seller", "medium-seller", "small-seller", "tiny-seller", "struggling-seller", "no-seller"]
      - name: segment_off_platform
        tests:
          - accepted_values:
              values: ["top-seller", "large-seller", "medium-seller", "small-seller", "tiny-seller", "struggling-seller", "no-seller"]
      - name: orders_last_month_closed
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "orders_last_month_closed IS NOT NULL"
