  - name: g__acquisition__ga4_sessions_attribution__agg_daily
    description: Extends the aggregated GA4 sessions table with marketing classification (mkt_source, mkt_subteam), URL ownership, partner_code and incremental logic.
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
