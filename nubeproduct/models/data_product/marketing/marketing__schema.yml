        tests: [not_null]
      - name: source_ga4_classification
        description: GA4 source label at session level.
      - name: original_user_country
        description: Country reported by GA4.
      - name: classified_country
        description: Country after business re-classification.
      - name: env
        description: Page-group / environment bucket.
      - name: landing_page
        description: First page-view URL of the session.
      - name: landing_page_domain
        description: Domain part extracted from landing_page.
      - name: landing_page_path
        description: Path part extracted from landing_page.
      - name: last_source
        description: Final traffic source of the session.
      - name: last_medium
        description: Final traffic medium.
      - name: last_campaign
        description: Final campaign name.
      - name: first_event_device
        description: Device category of the first event.
      - name: last_event_device
        description: Device category of the last event.
      - name: only_login_session
        description: Flag indicating “only login” sessions.
      - name: login_in_session
        description: Flag indicating at least one login event.
      - name: landing_page_type
        description: login | other for first page.
      - name: user_type
        description: New or Returning.
      - name: session_status
        description: Engaged or Bounced.
      - name: utm_ad_id
        description: utm_id of the landing_page (nullable).
      - name: utm_content
        description: utm_content of the landing_page (nullable).
      - name: utm_term
        description: utm_term of the landing_page (nullable).
      - name: partner_code
        description: Extracted partner_code from landing_page_path (/partners/<code>).
      - name: url_owner
        description: Team that owns the landing URL (lookup table).
      - name: url_content_type
        description: Content-type/subteam derived from the URL.
      - name: insti_pages
        description: Flag identifying whether the session belongs to the institutional environment (Insti/Next/Partners).
      - name: insti_page_groups
        description: Thematic grouping of institutional landing pages for content analysis.
      - name: type_of_page
        description: Content type classification of the landing page "Content Pages" (Blog, Downloadables, Tools, Trilhas) or "Other Pages".
      - name: organic_results
        description: Organic if last medium equals "organic", otherwise "Other".
      - name: mkt_source
        description: High-level marketing source bucket after rule-set.
      - name: mkt_subteam
        description: Finer marketing sub-team (fallback to mkt_source if null).
      - name: distinct_user_count
        description: Distinct users (user_pseudo_id) aggregated.
      - name: distinct_session_count
        description: Distinct GA4 sessions aggregated.
      - name: total_trials
        description: Sum of trial events.
      - name: total_payments
        description: Sum of payment events.
      - name: total_engagements
        description: Number of engaged sessions.
      - name: avg_session_duration
        description: Average session duration (minutes).
      - name: median_session_duration
        description: Median session duration (approximate).
      - name: avg_pageviews_per_session
        description: Average page-views per session.
      - name: median_pageviews_per_session
        description: Median page-views per session (approximate).
      - name: dp_input_sources
        description: Comma-separated STRING of input tags that influenced the row (utm, subteam, referrer, url, insti, partner_exception, affiliate_classification, partner_code).
      - name: dp_change_timestamp_incremental
        description: Max sys_audit_updated_on across relevant inputs; used to trigger selective incremental recalculation.
      - name: row_hash
        description: MD5 merge key for the DP (dp_row_hash exposed as row_hash).
        tests:
          - not_null
          - unique
      - name: sys_audit_created_on
        description: Timestamp when the row was created by dbt.
