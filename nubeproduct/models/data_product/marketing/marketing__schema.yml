version: 2

models:
  - name: s__brand_and_comms__goals_targets_kwp_sc__ref
    description: "Silver layer model for daily marketing goals and targets for Search Console and KWP. Contains expected performance metrics for branded/non-branded searches across channels. Used as targets for performance comparison in Gold models."
    config:
      materialized: table
      meta:
        owner: "beto.martinez@tiendanube.com"
        business_owner: "Giselle Galli"
        domain: "marketing"
    columns:
      - name: date
        description: "Date of the goal (daily goals)"
        tests:
          - not_null
      - name: date_month
        description: "Date formatted as YYYY-MM for month-level analysis"
      - name: date_quarter
        description: "Date formatted as YYYY-QN for quarter-level analysis"
      - name: date_year
        description: "Year formatted as YYYY for year-level analysis"
      - name: country
        description: "Country code (AR, BR, MX, CO, CL)"
        tests:
          - not_null
          - accepted_values:
              values: ['AR', 'BR', 'MX', 'CO', 'CL']
      - name: expected_branded_sc
        description: "Expected daily branded impressions for Search Console"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                where: "expected_branded_sc IS NOT NULL"
      - name: expected_branded_share_kwp
        description: "Expected daily branded market share for KWP (as decimal, e.g. 0.49)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              config:
                where: "expected_branded_share_kwp IS NOT NULL"
      - name: expected_nonbranded_kwp
        description: "Expected daily non-branded searches for KWP"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                where: "expected_nonbranded_kwp IS NOT NULL"
      - name: goal_source
        description: "Source of the goal data for tracking purposes"
      - name: sys_audit_created_on
        description: "Timestamp when record was created in data warehouse"
      - name: sys_audit_updated_on
        description: "Timestamp when record was last updated in data warehouse"


