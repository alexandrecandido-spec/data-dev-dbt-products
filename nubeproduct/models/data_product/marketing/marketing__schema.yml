      domain: "operations"
      business_owner: "Ane Paschoalino"
    description: >
      Contains simplified store attributes for HubSpot integration, including only
      vertical classification and current segment status. Returns empty strings
      instead of null values to ensure the values are set in Hubspot as empty.
    columns:
      - name: store_id
        description: "Unique identifier of the store. External key."
        tests:
          - not_null
          - unique
      - name: status_by_order_str
        description: "Descriptive name of the current segment (e.g., no-seller, struggling-seller) associated with this store. Returns empty string if null."
        tests:
          - not_null
      - name: vertical_str
        description: "Descriptive label of the vertical (e.g., small-business, medium-business, etc) associated with this store. Returns empty string if null."
        tests:
          - not_null
      - name: stats_url
        description: "URL to the stats profile page for the store in the format 'https://stats.tiendanube.com/store/profile?store_id={store_id}'."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_like_pattern:
              like_pattern: "https://stats.tiendanube.com/store/profile?store_id=%"
      - name: associated_partner_id
        description: "Partner ID associated with the store, retrieved from moltres__mwp_store_info. Returns empty string if null."
        tests:
          - not_null
      - name: website
        description: "The store's public URL, constructed from the merchant's domain with the appropriate platform suffix: '.lojavirtualnuvem.com.br' for Brazilian stores (when country_code = 'BR') or '.mitiendanube.com' for all other countries. This represents the store's customer-facing website."
        tests:
          - not_null
      - name: np_lending_available_credit
        description: "The store's credit available limit registered in admin."
        tests:
          - not_null
      - name: gmv_local_currency_on_platform_monthly
        description: "GMV in local currency over the last closed month."
      - name: gmv_local_currency_on_platform_90d
        description: "GMV in local currency over the last 90 days."
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
      - name: sys_audit_created_by
        description: "System or user that created the row."
      - name: sys_audit_updated_on
        description: "Maximum timestamp from all dependency tables (dim_merchant_info and related dimension tables)."
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."


