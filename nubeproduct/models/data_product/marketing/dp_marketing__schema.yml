      - name: base_country_code
        description: "Base country code from Operations."
      - name: base_country_name
        description: "Base country name from Operations."
      - name: base_region_name
        description: "Region (Operations)."
      - name: base_state_name
        description: "State/Province (Operations)."
      - name: base_city_name
        description: "City (Operations)."
      - name: current_segment_name
