  - name: marketing_ga4_sessions_classified
    description: Session level view enriched with device information, GA4 source
      labels and a “classified_country” logic that maps each session
      to BR / AR / MX / CL / CO / Other.  
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli" 
    columns:
      - name: year_month_day_code
        description: Date in YYYYMMDD integer format used for partitioning.
        tests:
          - not_null
      - name: unique_session
        description: Unique GA4 session identifier.
        tests:
          - not_null
          - unique
      - name: date
        description: Session start date (UTC, DATE type).
      - name: source_ga4_classification
        description: GA4 built-in traffic source label (e.g. *inst-br*).
      - name: original_user_country
        description: Country reported by GA4 for the user's first event of the session.
      - name: classified_country
        description: Country re-classified by business rules (see model SQL).
      - name: env
        description: Product environment/page group (e.g. *Insti*).
      - name: landing_page
        description: Full URL of the first page-view in the session.
      - name: landing_page_domain
        description: Extracted domain from *landing_page*.
      - name: landing_page_path
        description: URL path (starts with “/”) from *landing_page*.
      - name: landing_page_type
        description: Heuristic label (*login* | *other*) for the first page.
      - name: last_source
        description: Traffic source of the last event in the session.
      - name: last_medium
        description: Traffic medium of the last event in the session.
      - name: last_campaign
        description: Campaign name of the last event in the session.
      - name: utm_ad_id
        description: utm_id captured on the landing_page.
      - name: utm_content
        description: utm_content captured on the landing_page.
      - name: utm_term
        description: utm_term captured on the landing_page.
      - name: first_event_device
        description: Device category of the sessions first event.
      - name: last_event_device
        description: Device category of the sessions last event.
      - name: only_login_session
        description: 1 if the session contains only login-related behavior; 0 otherwise.
      - name: login_in_session
        description: 1 if a login event occurred in the session; 0 otherwise.
      - name: user_type
        description: New or Returning based on first visit table.
      - name: engage
        description: GA4 engagement flag (1 = engaged, 0 = bounced).
      - name: trial
        description: 1 if a trial event occurred in the session; 0 otherwise.
      - name: payment
        description: 1 if a payment event occurred in the session; 0 otherwise.
      - name: session_duration_minutes
        description: Total session duration in minutes.
      - name: pageviews_per_session
        description: Number of pageviews during the session.
      - name: sys_audit_created_on
        description: Timestamp when the row was first created by dbt.
      - name: sys_audit_created_by
        description: dbt job or service account that created the row.
      - name: sys_audit_updated_on
        description: Timestamp when the row was last updated by dbt.
      - name: sys_audit_updated_by
        description: dbt job or service account that last updated the row.


