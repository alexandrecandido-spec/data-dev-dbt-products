version: 2

models:
  - name: marketing_ga4_sessions_daily_attribution
    description: "Data product: daily attribution of GA4 sessions, including UTM parameters and original landing page dimensions."
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        domain: "marketing"
    columns:
      - name: year_month_day_code
        description: "Daily partition code (YYYYMMDD)."
        tests:
          - not_null
      - name: date
        description: "Session date."
        tests:
          - not_null
      - name: source_ga4_classification
        description: "Original GA4 source label."
      - name: original_user_country
        description: "Country from the user's GA4 record."
      - name: classified_country
        description: "Business‐classified country bucket."
      - name: env
        description: "Navigation environment (web, admin, etc.)."
      - name: landing_page
        description: "Full landing page URL."
      - name: landing_page_domain
        description: "Domain portion of the landing page URL (e.g. 'www.nuvemshop.com.br')."
      - name: landing_page_path
        description: "Path portion of the landing page URL (e.g. '/loja-virtual')."
      - name: last_source
        description: "Last known traffic source."
      - name: last_medium
        description: "Last known traffic medium."
      - name: last_campaign
        description: "Last recorded campaign."
      - name: utm_ad_id
        description: "Ad ID extracted from landing page URL between 'id_' and '&'."
      - name: utm_content
        description: "UTM content parameter extracted from the landing page URL."
      - name: utm_term
        description: "UTM term parameter extracted from the landing page URL."
      - name: first_event_device
        description: "Device category of the first event in the session."
      - name: last_event_device
        description: "Device category of the last event in the session."
      - name: only_login_session
        description: "Flag = 1 if session contains only login events with no trial/payment."
      - name: login_in_session
        description: "Flag = 1 if any login event occurred in the session."
      - name: trial
        description: "Flag = 1 if a trial started during the session."
      - name: payment
        description: "Flag = 1 if a payment occurred during the session."
      - name: engage
        description: "GA4 engagement flag (0/1)."
      - name: session_duration_minutes
        description: "Session duration in minutes."
      - name: pageviews_per_session
        description: "Number of pageviews in the session."
      - name: user_type
        description: "‘New’ or ‘Returning’ user, based on first visit date."
      - name: session_status
        description: "'Engaged' or 'Bounced' based on engagement flag."
      - name: distinct_user_count
        description: "Distinct users per grouping."
      - name: distinct_session_count
        description: "Distinct sessions per grouping."
      - name: total_trials
        description: "Total trial events per grouping."
      - name: total_payments
        description: "Total payment events per grouping."
      - name: total_engagements
        description: "Count of engaged sessions."
      - name: avg_session_duration
        description: "Average session duration for engaged sessions (minutes)."
      - name: median_session_duration
        description: "Median session duration for engaged sessions (minutes)."
      - name: avg_pageviews_per_session
        description: "Average pageviews per session."
      - name: median_pageviews_per_session
        description: "Median pageviews per session."
      - name: mkt_source
        description: "Marketing source assigned by attribution logic."
      - name: mkt_subteam
        description: "Marketing sub‐team assigned by attribution logic."
      - name: row_hash
        description: "MD5 hash of concatenated key fields to detect changes."
      - name: sys_audit_created_on
        description: "Record creation timestamp."
      - name: sys_audit_created_by
        description: "System user who created the record."
      - name: sys_audit_updated_on
        description: "Record last update timestamp."
      - name: sys_audit_updated_by
        description: "System user who last updated the record."
