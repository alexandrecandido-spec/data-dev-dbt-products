              quote: false
              config: { severity: warn }
      - name: first_seller_at
        description: "First time the merchant sold (any event)."
      - name: churned_at
        description: "Churn timestamp from last-click attribution (if flagged)."
      - name: mkt_source_first_click
        description: "Marketing source (team) at trials_first_click=1."
      - name: mkt_subteam_first_click
        description: "Marketing source (subteam) at trials_first_click=1."
      - name: mkt_source_last_click
        description: "Marketing source (team) at trials_last_click=1."
      - name: mkt_subteam_last_click
        description: "Marketing source (subteam) at trials_last_click=1."
      - name: mkt_campaign_first_click
        description: "Campaign at trials_first_click=1."
      - name: mkt_campaign_last_click
        description: "Campaign at trials_last_click=1."
      - name: mkt_landing_page_domain_first_click
        description: "Landing page domain at trials_first_click=1."
      - name: mkt_landing_page_domain_last_click
        description: "Landing page domain at trials_last_click=1."
      - name: mkt_landing_page_path_first_click
        description: "Landing page path at trials_first_click=1."
      - name: mkt_landing_page_path_last_click
        description: "Landing page path at trials_last_click=1."
      - name: mkt_register_url
        description: "Register URL captured for the attributed journey (if available)."
      - name: blocked_fraud_tag
        description: "Fraud aggregated at store level (1 if any click had fraud)."
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
              config: { severity: warn }
      - name: mkt_source_partner_click
        description: "Team inferred from partners/agencies/affiliates: Partners / Affiliates / Otros Teams."
        tests:
          - accepted_values:
              values: ['Partners','Affiliates','Otros Teams']
              quote: true
              config: { severity: warn }
      - name: mkt_subteam_partner_click
        description: "Subteam from partners: 'Partners', affiliate classification (local) or 'Long Tail' / 'Otros Teams'."
      - name: ql_profile
        description: "Predictive profile from marketing_new_payment_predictor_profiles."
      - name: partner_code
        description: "Unique code assigned to the partner within Tiendanube's ecosystem. Used to identify and track specific referrals or integrations."
      - name: partner_id
        description: "Internal identifier of the partner from the source systems. Enables joins with other partnership tables and ensures uniqueness."
      - name: partnership_type
        description: "Type of commercial relationship with the partner (e.g., agency, platform, technology integration). Helps segment and analyze performance by partnership category."
      - name: main_user_id
        description: "Main user id (WP)."
      - name: email
        description: "Main email (WP)."
      - name: phone
        description: "Phone number (store settings)."
      - name: whatsapp
        description: "WhatsApp number (store settings)."
      - name: owner_phone
        description: "Owner phone, normalized with country/area when available."
      - name: store_name
        description: "Store display name."
      - name: doc_type
        description: "Legal document type."
        tests:
          - accepted_values:
              values: ['CNPJ','CPF','CUIT','RUT','RFC','DNI','UNKNOWN']
              quote: true
              config: { severity: warn }
      - name: doc_number
        description: "Legal document number."
      - name: instagram
        description: "Instagram handle / URL (raw)."
      - name: instagram_followers
        description: "Instagram followers (latest snapshot)."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: false
              row_condition: "instagram_followers IS NOT NULL"
              config: { severity: warn }
      - name: following
        description: "Instagram following (latest snapshot)."
      - name: posts
        description: "Instagram posts (latest snapshot)."
      - name: posts_likes
        description: "Instagram likes on posts (latest snapshot)."
      - name: facebook
        description: "Facebook URL/handle."
      - name: twitter
        description: "Twitter/X URL/handle."
      - name: tiktok
        description: "TikTok URL/handle."
      - name: pinterest
        description: "Pinterest URL/handle."
      - name: sys_audit_created_on
        description: "First time this store_id was written to the refined table."
        tests: [not_null]
      - name: sys_audit_created_by
        description: "Process/user that wrote this store_id for the first time."
      - name: sys_audit_updated_on
        description: "Last time this row was updated by the pipeline."
        tests: [not_null]
      - name: sys_audit_updated_by
        description: "Process/user that last updated the row."
    tests:
    - dbt_utils.equality:
        compare_model: ref('company_metrics_merchant_info')
        compare_columns: ['store_id']


  - name: marketing_event_info
    description: "Incremental dataset with marketing events (clicks and scroll) enriched from GA/analytics. Deduplicated by user-session-timestamp-event, exposes page, action, and device metadata, and includes audit traces."
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['user_pseudo_id','unique_session','event_timestamp','event_name']
    columns:
      - name: user_pseudo_id
        description: "Anonymous identifier of the user."
      - name: unique_session
        description: "Unique identifier of the user session."
      - name: source
        description: "Source of the event (e.g., ga4, webapp)."
      - name: event_timestamp
        description: "Event timestamp in microseconds since epoch."
        tests: [not_null]
      - name: event_date
        description: "Date derived from event_timestamp."
      - name: event_name
        description: "Event name; only values containing 'clicked' or 'scroll'."
      - name: event_page
        description: "Full URL of the page (page_location) where the event occurred."
        tests: [not_null]
      - name: event_action
        description: "Event action (eventAction) for click events."
      - name: event_device
        description: "Reported device category (device_category)."
      - name: year_month_code
        description: "Period code in YYYYMM format derived from event_date."
      - name: sys_audit_created_on
        description: "Timestamp when the record was created in the DWH."
      - name: sys_audit_created_by
        description: "Process/system that created the record."
      - name: sys_audit_updated_on
        description: "Timestamp when the record was last updated in the DWH."
      - name: sys_audit_updated_by
        description: "Process/system that last updated the record."


