      - name: sys_audit_updated_on
        description: "Timestamp when the record was last updated in the DWH."
      - name: sys_audit_updated_by
        description: "Process/system that last updated the record."


  - name: marketing_tp_info
    description: "Incremental dataset of trial and payment touchpoints from GA, keeping one record per (unique_session, user_pseudo_id, event_timestamp). Emits conditional fields for trial (Store created) and payment (New payment) with device info and audit fields."
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        business_owner: "Giselle Galli"
        domain: "marketing"
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: ['unique_session','user_pseudo_id','event_timestamp']}
    columns:
      - name: user_pseudo_id
        description: "Composite user identifier formatted as '<source>-<ga_user_pseudo_id>' from analytics events."
      - name: unique_session
        description: "Composite session identifier formatted as '<source>-<ga_user_pseudo_id>-<ga_session_id>' used as the session grain."
      - name: event_timestamp
        description: "Timestamp of the touchpoint in microseconds since epoch."
        tests: [not_null]
      - name: source
        description: "Event source system (e.g., ga4, webapp)."
      - name: event_name
        description: "Touchpoint type; only 'Store created' (trial) or 'New payment' (payment)."
      - name: trial_timestamp
        description: "Timestamp of the trial creation (only when event_name = 'Store created')."
      - name: trial_date
        description: "Date of the trial creation derived from trial_timestamp (only when event_name = 'Store created')."
      - name: trial_device
        description: "Device category at trial creation (only when event_name = 'Store created')."
      - name: payment_timestamp
        description: "Timestamp of the new payment (only when event_name = 'New payment')."
      - name: payment_date
        description: "Date of the new payment derived from payment_timestamp (only when event_name = 'New payment')."
      - name: payment_device
        description: "Device category at payment time (only when event_name = 'New payment')."
      - name: sys_audit_created_on
        description: "Timestamp when the record was created in the DWH."
      - name: sys_audit_created_by
        description: "Process/system that created the record."
      - name: sys_audit_updated_on
        description: "Timestamp when the record was last updated in the DWH."
      - name: sys_audit_updated_by
        description: "Process/system that last updated the record."
