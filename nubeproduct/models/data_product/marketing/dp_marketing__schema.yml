version: 2

models:
  - name: ga4_user_events
    columns:
      - name: u_user_pseudo_id
        tests:
          - not_null
      - name: unique_session
        tests:
          - not_null
      - name: event_timestamp
        tests:
          - not_null

  - name: hubspot_active_stores
    columns:
      - name: store_id
        tests:
          - not_null
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 300000
          max_value: 1000000

  - name: inputs_marketing_attribution
    description: "A data product that lists all inputs from the GitHub mkt_attribution repository to help users:
     - Determine the impact of acquisition efforts and results in the attribution model.
     - Test and validate whether specific UTM inputs for the MKT Attribution Product are available for use.
     - Perform custom analytics and reporting."
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "marketing" 
    columns:
      - name: id
        description: "Unique identifier for the GitHub issue/input record"
        tests:
          - not_null
          - unique 
      - name: input_number
        description: "Sequential identifier assigned to the GitHub issue/input"
        tests:
          - not_null
      - name: input_title
        description: "Title of the GitHub issue/input, which may contain UTM parameters"
        tests:
          - not_null
      - name: input_type
        description: "Type of input, extracted from the issue title"
        tests:
          - not_null
          - accepted_values:
              values: ['UTM', 'SUBTEAM_MKT', 'URL', 'REFERRER', 'PARTNER_CODE', 'PARTNER_FRAUD', 'AFFILIATE_LIST', 'INSTI']
      - name: utm_source
        description: "Marketing traffic source identifier (extracted from issue title/body)"
      - name: utm_medium
        description: "Marketing channel or medium identifier (extracted from issue title/body)"
      - name: utm_campaign
        description: "Marketing campaign identifier (extracted from issue title/body)"
      - name: utm_content
        description: "Specific content identifier within the campaign (extracted from issue title/body)"
      - name: url
        description: "Complete URL associated with the record, typically pointing to a landing page"
      - name: landing_page_domain
        description: "Domain name of the landing page associated with the record"
      - name: landing_page_path
        description: "URL path of the landing page associated with the record"
      - name: referrer
        description: "URL or domain that referred the user to the site or page (Referrer), extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('REFERRER')"
      - name: partner_code
        description: "Partner code extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('PARTNER_CODE', 'PARTNER_FRAUD')"
      - name: partner_id
        description: "Partner ID extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('PARTNER_FRAUD')"
      - name: fraude
        description: "Fraud flag extracted from the issue title/body"
      - name: affiliate_code
        description: "Affiliate code extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('AFFILIATE_LIST')"
      - name: affiliate_classification
        description: "Affiliate classification asigned by business, extracted from the issue title/body"
      - name: affiliate_country
        description: "Country of the affiliate, extracted from the issue title/body"
      - name: affiliate_tier
        description: "Tier asigned by business, extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['T1','T2','T3','T4','T5', null]
              row_condition: "input_type = 'AFFILIATE_LIST' AND affiliate_tier IS NOT NULL"
      - name: affiliate_fit
        description: "Fit asigned by business, extracted from the issue title/body"
      - name: affiliate_main_platform
        description: "Main platform asigned by business, extracted from the issue title/body"
      - name: team
        description: "Team responsible for the acquisition efforts and results attribution"
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Others','Mid-market','Product Marketing','Enp','Organic','Affiliates','Growth','Partners','Store Referral','Performance Brand','Performance No Brand','Communications','Mandae','Performance','Eea']
              row_condition: "input_type in ('UTM', 'SUBTEAM_MKT', 'URL', 'INSTI', 'REFERRER', 'PARTNER_CODE') AND state = 'open'"
      - name: subteam
        description: "Subteam responsible for the acquisition efforts and results attribution"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('SUBTEAM_MKT')"
      - name: user_create
        description: "GitHub username of the issue/input creator"
      - name: state
        description: "Current status of the GitHub issue/input (open or closed)"
        tests:
          - accepted_values:
              values: ['open', 'closed']
      - name: assignee
        description: "GitHub username of the assigned issue/input handler"
      - name: comments
        description: "Total number of comments on the GitHub issue/input"
      - name: created_at
        description: "Timestamp of when the GitHub issue/input was created"
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp of the most recent update to the GitHub issue/input"
        tests:
          - not_null
      - name: closed_at
        description: "Timestamp of when the GitHub issue/input was closed (if applicable)"
      - name: sys_audit_extracted_on
        description: "Timestamp of when the data was extracted from the GitHub API"
      - name: sys_audit_created_on
        description: "Timestamp of when this record was created in our data warehouse"
      - name: sys_audit_updated_on
        description: "Timestamp of when this record was last updated in our data warehouse"
      - name: sys_audit_created_by
        description: "System identifier of the process that created this record"
      - name: sys_audit_updated_by
        description: "System identifier of the process that last updated this record"

  
  - name: ga4_sessions_with_dimensions_metrics_attribution
    description: "Final data product for GA4 session analysis, enriched with traffic source, country, environment, login flags, engagement status, and user classification (new vs. returning). Includes both only-login and full sessions, grouped for comparison."
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        domain: "marketing"
    columns:
      - name: date
        description: "Date of the session, extracted from the event_date_parsed of the first pageview per session."
        tests:
          - not_null
      - name: source_ga4_classification
        description: "Traffic source classification, taken directly from source field in mod_pv_info."
      - name: original_user_country
        description: "User's original country, based on mpv_country field in mod_pv_info."
      - name: classified_country
        description: "Derived country code based on original_user_country and source classification logic."
      - name: env
        description: "Navigation environment, based on mpv_env field in mod_pv_info."
      - name: landing_page
        description: "Landing page of the session, extracted from mpv_landing_page field in mod_pv_info."
      - name: last_source
        description: "Last recorded source in the session, from mpv_last_source in mod_pv_info."
      - name: last_medium
        description: "Last recorded medium in the session, from mpv_last_medium in mod_pv_info."
      - name: last_campaign
        description: "Last campaign recorded for the session, derived from mod_pv_info."
      - name: utm_ad_id
        description: "id taken from the landing_page(UTM), derived from mod_pv_info."
      - name: first_event_device
        description: "First device type detected for the session, derived from event_info."
      - name: last_event_device
        description: "Last device type detected for the session, derived from event_info." 
      - name: only_login_session
        description: "Flag indicating whether the session only involved login actions (without trial or payment)."
        tests:
          - accepted_values:
              values: [0, 1]
      - name: user_type
        description: "User classification: 'New' if the session date matches their first_visit date; 'Returning' otherwise."
        tests:
          - accepted_values:
              values: ['New', 'Returning', 'Unknown']
      - name: engage
        description: "Engagement flag for the session, based on session_info (1 = engaged, 0 = not engaged)."
        tests:
          - accepted_values:
              values: [0, 1]
      - name: utm_team
        description: "team clasificaction based on the marketing attribution inputs when input type is 'UTM' or 'MKT_SUBTEAM'."
      - name: utm_subteam
        description: "subteam clasificaction based on the marketing attribution inputs when input type is 'UTM' or 'MKT_SUBTEAM'."
      - name: url_team
        description: "team clasificaction based on the marketing attribution inputs when input type is 'URL' or 'INSTI'."
      - name: url_subteam
        description: "subteam clasificaction based on the marketing attribution inputs when input type is 'URL' or 'INSTI'."
      - name: ref_team
        description: "team clasificaction based on the marketing attribution inputs when input type is 'REFERRER'."
      - name: ref_subteam
        description: "subteam clasificaction based on the marketing attribution inputs when input type is 'REFERRER'."
      - name: distinct_user_count
        description: "Count of distinct user_pseudo_id within the session and dimension combination."
      - name: distinct_session_count
        description: "Count of distinct unique_session_id within the session and dimension combination."
      - name: total_trials
        description: "Total number of sessions where a trial event was recorded (from tp_info)."
      - name: total_payments
        description: "Total number of sessions where a payment event was recorded (from tp_info)."
      - name: total_engagements
        description: "Sum of sessions marked as engaged, based on session_info."
      - name: avg_session_duration_engaged
        description: "Average session duration in minutes, considering only engaged sessions."
      - name: median_session_duration_engaged
        description: "Median session duration in minutes, calculated with APPROX_PERCENTILE over engaged sessions."
      - name: avg_pageviews_per_session_engaged
        description: "Average number of pageviews per engaged session."
      - name: median_pageviews_per_session_engaged
        description: "Median number of pageviews per engaged session, calculated with APPROX_PERCENTILE."
      - name: sys_audit_created_on
        description: "System timestamp when the record was created."
      - name: sys_audit_created_by
        description: "System identifier for the process that created the record."
      - name: sys_audit_updated_on
        description: "System timestamp when the record was last updated."
      - name: sys_audit_updated_by
        description: "System identifier for the process that last updated the record."