  - name: marketing_session_info
    description: "Incremental dataset with one row per unique session including engagement flag, start/end timestamps and dates, session source, period code, and audit fields."
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        business_owner: "Giselle Galli"
