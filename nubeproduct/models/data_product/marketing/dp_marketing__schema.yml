      - name: end_session_time
        description: "Session end timestamp in microseconds since epoch (maximum event_timestamp)."
      - name: start_session_date
        description: "Date derived from start_session_time."
      - name: end_session_date
        description: "Date derived from end_session_time."
      - name: year_month_code
