version: 2

models:
  - name: ga4_user_events
    columns:
      - name: u_user_pseudo_id
        tests:
          - not_null
      - name: unique_session
        tests:
          - not_null
      - name: event_timestamp
        tests:
          - not_null


  - name: hubspot_active_stores
    columns:
      - name: store_id
        tests:
          - not_null
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 300000
          max_value: 1000000


  - name: inputs_marketing_attribution
    description: "A data product that lists all inputs from the GitHub mkt_attribution repository to help users:
     - Determine the impact of acquisition efforts and results in the attribution model.
     - Test and validate whether specific UTM inputs for the MKT Attribution Product are available for use.
     - Perform custom analytics and reporting."
    config:
      meta:
        tech_steward: "ronald.corcho@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli" 
    columns:
      - name: id
        description: "Unique identifier for the GitHub issue/input record"
        tests:
          - not_null
          - unique 
      - name: input_number
        description: "Sequential identifier assigned to the GitHub issue/input"
        tests:
          - not_null
      - name: input_title
        description: "Title of the GitHub issue/input, which may contain UTM parameters"
        tests:
          - not_null
      - name: input_type
        description: "Type of input, extracted from the issue title"
        tests:
          - not_null
          - accepted_values:
              values: ['UTM', 'SUBTEAM_MKT', 'URL', 'REFERRER', 'PARTNER_CODE', 'PARTNER_FRAUD', 'AFFILIATE_LIST', 'INSTI']
      - name: utm_source
        description: "Marketing traffic source identifier (extracted from issue title/body)"
      - name: utm_medium
        description: "Marketing channel or medium identifier (extracted from issue title/body)"
      - name: utm_campaign
        description: "Marketing campaign identifier (extracted from issue title/body)"
      - name: utm_content
        description: "Specific content identifier within the campaign (extracted from issue title/body)"
      - name: url
        description: "Complete URL associated with the record, typically pointing to a landing page"
      - name: landing_page_domain
        description: "Domain name of the landing page associated with the record"
      - name: landing_page_path
        description: "URL path of the landing page associated with the record"
      - name: referrer
        description: "URL or domain that referred the user to the site or page (Referrer), extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('REFERRER')"
      - name: partner_code
        description: "Partner code extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('PARTNER_CODE', 'PARTNER_FRAUD')"
      - name: partner_id
        description: "Partner ID extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('PARTNER_FRAUD')"
      - name: fraude
        description: "Fraud flag extracted from the issue title/body"
      - name: affiliate_code
        description: "Affiliate code extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('AFFILIATE_LIST')"
      - name: affiliate_classification
        description: "Affiliate classification asigned by business, extracted from the issue title/body"
      - name: affiliate_country
        description: "Country of the affiliate, extracted from the issue title/body"
      - name: affiliate_tier
        description: "Tier asigned by business, extracted from the issue title/body"
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['T1','T2','T3','T4','T5', null]
              row_condition: "input_type = 'AFFILIATE_LIST' AND affiliate_tier IS NOT NULL"
      - name: affiliate_fit
        description: "Fit asigned by business, extracted from the issue title/body"
      - name: affiliate_main_platform
        description: "Main platform asigned by business, extracted from the issue title/body"
      - name: team
        description: "Team responsible for the acquisition efforts and results attribution"
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Others','Mid-market','Product Marketing','Enp','Organic','Affiliates','Growth','Partners','Store Referral','Performance Brand','Performance No Brand','Communications','Mandae','Performance','Eea']
              row_condition: "input_type in ('UTM', 'SUBTEAM_MKT', 'URL', 'INSTI', 'REFERRER', 'PARTNER_CODE') AND state = 'open'"
      - name: subteam
        description: "Subteam responsible for the acquisition efforts and results attribution"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "input_type in ('SUBTEAM_MKT')"
      - name: user_create
        description: "GitHub username of the issue/input creator"
      - name: state
        description: "Current status of the GitHub issue/input (open or closed)"
        tests:
          - accepted_values:
              values: ['open', 'closed']
      - name: assignee
        description: "GitHub username of the assigned issue/input handler"
      - name: comments
        description: "Total number of comments on the GitHub issue/input"
      - name: created_at
        description: "Timestamp of when the GitHub issue/input was created"
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp of the most recent update to the GitHub issue/input"
        tests:
          - not_null
      - name: closed_at
        description: "Timestamp of when the GitHub issue/input was closed (if applicable)"
      - name: sys_audit_extracted_on
        description: "Timestamp of when the data was extracted from the GitHub API"
      - name: sys_audit_created_on
        description: "Timestamp of when this record was created in our data warehouse"
      - name: sys_audit_updated_on
        description: "Timestamp of when this record was last updated in our data warehouse"
      - name: sys_audit_created_by
        description: "System identifier of the process that created this record"
      - name: sys_audit_updated_by
        description: "System identifier of the process that last updated this record"
  

