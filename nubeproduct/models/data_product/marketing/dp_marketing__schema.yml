  - name: marketing_attribution_model
    description: "data product contains granular click-level data used in the marketing attribution model. Each click is linked to the responsible marketing team or source, enabling the attribution of acquisition results—such as store creation—to specific marketing efforts. This dataset supports performance analysis, reporting, and decision-making across acquisition channels"
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "marketing" 
        business_owner: "Giselle Galli" 
    columns:
      - name: store_id
        description: "Unique identifier for each store"
        tests:
          - not_null
      - name: click_order 
        description: "Order of the click"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              strictly: false
      - name: click_qty
        description: "Quantity of clicks involved on the journey to the store creation"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              strictly: false
      - name: click_id 
        description: "Unique identifier for each click"
        tests:
          - dbt_expectations.expect_column_values_to_be_unique:
              row_condition: "click_id is not null"
      - name: click_timestamp
        description: "Timestamp of when the click occurred"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "click_id is not null"
      - name: source
        description: "Indicates the origin of the traffic, such as the platform or channel (e.g., Google, Facebook, newsletter) that brought the user to the site. Used to identify the marketing team or partner responsible for the click."
      - name: medium
        description: "Describes the marketing medium through which the traffic arrived (e.g., email, CPC, social, referral). Helps classify the type of acquisition effort."
      - name: campaign
        description: "Specifies the name or identifier of the marketing campaign associated with the click. Useful for measuring the performance of specific initiatives."
      - name: content
        description: "Used to differentiate between variations of content or creatives within the same campaign (e.g., different ads or links). Supports more granular attribution analysis."
      - name: referrer_domain
        description: "Domain of the page that referred the user before landing on the site. Useful for identifying external sources or traffic origins not captured by UTM parameters."
      - name: referrer_path
        description: "Full path from the referring URL, providing more detailed context about the exact page that led the user to the site. Helps in refining attribution when the domain alone is not sufficient."
      - name: landing_page_domain
        description: "Domain of the landing page where the user first arrived. Helps identify which property or microsite was involved in the acquisition."
      - name: landing_page_path
        description: "Path of the landing page URL, capturing the specific page or content that the user landed on. Useful for mapping custom campaigns or tracking user entry points."
      - name: attribution_source
        description: "Indicates the source system from which the attribution click data was retrieved. Possible values include local_db, amplitude, or empty (when no click data was available). This field helps track data lineage and diagnose attribution completeness."
      - name: country
        description: "Country associated with each store, based on registration data."
      - name: created_at
        description: "Date when the store was officially created in the system."
        tests:
          - not_null
      - name: first_payment
        description: "Date when the first payment was made"
      - name: churned_at
        description: "Date when the store was churned"
      - name: first_seller_at
        description: "Date when the first seller was made (first time achieving 7 sales in 90 days window)"
      - name: device
        description: "Device type used by the user during the store creation process (e.g., desktop, app, mobile)."
        tests:
          - not_null
          - accepted_values:
              values: ['desktop', 'app', 'mobile', 'tablet', 'undefined']
      - name: register_url
        description: "URL of the store's registration page."
      - name: partner_id
        description: "ID of the store's partner, if a partner was involved in the store's creation."
      - name: partner_code
        description: "Code of the store's partner, if a partner was involved in the store's creation."
      - name: partnership_type
        description: "Type of partnership, if a partner was involved in the store's creation."
      - name: blocked_fraud_tag
        description: "Flag indicating if the store is blocked or fraudulent"
        tests:
          - accepted_values:
              values: [0, 1]
      - name: affiliate_type
        description: "Type of affiliate, if an affiliate was involved in the store's creation."
      - name: new_payment_probability
        description: "Estimated probability that the store will convert to a paying customer."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: prod_cutoff
        description: "Threshold value used to determine whether a store qualifies as a quality lead based on its predicted conversion probability."
      - name: mkt_source
        description: "Team responsible for the acquisition efforts and results attribution"
        tests:
          - not_null
      - name: mkt_subteam
        description: "Subteam responsible for the acquisition efforts and results attribution"
        tests:
          - not_null
      - name: trials_last_click
        description: "Set to 1 when the acquisition of the trial store is attributed to the last recorded click."
        tests:
          - accepted_values:
              values: [0, 1]
      - name: trials_first_click
        description: "Set to 1 when the acquisition of the trial store is attributed to the first recorded click."
        tests:
          - accepted_values:
              values: [0, 1]
      - name: trials_mean_click
        description: "Official attribution model. Each click receives a weighted contribution to the store acquisition, and the aggregated attribution is assigned to each team per store."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: input_sources
        description: "List of inputs that were used to attribute the store creation to control incrementality in the attribution model"
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp of when the data was created"
      - name: sys_audit_created_by
        description: "System identifier of the process that created this record"
      - name: sys_audit_updated_on
        description: "Timestamp of when the data was last updated"
      - name: sys_audit_updated_by
        description: "System identifier of the process that last updated this record"
  

  - name: marketing_attribution_completeness
    description: "data product contains the completeness data quality checks of the marketing attribution model"
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "marketing" 
        business_owner: "Giselle Galli" 
    columns:
      - name: country
        description: "Country associated with each store, based on registration data."
        tests:
          - not_null
      - name: created_at
        description: "Date when the store was officially created in the system."
        tests:
          - not_null
      - name: device
        tests:
          - not_null
          - accepted_values:
              values: ['desktop', 'app', 'mobile', 'tablet', 'undefined']
      - name: stores_source_spark_catalog
        description: "Count of stores attributed to the 'spark_catalog' source, indicating origin from internal backend systems."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: false
      - name: stores_source_empty
        description: "Count of stores for which the source attribution is missing or not specified. This typically occurs when users disable tracking mechanisms or clear their cookies, preventing source identification."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: false
      - name: stores_total
        description: "Total count of stores adquired on this date from all sources."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              strictly: false


