version: 2

models:
  - name: ga4_user_events
    columns:
      - name: u_user_pseudo_id
        tests:
          - not_null
      - name: unique_session
        tests:
          - not_null
      - name: event_timestamp
        tests:
          - not_null
  - name: hubspot_active_stores
    columns:
      - name: store_id
        tests:
          - not_null
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 300000
          max_value: 1000000

