  - name: g__upsell__aquarium__agg_monthly
    description: >
      Midmarket Upsell Aquarium data product. Identifies potential upsell opportunities by analyzing stores from finance metrics,
      enriched with Success pipeline status, existing Upsell deal tracking, and comprehensive financial performance data.
      This model provides a monthly snapshot of stores that are candidates for upsell opportunities, including filters for
      Brazil-specific GMV thresholds and complete merchant profiles.
