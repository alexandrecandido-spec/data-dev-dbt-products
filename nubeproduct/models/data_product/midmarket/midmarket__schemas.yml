  - name: midmarket_hubspot_deleted_deals
    description: >
      Data product that combines archived and merged HubSpot deals into a unified view.
      This model unions data from stg_archived_deals and stg_merged_deals to provide 
      a comprehensive view of all deals that have been removed from active HubSpot pipelines.
      Uses incremental strategy with merge to efficiently process only new or updated records
      from both staging models, optimizing performance and maintaining data consistency.
    config:
      meta:
        owner: "pedro.fregonese@tiendanube.com"
        domain: "midmarket"
        business_owner: "Franco Tiberti"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
            - deal_id
    columns:
      - name: deal_id
        description: "Unique identifier for the HubSpot deal. Primary key combining both archived and merged deals."
        tests:
          - unique
          - not_null
      - name: deletion_type
        description: "Type of deal removal indicating the reason the deal is no longer active. Either 'archived' for deals explicitly archived in HubSpot, or 'merged' for deals that were merged into other deals."
        tests:
          - not_null
          - accepted_values:
              values: ["archived", "merged"]
      - name: archived_at
        description: "Timestamp when the deal was archived in HubSpot. Only populated for archived deals (deletion_type = 'archived'). Null for merged deals as they don't have archive timestamps."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Preserved from staging models and maintains historical tracking of when each deal was first processed."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Inherited from staging models, typically 'data-dev-dbt-products'."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed. Updated on each incremental run for both archived and merged deals."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Always 'data-dev-dbt-products' for this automated process."
        tests:
          - not_null

  - name: s__onboarding__pipeline__snapshot
    description: >
      Midmarket Onboarding pipeline data product. Consolidates staging deals with business logic (status mapping, country derivation) and time metrics.
    config:
      meta:
        owner: "m.blanco@tiendanube.com"
        domain: "midmarket"
        business_owner: "Franco Tiberti"
    columns:
      - name: deal_id
        description: "Unique identifier for the HubSpot deal. Primary key."
        tests:
            - unique
            - not_null
      - name: store_id
        description: "Internal store identifier linked to the deal."      
      - name: country
        description: "Country derived from Onboarding pipeline (AR/BR/MX)."
        tests:
          - accepted_values:
              values: ["AR","BR","MX"]
      - name: pipeline
        description: "HubSpot pipeline in which the deal is/was located."
        tests:
          - accepted_values:
              values: ["Onboarding | BR","Onboarding | AR","Onboarding | MX"]
      - name: dealname
        description: "Deal name/title in HubSpot."
        tests:
            - not_null
      - name: gmv_potencial
        description: "Potential GMV associated with the deal."
      - name: deal_owner
        description: "HubSpot owner (user) identifier assigned to the deal."
      - name: stage
        description: "Deal stage within the pipeline."
        tests:
            - not_null
      - name: deal_status
        description: "Business status based on stage and go-live dates."
        tests:
          - accepted_values:
              values: ["completed","lost","paused","pre kick-off","on-going"]
      - name: pipeline_creation_date
        description: "Original deal creation date."
        tests:
            - not_null    
      - name: kick_off_date
        description: "Kick-off date of the onboarding process."
      - name: go_live_forecast_date
        description: "Expected go-live date (forecast)."
      - name: go_live_real_date
        description: "Actual go-live date."
      - name: churn_date
        description: "Derived churn date if the deal reached 'Churn'."
      - name: effective_churn_at
        description: "Effective churn date (raw field),if applicable."
      - name: downgrade_date
        description: "Derived downgrade date if the deal reached 'Downgrade'."
      - name: effective_out_of_portfolio_at
        description: "Effective out-of-portfolio date (raw field), if applicable."
      - name: lead_time
        description: "Days from kick-off to real go-live (from intermediate)."
      - name: on_going_lead_time
        description: "Days from kick-off to today when go-live is not yet reached (from intermediate)."
      - name: deadline_goal
        description: "Numeric deadline goal in days parsed from the label (original_deadline_goal)."
      - name: original_deadline_goal
        description: "Original onboarding deadline_goal as a label (e.g., '30 days')."
      - name: delay_reason
        description: "Reason for delay when applicable."
      - name: need_professional_services
        description: "Boolean flag for professional services needed (includes nulls)."
      - name: type_of_onboarding
        description: "Type/category of onboarding process (raw value)."
      - name: payment_method_actual_operation
        description: "Payment method currently used in operation (raw value)."
      - name: shipping_method_actual_operation
        description: "SShipping method currently used in operation (raw value)."
      - name: erp
        description: "ERP used by the merchant (raw value)."
      - name: e_commerce
        description: "E-commerce platform integration detail (raw value)."
      - name: acquisition_channel
        description: "Lead acquisition channel as recorded in HubSpot (raw value)."
      - name: vertical
        description: "Merchant vertical/category."
      - name: city_state_sales
        description: "City and state/territory label used by Sales."
      - name: segmento_nuvemshop
        description: "Segment or tier of the merchant according to Nuvemshop classification during the Sales Development pipeline."
      - name: produto_nuvemshop
        description: "Segment or tier of the merchant according to Nuvemshop classification during the Sales pipeline."
      - name: associated_deal_ids
        description: "List of related deals associated with the same company or merchant."
      - name: forecast
        description: "Deal outcome forecast."
      - name: last_survey_answered
        description: "Identifier of the last survey answered by the merchant, if applicable."
      - name: subscription
        description: "Monthly subscription fee amount."
      - name: cpt
        description: "Cost per transaction (transaction fee)."
      - name: churn_downgrade_root_cause
        description: "Primary root cause for churn or downgrade (coalesced from effective_churn_root_cause and out_of_portfolio_root_cause)."
      - name: churn_downgrade_root_cause_2
        description: "Secondary root cause for churn or downgrade (coalesced from effective_churn_root_cause_2 and out_of_portfolio_root_cause_2)."
      - name: churn_downgrade_one_liner
        description: "Summary description of the churn or downgrade reason (coalesced from effective_churn_one_liner and out_of_portfolio_one_liner)."
      - name: warning_date
        description: "Date when the deal entered a Warning stage (unified across AR, BR, and MX)."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Preserved from staging models and maintains historical tracking of when each deal was first processed."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Inherited from staging models, typically 'data-dev-dbt-products'."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed. Updated on each incremental run for both archived and merged deals."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Always 'data-dev-dbt-products' for this automated process."
        tests:
          - not_null


  - name: s__onboarding_feedback_submissions__snapshot
    description: >
      Midmarket Onboarding Feedback Submissions data product. Consolidates HubSpot feedback survey submissions related to onboarding processes with associated deal information.
    config:
      meta:
        owner: "pedro.fregonese@tiendanube.com"
        domain: "midmarket"
        business_owner: "Franco Tiberti"
    columns:
