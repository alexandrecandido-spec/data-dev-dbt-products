        tests:
          - not_null
      - name: created_at
        description: "Date when the store was created in the platform."
      - name: days_since_store_creation
        description: "Number of days since the store was created, calculated from current date."
      - name: store_antiquity
        description: "Store age classification or antiquity bucket."
      - name: domain
        description: "Domain name of the store."
      - name: country
        description: "Country where the store operates (AR/BR/MX)."
        tests:
          - accepted_values:
              values: ["AR", "BR", "MX"]
      - name: vertical
        description: "Business vertical or industry category of the store."
      - name: current_segment
        description: "Current segment classification of the store based on merchant attributes."
