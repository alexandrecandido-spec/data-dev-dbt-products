        description: "Date when the feedback survey was submitted by the merchant."
        tests:
          - not_null
      - name: name_and_website_of_the_store
        description: "Store name and website URL as reported in the feedback submission."
      - name: survey_name
        description: "Name of the survey template used (filtered to onboarding-related surveys only)."
        tests:
          - not_null
      - name: general_product_score
        description: "Overall product satisfaction score provided by the merchant (numeric rating)."
      - name: onboarding_experience_score
        description: "Onboarding experience satisfaction score provided by the merchant (numeric rating)."
      - name: tiendanube_helps_growth
        description: "Rating indicating how much the merchant believes Tiendanube/Nuvemshop helps their business growth (numeric rating)."
      - name: tiendanube_recommendation_probability
        description: "Net Promoter Score (NPS) - likelihood that the merchant would recommend Tiendanube/Nuvemshop to others (numeric rating, typically 0-10)."
      - name: experience_with_apps
        description: "Rating of the merchant's experience with Tiendanube/Nuvemshop apps and integrations (numeric rating)."
      - name: extra_feedback
        description: "Free-text comments and additional feedback provided by the merchant."
      - name: value_quality_hired_agency
        description: "Quality rating for hired agency services, if applicable."
      - name: value_quality_pro_serv
        description: "Quality rating for professional services provided by Tiendanube/Nuvemshop, if applicable."
      - name: value_service_hired_agency
        description: "Service rating for hired agency, if applicable."
      - name: value_service_pro_serv
        description: "Service rating for professional services provided by Tiendanube/Nuvemshop, if applicable."
      - name: value_hired_agency_deadline
        description: "Rating for hired agency's adherence to deadlines and timelines, if applicable."
      - name: value_pro_serv_deadline
        description: "Rating for professional services' adherence to deadlines and timelines, if applicable."
      - name: deal_id
        description: "HubSpot deal identifier from the Onboarding pipeline associated with this feedback. When multiple deals share the same feedback_id, the deal with the highest GMV is selected."
      - name: country
        description: "Country derived from the associated Onboarding deal (AR/BR/MX)."
        tests:
          - accepted_values:
              values: ["AR", "BR", "MX"]
      - name: dealname
        description: "Deal name from the associated Onboarding pipeline deal."
      - name: deal_owner
        description: "HubSpot owner (user) identifier assigned to the associated Onboarding deal."
      - name: go_live_real_date
        description: "Actual go-live date from the associated Onboarding deal."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Typically 'data-dev-dbt-products'."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp when the record was last processed or refreshed."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Always 'data-dev-dbt-products' for this automated process."
        tests:
          - not_null


