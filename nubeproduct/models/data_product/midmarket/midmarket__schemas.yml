        description: Gross Merchandise Value in local currency for the given week.
      - name: gmv_usd
        description: Gross Merchandise Value in USD for the given week.
      - name: gmv_local_currency_90d
        description: Gross Merchandise Value in local currency for the last 90 days.
      - name: gmv_usd_90d
        description: Gross Merchandise Value in USD for the last 90 days.
      - name: gmv_tier
        description: GMV tier classification for the store.
      - name: sessions
        description: Number of sessions for the given week.
      - name: previous_sessions
        description: Number of sessions in the previous week.
      - name: calls
        description: Number of calls made during the week.
      - name: emails
        description: Number of emails sent during the week.
      - name: meetings
        description: Number of meetings held during the week.
      - name: tasks
        description: Number of tasks completed during the week.
      - name: whatsapp
        description: Number of WhatsApp messages sent during the week.
      - name: next_meeting
        description: Date of the next scheduled meeting with the store.
      - name: vertical
        description: Merchant vertical/category classification.
      - name: previous_gmv_local_currency
        description: Gross Merchandise Value in local currency from the previous week for comparison purposes.
      - name: contract_end_date
        description: End date of the store's contract.
      - name: periodicity
        description: Time period aggregation, set to 'weekly' for this model.


