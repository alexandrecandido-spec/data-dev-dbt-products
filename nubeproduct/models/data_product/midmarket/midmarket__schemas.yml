  - name: s__ga4__sessions__hubspot
    description: >
      Data product that merges GA4 session and pageview events linked to HubSpot conversions.<br>
      It applies hierarchical logic to prioritize `session_start` events and supplement missing ones with `page_view` events.<br>
      The model ensures accurate session attribution, even when GA4 fails to emit `session_start` events.<br>
      Each record represents a unique session associated with a HubSpot form submission (`hubspot_conversion_id`).
    config:
      meta:
        owner: "renan.ferrari@nuvemshop.com.br"
        domain: "midmarket"
        business_owner: "Franco Tiberti"
    columns:
      - name: date_time
        description: "Timestamp of the event (converted from microseconds to a readable datetime)."
        tests:
          - not_null
      - name: user_pseudo_id
        description: "Anonymous GA4 user identifier used to link sessions and HubSpot conversions."
        tests:
          - not_null
      - name: session_number
        description: "GA4 session number (`ga_session_number`) extracted from the event parameters."
      - name: session_source
        description: >
          Session source.<br>
          Derived according to event type:<br>
          1. From `traffic_source.source` for `session_start`.<br>
          2. From URL UTM parameters for `page_view` without `session_start`.<br>
          3. Defaults to `(direct)` when both UTM and `traffic_source` are missing.
      - name: session_medium
        description: >
          Session medium (e.g., organic, cpc, referral).<br>
          Filled with `(none)` when UTM or `traffic_source.medium` is unavailable.
      - name: session_campaign
        description: >
          Campaign name (`utm_campaign` or `traffic_source.name`).<br>
          Defaults to `(direct)` when no value is available.
      - name: session_device
        description: "Device category (e.g., desktop, mobile, tablet)."
      - name: event_type
        description: >
          Indicates the origin of the record:<br>
          - `session_start`: directly originated from a GA4 session event.<br>
          - `page_view`: included due to differing UTM parameters or absence of session information.
      - name: hubspot_conversion_id
        description: >
          Conversion GUID (`submissionGuid`) extracted from HubSpot form URLs.<br>
          Serves as the unique identifier for the lead conversion associated with this session.
        tests:
          - not_null



