version: 1
models:
  - name: fintech_contracts
    description: >
      Contains all disbursed contracts with risk classification, policy and offer id.
    config:
      meta:
        owner: "sofia.sanchez@tiendanube.com"
        domain: "fintech"
        business_owner: "Calvin Hetem"
    columns:
      - name: id
        description: "Unique internal identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: hub_contract_id
        description: "Unique external identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: quotation_id
        description: "Identifier for the quotation associated with this contract."
      - name: borrower_document
        description: "Document identifier of the borrower."
        tests:
          - not_null
      - name: borrower_name
        description: "Name of the borrower."
      - name: disbursed_at
        description: "Date and time when the contract was disbursed."
        tests:
          - not_null
      - name: disbursed_month
        description: "Month when the contract was disbursed."
      - name: created_at
        description: "Date and time when the contract was created."
        tests:
          - not_null
      - name: updated_at
        description: "Date and time when the contract was last updated."
      - name: finished_at
        description: "Date and time when the contract was finished."
      - name: first_installment_at
        description: "Date and time of the first installment due date."
      - name: last_installment_at
        description: "Date and time of the last installment due date."
      - name: status
        description: "Current status of the contract (e.g., finished, paying)."
      - name: portfolio_type
        description: "Type of portfolio (renegotiation or general)."
      - name: installments_number
        description: "Initial number of installments for the contract."
      - name: operation_total_taxes_amount
        description: "Total amount of taxes for the operation."
      - name: operation_total_costs_amount
        description: "Total amount of costs for the operation."
      - name: operation_gross_amount
        description: "Gross amount of the operation. Equivalent to (operation_net_amount + operation_total_taxes_amount + operation_total_costs_amount)"
      - name: operation_net_amount
        description: "Net amount of the operation, equal to the amount requested by the borrower."
      - name: interest_monthly_rate
        description: "Monthly interest rate applied to the contract."
      - name: lending_hub
        description: "Hub of the credit. Currently only Mova."
      - name: payer_id
        description: "Identifier of the payer."
      - name: original_contract_ids
        description: "IDs of original contracts (used for renegotiations)."
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null
      - name: collection_strategy
        description: "Strategy used for collection."
      - name: payer_state
        description: "State of the payer."
      - name: engine_offer_id
        description: "Identifier of the offer (internal engine) which generated the contract."
      - name: evaluation_link_type
        description: "Type of association between the credit and the offer (New -from internalized experience-, Historical -generated through a join between document number and the date of the quotation-, Unknown -not associated to an offer-)."
      - name: custom_status
        description: "Custom status classification (renegotiated, canceled, or original status)."
      - name: evaluation_month
        description: "Month when the evaluation and offer was generated."
      - name: risk_classification
        description: "Risk classification of the contract."
      - name: policy
        description: "Risk policy applied to the contract."
      - name: policy_classification
        description: "Classification based on policy and risk combination."
      - name: sys_audit_created_by
        description: "System audit field indicating who created the record."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "System audit field indicating when the record was created."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System audit field indicating who last updated the record."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "System audit field indicating when the record was last updated."
        tests:
          - not_null
  - name: credit_vintages
    description: >
      Contains all original installments of each contract with the amount of paid installments. Use to derive First and Third Payment default
    config:
      meta:
        owner: "sofia.sanchez@tiendanube.com"
        domain: "fintech"
        business_owner: "Calvin Hetem"
    columns:
      - name: hub_contract_id
        description: "External identifier for each contract."
      - name: first_installment_month
        description: "Month of the first installment."
      - name: calendar_month
        description: "Month of the installment."
      - name: initial_due_date
        description: "Due date of the installment according to the initial structure of the contract."
      - name: rank_installments
        description: "Number of the installment."
      - name: initial_expected_amount
        description: "Expected amount to be received according to the initial structure of the contract."
      - name: initial_principal_expected_amount
        description: "Expected amount of principal component to be received according to the initial structure of the contract."
      - name: paid_amount
        description: "Total paid amount of the installment that has been paid until initial_due_date + 10 days as grace period."
      - name: original_paid_amount
        description: "Original amount of the installment that has been paid until initial_due_date + 10 days as grace period."
      - name: principal_paid_amount
        description: "Principal amount of the principal component that has been paid until initial_due_date + 10 days as grace period."
      - name: initial_unpaid_amount
        description: "Initial unpaid amount of the installment until initial_due_date + 10 days as grace period."
      - name: initial_principal_unpaid_amount
        description: "Initial unpaid amount of the principal component until initial_due_date + 10 days as grace period."
      - name: sys_audit_created_by
        description: "System audit field indicating who created the record."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "System audit field indicating when the record was created."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System audit field indicating who last updated the record."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "System audit field indicating when the record was last updated."
        tests:
          - not_null
  - name: s__lending__contracts_present_value__event
    description: >
      Contains all balance informations regarding each contract for each day since 2025-04-14
    config:
      meta:
        owner: "calvin.hetem@nuvemshop.com.br"
        domain: "fintech"
        business_owner: "Calvin Hetem"
    columns:
      - name: data_ref
        description: "Reference date."
      - name: store_id
        description: "Store identifier."
      - name: hub_contract_id
        description: "Unique external identifier for each proposal."
        tests:
          - not_null
      - name: installment_status
        description: "Installment status. Possible values are 'A VENCER', 'ATRASADA', 'INADIMPLENTE', 'PDD', 'EM APURAÇÃO'"
      - name: contract_base_amount
        description: "contract's expected amount to be paid if each installment is paid on it's due date."
      - name: contract_principal_amount
        description: "contract's principal amount to be paid at any point."
      - name: contract_interest_amount
        description: "contract's expected interest amount to be paid if each installment is paid on it's due date."
      - name: additional_late_fine
        description: "Fine amount to be paid."
      - name: additional_late_contract_interest
        description: "Addicional interest amount to be paid."
      - name: additional_late_penalty_interest
        description: "Penalty interest amount to be paid."
      - name: additional_late_taxes
        description: "Additional taxes amount to be paid."
      - name: discount_pre_payment
        description: "Possible discount amount if contract is paid at data_ref."
      - name: contract_accumulated_amount
        description: "Total interest amount to be paid if contract is paid at data_ref."
      - name: contract_updated_amount
        description: "Total amount to be paid if contract is paid at data_ref."
      - name: sys_audit_created_by
        description: "System audit field indicating who created the record."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "System audit field indicating when the record was created."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System audit field indicating who last updated the record."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "System audit field indicating when the record was last updated."
        tests:
          - not_null