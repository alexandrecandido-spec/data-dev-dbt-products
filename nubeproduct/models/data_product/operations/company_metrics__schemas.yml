version: 2
models:
  - name: company_metrics_paid_orders
    meta:
      owner: "gustavo.braga@nuvemshop.com.br"
      domain: "operations"
      business_owner: "Nico Loreti"
    description: >
      Contains the summary of paid orders by store, including currency-related data,
      payment gateways, shipping methods, and audit metadata.
    columns:
      - name: id
        description: Unique identifier of the order. Unique key.
        tests:
          - not_null
          - unique
      - name: store_id
        description: Identifier of the store that got the order. External key.
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: country
        description: Store’s country.
      - name: completed_at
        description: Timestamp when the order was completed.
      - name: gateway
        description: Payment gateway used for the order.
      - name: shipping_method
        description: Shipping method selected by the customer.
      - name: storefront
        description: Storefront from which the order came
      - name: currency
        description: Original currency used in the order.
      - name: country_currency
        description: Expected local currency based on the store’s country.
      - name: shipping_cost
        description: Shipping cost in the original currency.
      - name: total_in_usd
        description: Total amount converted to USD considering the dollar sell rate value for Argentina.Exchange rate value obtained from finance_exchange_rate.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "total_in_usd IS NOT NULL AND sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: total
        description: Total amount converted to the expected local currency considering the dollar sell rate value for Argentina. Exchange rate value obtained from finance_exchange_rate.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "total IS NOT NULL AND sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: gateway_integration_type
        description: Type of integration with the payment gateway.
      - name: shipping_option
        description: Shipping option selected.
      - name: shipping_pickup_type
        description: Type of pickup.
      - name: shipping_province
        description: Province or region to which the order was shipped.
      - name: gateway_installments
        description: Number of installments used in the payment.
      - name: contact_email
        description: Customer's contact email address.
      - name: paid_at
        description: Timestamp when the order was paid. Information obtained from the order log
      - name: store_status
        description: Current status of the store.
      - name: payment
        description: Payment details.
      - name: shipping
        description: Shipping details.
      - name: platform_type
        description: Whether it was done on or off platform.
      - name: year_month_day_code
        description: YYYYMMDD code used for partitioning the data. Partition Key
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: product_quantity
        description: Total number of items in the order, including repeated products.
      - name: is_foreign_currency
        description: Indicates whether the payment was made in a currency different from the expected local currency.
      - name: sys_audit_created_on
        description: Timestamp when the row was initially created in the summary table.
      - name: sys_audit_created_by
        description: Source or user responsible for the initial row creation.
      - name: sys_audit_updated_on
        description: Timestamp of the latest update to the row.
      - name: sys_audit_updated_by
        description: Source or user responsible for the latest update.


  - name: company_metrics_gmv_and_segments
    meta:
      owner: "gustavo.braga@nuvemshop.com.br"
      certification: 'Gold'
      domain: "operations"
      business_owner: "Nico Loreti"
    description: >
      Contains monthly GMV, order metrics, and seller segmentation by store, both on and off platform,
      over the last closed month and the past 90 days. Segments are calculated based on proportional 
      order volume and grouped into top, large, medium, small, tiny, struggling, or no-seller.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
            - datemonth
            - store_id
    columns:
      - name: store_id
        description: Unique identifier of the store. External key.
        tests:
          - not_null
      - name: datemonth
        description: First day of the month used as the partition column. Partition Key. This field and store_id form the unique key.
        tests:
          - not_null
      - name: country
        description: Country where the store belongs.
      - name: country_currency
        description: Local expected currency based on the store's country.
      - name: created_at
        description: Timestamp when the store was created.
      - name: proportional_segment
        description: Store segment calculated based on a proportional formula.
      - name: is_paying_merchant
        description: Boolean indicating if the store is a paying merchant.
      - name: orders_monthly
        description: Total number of orders in the last closed month.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "orders_monthly IS NOT NULL"
      - name: gmv_usd_monthly
        description: Gross Merchandise Value (GMV) in USD for the last closed month.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "gmv_usd_monthly IS NOT NULL"
      - name: gmv_local_currency_monthly
        description: GMV in the local currency for the last closed month.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "gmv_local_currency_monthly IS NOT NULL"
      - name: orders_general_90d
        description: Total number of orders (on and off platform) in the last 90 days.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "orders_general_90d IS NOT NULL"
      - name: segment
        description: Seller segment based on all orders in the last 90 days.
        tests:
          - not_null
          - accepted_values:
              values: ["top-seller", "large-seller", "medium-seller", "small-seller", "tiny-seller", "struggling-seller", "no-seller"]
      - name: orders_on_platform_monthly
        description: Number of orders made on the platform during the last closed month.
      - name: gmv_usd_on_platform_monthly
        description: GMV in USD for orders made on the platform during the last closed month.
      - name: gmv_local_currency_on_platform_monthly
        description: GMV in local currency for on-platform orders during the last closed month.
      - name: orders_on_platform_90d
        description: Number of on-platform orders in the last 90 days.
      - name: segment_on_platform
        description: Seller segment based on on-platform orders in the last 90 days.
        tests:
          - accepted_values:
              values: ["top-seller", "large-seller", "medium-seller", "small-seller", "tiny-seller", "struggling-seller", "no-seller"]
      - name: orders_off_platform_monthly
        description: Number of orders made off-platform during the last closed month.
      - name: gmv_usd_off_platform_monthly
        description: GMV in USD for off-platform orders during the last closed month.
      - name: gmv_local_currency_off_platform_monthly
        description: GMV in local currency for off-platform orders during the last closed month.
      - name: orders_off_platform_90d
        description: Number of off-platform orders in the last 90 days.
      - name: segment_off_platform
        description: Seller segment based on off-platform orders in the last 90 days.
        tests:
          - accepted_values:
              values: ["top-seller", "large-seller", "medium-seller", "small-seller", "tiny-seller", "struggling-seller", "no-seller"]
      - name: gmv_usd_90d
        description: Gross Merchandise Value (GMV) in USD for the last 90 days.
      - name: gmv_local_currency_90d
        description: Gross Merchandise Value (GMV) in local currency for the last 90 days.
      - name: gmv_usd_on_platform_90d
        description: Gross Merchandise Value (GMV) in USD for on-platform orders during the last 90 days.
      - name: gmv_local_currency_on_platform_90d
        description: Gross Merchandise Value (GMV) in local currency for on-platform orders during the last 90 days.
      - name: gmv_usd_off_platform_90d
        description: Gross Merchandise Value (GMV) in USD for off-platform orders during the last 90 days.
      - name: gmv_local_currency_off_platform_90d
        description: Gross Merchandise Value (GMV) in local currency for off-platform orders during the last 90 days.
      - name: sys_audit_created_on
        description: Timestamp when the row was originally created.
      - name: sys_audit_created_by
        description: System or user that created the row.
      - name: sys_audit_updated_on
        description: Timestamp of the most recent update to the row.
      - name: sys_audit_updated_by
        description: System or user that last updated the row.

  - name: operations_grouping_plans
    config:
      meta:
        owner: "guillermo.defelice@tiendanube.com"
        domain: "operations"
        business_owner: "Fran Ramirez"
    description: Contains information about plans (group, if it existed before freemium and nice name).
    columns:
      - name: plan
        description: Unique identifier of plan (id from plan_countries).
        tests:
          - not_null
          - unique
      - name: grupo
        description: Plan type.
        tests:
          - accepted_values:
              values: ['enterprise', 'freemium', 'lojinha', 'no-stores', 'plan-a', 'plan-b', 'plan-c', 'plan-emprendedor', 'test_broken', 'zero-fee']
      - name: before_freemium_launch
        description: If the plan existed before freemium launch.
      - name: namev2
        description: Name of the plan as seen by the merchant.
      - name: sys_audit_created_on
        description: Timestamp when the row was initially created in the summary table.
      - name: sys_audit_created_by
        description: Source or user responsible for the initial row creation.
      - name: sys_audit_updated_on
        description: Timestamp of the latest update to the row.
      - name: sys_audit_updated_by
        description: Source or user responsible for the latest update.


  - name: operations_grouping_sessions
    config:
      meta:
        owner: "guillermo.defelice@tiendanube.com"
        domain: "operations"
        business_owner: "Franco Tiberti"
    description: Contains the number of sessions per week and per month.
    columns:
      - name: date_from
        description: Date of the Monday where the week starts (weekly) or the first day of the month (monthly).
        tests:
          - not_null
      - name: store_id
        description: Unique identifier of the store_id.
        tests:
          - not_null
      - name: periodicity
        description: Data aggregated by week or month.
      - name: sessions
        description: Quantity of store sessions.
      - name: previous_sessions
        description: Quantity of store sessions in the previous period.
      - name: sys_audit_created_on
        description: Timestamp when the row was initially created in the summary table.
      - name: sys_audit_created_by
        description: Source or user responsible for the initial row creation.
      - name: sys_audit_updated_on
        description: Timestamp of the latest update to the row.
      - name: sys_audit_updated_by
        description: Source or user responsible for the latest update.


  - name: company_metrics_products_per_order
    config:
      meta:
        owner: "gustavo.braga@nuvemshop.com.br"
        domain: "operations"
        business_owner: "Giselle Galli"
    description: >
      Contains the summary of paid orders by store, including currency-related data,
      payment gateways, shipping methods, and audit metadata.
    columns:
      - name: order_id
        description: id of the order.
      - name: product_quantity
        description: Total number of items in the order, including repeated products.
      - name: sys_audit_created_on
        description: Timestamp when the row was initially created in the summary table.
      - name: sys_audit_created_by
        description: Source or user responsible for the initial row creation.
      - name: sys_audit_updated_on
        description: Timestamp of the latest update to the row.
      - name: sys_audit_updated_by
        description: Source or user responsible for the latest update.

  - name: company_metrics_merchant_info
    description: "This table contains the main descritive attributes of each store, including vertical, segment, location, and other classification fields."
    config:
      meta:
        business_owner: "gustavo.braga@nuvemshop.com.br"
        domain: "operations"
        business_owner: "Franco Tiberti"
    columns:
      - name: store_id
        description: "Unique identifier of the store. External key."
        tests:
          - not_null
      - name: created_at
        description: "Store creation date. Format YYYY-MM-DD."
        tests:
          - not_null
      - name: country_code
        description: "Code of the country as provided by the store info base."
        tests:
          - not_null
      - name: country_name
        description: "Name of the country as provided by the store info base."
        tests:
          - not_null
      - name: base_country_code
        description: "Code of the country as provided by the shipping source."
        tests:
          - not_null
      - name: base_country_name
        description: "Name of the country as provided by the shipping source."
        tests:
          - not_null
      - name: base_region_name
        description: "Name of the geographic region (e.g., used in Brazil) as provided by the shipping source."
        tests:
          - not_null
      - name: base_state_name
        description: "Name of the state or province as provided by the shipping source."
        tests:
          - not_null
      - name: base_city_name
        description: "Name of the city as provided by the shipping source."
        tests:
          - not_null
      - name: current_segment_name
        description: "Descriptive name of the current segment (e.g., no-seller, struggling-seller) associated this store."
        tests:
          - not_null
      - name: current_segment_date_id
        description: "Date indicating since when this segment has been associated with the store."
      - name: max_segment_name
        description: "Descriptive name of the maximum segment (e.g., no-seller, struggling-seller) associated this store."
        tests:
          - not_null
      - name: max_segment_date_id
        description: "Date the store was last classified under its highest segment."
      - name: vertical_name
        description: "Descriptive label of the vertical (e.g., small-business, medium-business, etc) associated this store."
        tests:
          - not_null
      - name: business_size_name
        description: "Descriptive label of the business size (e.g., small-business, medium-business, etc) associated this store."
        tests:
          - not_null
      - name: group_name
        description: "Name of the grouping plan (e.g., Basic, Business, Professional, etc) associated this store."
        tests:
          - not_null
      - name: domain
        description: "Custom store domain name created by the client."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
      - name: sys_audit_created_by
        description: "System or user that created the row."
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the row."
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."

  - name: hubspot_company_variables
    meta:
      owner: "gustavo.braga@nuvemshop.com.br"
      domain: "operations"
      business_owner: "Franco Tiberti"
    description: >
      Contains simplified store attributes for HubSpot integration, including only
      vertical classification and current segment status. Returns empty strings
      instead of null values to ensure compatibility with external systems.
    columns:
      - name: store_id
        description: "Unique identifier of the store. External key."
        tests:
          - not_null
          - unique
      - name: status_by_order_str
        description: "Descriptive name of the current segment (e.g., no-seller, struggling-seller) associated with this store. Returns empty string if null."
        tests:
          - not_null
      - name: vertical_str
        description: "Descriptive label of the vertical (e.g., small-business, medium-business, etc) associated with this store. Returns empty string if null."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
      - name: sys_audit_created_by
        description: "System or user that created the row."
      - name: sys_audit_updated_on
        description: "Maximum timestamp from all dependency tables (dim_merchant_info and related dimension tables)."
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."