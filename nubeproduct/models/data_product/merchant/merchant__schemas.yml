version: 2
models:
  - name: s__attributes__store_core__ref
    description: "Data Product silver that contains the core attributes of each store."
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "merchant"
        business_owner: "Analytics Engineering"
    columns:
      - name: store_id
        description: "Store identifier."
        tests: [not_null, unique]
      - name: created_at
        description: "Date when the store was created."
        tests: [not_null]
      - name: domain
        description: "Domain of the store."
        tests: [not_null]
      - name: country_code
        description: "Country code of the store."
        tests: [not_null]
      - name: country_name
        description: "Country name of the store."
        tests: [not_null]
      - name: region_name
        description: "Region name of the store."
        tests: [not_null]
      - name: state_name
        description: "State name of the store."
        tests: [not_null]
      - name: city_name
        description: "City name of the store."
        tests: [not_null]
      - name: currency
        description: "Currency of the store."
      - name: device
        description: "Device type used by the user during the store creation process (e.g., desktop, app, mobile)."
        tests:
          - not_null
          - accepted_values:
              values: ['desktop', 'app', 'mobile', 'tablet', 'undefined']
      - name: register_url
        description: "Register URL of the store."
      - name: partner_id
        description: "Partner ID of the store."
      - name: partnership_type
        description: "Partnership type of the store."
      - name: partner_code
        description: "Partner code of the store."
      - name: vertical_name
        description: "Vertical name of the store."
        tests: [not_null]
      - name: business_size_name
        description: "Business size name of the store."
        tests: [not_null]
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: s__attributes__store_identity__ref
    description: "Data Product silver that contains the identity attributes of each store. Includes identification data, contact information, fiscal documents, social media, active theme, and information about the installation of the nuvemshop/tendanube app."
    config:
      meta:
        owner: "jhu.boggio@tiendanube.com"
        domain: "merchant"
        business_owner: "Analytics Engineering"
    columns:
      - name: store_id
        description: "ID único de la tienda"
        tests:
          - not_null
          - unique
      - name: main_user_id
        description: "ID del usuario principal de la tienda"
      - name: store_name
        description: "Nombre de la tienda (desde i18n)"
      - name: store_description
        description: "Descripción de la tienda (desde i18n)"
      - name: user_email
        description: "Email del usuario principal"
      - name: user_first_name
        description: "Nombre del usuario principal"
      - name: user_last_name
        description: "Apellido del usuario principal"
      - name: user_nicename
        description: "Nombre de usuario (nicename) del usuario principal"
      - name: user_registered_at
        description: "Fecha de registro del usuario principal"
      - name: user_role
        description: "Rol del usuario principal"
      - name: phone_from_footer
        description: "Teléfono desde el footer de la tienda"
      - name: owner_phone_number
        description: "Número de teléfono del dueño (sin formatear)"
      - name: phone_whatsapp_button
        description: "Número de WhatsApp del botón de contacto"
      - name: owner_phone
        description: "Teléfono del dueño formateado con código de país"
      - name: doc_type
        description: "Tipo de documento fiscal (ej: CPF, CNPJ)"
      - name: doc_number
        description: "Número de documento fiscal"
      - name: instagram
        description: "Usuario de Instagram de la tienda"
      - name: facebook
        description: "URL o usuario de Facebook de la tienda"
      - name: twitter
        description: "Usuario de Twitter de la tienda"
      - name: tiktok
        description: "Usuario de TikTok de la tienda"
      - name: pinterest
        description: "Usuario de Pinterest de la tienda"
      - name: active_theme
        description: "Nombre del tema activo actual (ej: 'sydney', 'tokyo')"
      - name: first_date_config_theme
        description: "Fecha de la primera configuración de tema"
      - name: last_date_config_theme
        description: "Fecha de la última configuración de tema"
      - name: tiendanube_app_installed_at
        description: "Date when the nuvemshop/tendanube app was installed"
      - name: sys_audit_created_on
        description: "Timestamp of when this record was created in our data warehouse"
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System identifier of the process that created this record"
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of when this record was last updated in our data warehouse"
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System identifier of the process that last updated this record"
        tests:
          - not_null


  - name: s__lifecycle__first_seller_date__ref
    description: "This data product identifies the first date on which a store qualified as a “seller”, based on sales performance, and aligns it with the store’s presence in the moltres_store_info. The main goal is to determine when each store first achieved at least 7 sales in a rolling 90-day window, according to data from company_metrics_paid_orders."
    config:
      meta:
        owner: "giselle.galli@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli" 
    columns:
      - name: store_id
        description: "Unique identifier for each store"
        tests:
          - not_null
      - name: year_month_day_code
        description: YYYYMMDD code used for partitioning the data. Partition Key
        tests:
          - not_null 
      - name: first_seller_at
        description: "Date when the first seller was made (first time achieving 7 sales in 90 days window)"
      - name: sys_audit_created_on
        description: "Timestamp of when this record was created in our data warehouse"
      - name: sys_audit_updated_on
        description: "Timestamp of when this record was last updated in our data warehouse"
      - name: sys_audit_created_by
        description: "System identifier of the process that created this record"
      - name: sys_audit_updated_by
        description: "System identifier of the process that last updated this record"
  

  - name: s__lifecycle__store_status__ref
    description: "This data product contains the lifecycle status of each store, including its first payment date, churn date, first seller date, current plan, current segment, whether it is a seller or not, whether it is blocked or not, and the reason for blocking."
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "merchant"
        business_owner: "Analytics Engineering" 
    columns:
      - name: store_id
        description: "Unique identifier for each store"
        tests:
          - not_null
          - unique
      - name: first_payment
        description: "Date when the first payment was made"
      - name: churned_at
        description: "Date when the store churned"
      - name: first_seller_at
        description: "Date when the first seller was made (first time achieving 7 sales in 90 days window)"
      - name: new_seller
        description: "Whether the store is a new seller or not, TRUE if the store first payment date is before the first seller at date, FALSE otherwise"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: [true, false]
      - name: current_plan_id
        description: "ID of the current plan"
        tests:
          - not_null
      - name: current_plan_name
        description: "Name of the current plan"
        tests:
          - not_null
      - name: current_plan_type
        description: "Type of the current plan"
        tests:
          - not_null
      - name: current_segment
        description: "Current segment of the store"
        tests:
          - accepted_values:
              values: ['no-seller', 'struggling-seller', 'tiny-seller', 'small-seller', 'medium-seller', 'large-seller', 'top-seller', 'not-informed', 'not_informed']
      - name: is_seller
        description: "Whether the store is a seller or not, 'no-seller' if the store current segment is 'no-seller' or 'struggling-seller', 'seller' if the store current segment is 'tiny-seller' or higher, 'not informed' otherwise"
        tests:
          - accepted_values:
              values: ['seller', 'no-seller', 'not-informed']
      - name: max_segment
        description: "Maximum historical segment of the store"
        tests:
          - accepted_values:
              values: ['no-seller', 'struggling-seller', 'tiny-seller', 'small-seller', 'medium-seller', 'large-seller', 'top-seller', 'not-informed', 'not_informed']
      - name: is_store_blocked
        description: "Whether the store is blocked or not"
        tests:
          - not_null
      - name: blocked_reason
        description: "Reason for blocking the store"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "is_store_blocked = true"
      - name: blocked_at
        description: "Date when the store was blocked"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              row_condition: "is_store_blocked = true"
      - name: state
        description: "Billing state of the store"
        tests:
          - dbt_expectations.expect_column_values_to_not_be_in_set:
              value_set: [4]
      - name: disabled
        description: "Timestamp when the store was disabled"
      - name: custom_theme
        description: "Timestamp when the custom theme was used for the first time"
      - name: new_payment
        description: "Whether the store is a new payment or not, 1 if the store first payment date is not null, 0 otherwise"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: s__attributes__acquisition_profile__ref
    description: "Data Product silver that contains the acquisition profile attributes of each store, including marketing attribution, quality leads, partner information."
    config:
      meta:
        owner: "yan.santos@nuvemshop.com.br"
        domain: "merchant"
        business_owner: "Giselle Galli"
    columns:
      - name: store_id
        description: "Store identifier."
        tests: [not_null, unique]
      - name: partner_id
        description: "Partner identifier associated with the store."
      - name: tag_acquired_by
        description: "Tag indicating how the store was acquired."
        tests: [not_null]
      - name: is_quality_lead
        description: "Flag indicating whether the store is a quality lead."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: mkt_source_last_click
        description: "Marketing source from the last click attribution. 'not attributed yet' if no attribution found, because the store was created at current date."
        tests: [not_null]
      - name: mkt_subteam_last_click
        description: "Marketing subteam from the last click attribution. 'not attributed yet' if no attribution found, because the store was created at current date."
        tests: [not_null]
      - name: mkt_campaign_last_click
        description: "Marketing campaign from the last click attribution."
      - name: mkt_source_first_click
        description: "Marketing source from the first click attribution. 'not attributed yet' if no attribution found, because the store was created at current date."
        tests: [not_null]
      - name: mkt_subteam_first_click
        description: "Marketing subteam from the first click attribution. 'not attributed yet' if no attribution found, because the store was created at current date."
        tests: [not_null]
      - name: mkt_campaign_first_click
        description: "Marketing campaign from the first click attribution."
      - name: mkt_source_partner_click
        description: "Marketing source from the partner click attribution. Tag indicating the affiliate owner of the store."
      - name: mkt_subteam_partner_click
        description: "Marketing subteam from the partner click attribution. Tag indicating the affiliate classification of the store."
      - name: mkt_campaign_partner_click
        description: "Marketing campaign from the partner click attribution."
      - name: mkt_landing_page_domain_first_click
        description: "Landing page domain from the first click attribution."
      - name: mkt_landing_page_domain_last_click
        description: "Landing page domain from the last click attribution."
      - name: mkt_landing_page_path_first_click
        description: "Landing page path from the first click attribution."
      - name: mkt_landing_page_path_last_click
        description: "Landing page path from the last click attribution."
      - name: ql_profile
        description: "Quality lead profile classification."
        tests: [not_null]
      - name: blocked_fraud_tag
        description: "Tag indicating if the store is blocked or is attributed to a fraudulent partner."
        tests: [not_null]
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
        tests: [not_null]
      - name: sys_audit_created_by
        description: "System or user that created the row."
        tests: [not_null]
      - name: sys_audit_updated_on
        description: "Timestamp when the row was last updated in this table."
        tests: [not_null]
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."
        tests: [not_null]