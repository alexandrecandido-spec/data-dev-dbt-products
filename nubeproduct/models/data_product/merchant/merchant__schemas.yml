  - name: s__lifecycle__first_payment_merchants__event
    description: "Data Product silver that contains the first payment merchants, including the first payment date, plan, country, created at and date. This data is used to identify the first payment merchants to the merchant base."
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "merchant"
        business_owner: "Giselle Galli"
    columns:
      - name: store_id
        description: "Unique identifier for each store"
        tests: [not_null, unique]
      - name: store_country
        description: "Country of the store"
        tests: [not_null]
      - name: store_created_at
        description: "Date when the store was created"
        tests: [not_null]
      - name: store_first_payment
        description: "Date when the store made the first payment"
        tests: [not_null]
      - name: store_plan_id
        description: "Plan ID of the store"
        tests: 
          - not_null:
                severity: warn
      - name: deleted_contract
        description: "Indicates if the contract is deleted."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: [true, false]
      - name: year_month_day_code
        description: Full date in yyyy-MM-dd format (partition key).
        tests: [not_null]
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
      - name: sys_audit_created_by
        description: "System or user that created the row."
      - name: sys_audit_updated_on
        description: "Timestamp when the row was last updated in this table."
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."