version: 2

models:
  - name: _int_merchant_contacts
    description: "Información de contacto por tienda incluyendo email, teléfono, WhatsApp y teléfono del dueño"
    columns:
      - name: store_id
        description: "Identificador único de la tienda"
        tests:
          - not_null
          - unique

      - name: main_user_id
        description: "ID del usuario principal asociado a la tienda"

      - name: email
        description: "Correo electrónico principal del usuario de la tienda"
        # tests:
        #   - not_null

      - name: phone
        description: "Teléfono fijo registrado en la tienda"

      - name: whatsapp
        description: "Número de WhatsApp configurado por la tienda"

      - name: owner_phone
        description: "Teléfono del dueño de la tienda registrado en la plataforma"
