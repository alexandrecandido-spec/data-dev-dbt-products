version: 2


sources:
  - name: int_moltres
    database: hive_metastore
    schema: moltres
    description: "Intermediate tables built from raw data in the moltres schema, typically used to normalize or enrich store-level information."
    tables:
      - name: mwp_apps
        description: "Contains information about apps installed by merchants."
      - name: mwp_store_settings
        description: "Stores configuration settings such as language, currency, and other information."
      - name: mwp_tags
        description: "List of tags assigned to stores."
      - name: mwp_plans_countries
        description: "Maps available plans to the countries where Tiendanube / Nuvemshop offers its platform."
      - name: mwp_plans
        description: "Contains information about the plans available to merchants."
      - name: mwp_shipping_carriers
        description: "Provides details about the shipping carriers integrated or used by stores."
      - name: mwp_attribution
        description: "Contains information on internal and external clicks used for store attribution."
      - name: mwp_countries
        description: "Contains information about the countries' names and codes"
      - name: mwp_provinces
        description: "Table with states IDs and names."
      - name: regions
        description: "Table with regions IDs and names."
      - name: mwp_cities_ar
        description: "Table with city IDs and names from Argentina."
      - name: mwp_cities_mx
        description: "Table with city IDs and names from Mexico."
      - name: cidades
        description: "Table with city IDs and names from Brazil."
      - name: mwp_zipcodes_ar
        description: "Table with zipcodes from Argentina."
      - name: mwp_zipcodes_mx
        description: "Table with zipcodes from Mexico."
      - name: ceps
        description: "Table with zipcodes from Brazil."
      - name: mwp_options
        description: "Information on themes for each store"
      - name: mwp_contracts
        description: "Table with contracts information"
      - name: mwp_shipping_carriers_options
        description: "Table with carriers shipping options information"
      - name: mwp_store_settings_i18n
        description: "i18n overrides for store settings (labels/strings por idioma)."
      - name: wp_users
        description: "WordPress users por store (emails/ids)."
      - name: mwp_store_info
        description: "Información general de la tienda (emails alternativos, etc.)."
      - name: instagram_store_info
        description: "Snapshots de estadísticas de Instagram por store_id."
      - name: mwp_invoice_info
        description: "Información de facturación/razón social asociada a la tienda."
      - name: mwp_payment_stores
        description: "Información de pagos de subscription por payment y store."
      - name: mwp_payments
        description: "Información de pagos."
      - name: mwp_payment_transaction_fees
        description: "Información de payment transaction fees."
      - name: mwp_invoices
        description: "Información de invoices."
      - name: mwp_payment_tax
        description: "Información de impuestos de pagos."
      - name: mwp_invoices_credit_notes
        description: "Información de notas de crédito de facturas."
      - name: mwp_store_cancellations
        description: "Información de cancelaciones de tiendas (encuestas de churns o cancelaciones de tiendas). Incluye el motivo de la cancelación y el comentario de la cancelación."
      - name: mwp_facebook_bussiness_extension
        description: "Facebook Business Extension (CAPI) configuration by store"

  - name: int_finance
    database: hive_metastore
    schema: finance
    description: "Intermediate financial data used to derive metrics related to merchant activity and billing."
    tables:
      - name: active_merchants
        description: "List of currently active merchants, based on plan subscriptions and payment activity."
      - name: churns_merchants
        description: "List of churns merchants."

  - name: int_third_party
    database: hive_metastore
    description: "Raw tables loaded from the ingestion of external data sources"
    schema: third_party
    tables:
      - name: finance_exchange_rate_ars_to_usd
      - name: marketing_github_mkt_attribution
        description: "List of marketing github issues/inputs created by the marketing team"
      - name: marketing_google_search_console_keyword_searches
        description: "Raw Google Search Console keyword performance data including impressions, clicks, positions by country and device"
      - name: midmarket_hubspot_deals
      - name: midmarket_hubspot_calls
      - name: midmarket_hubspot_meetings
      - name: midmarket_hubspot_email
      - name: midmarket_hubspot_communications
      - name: midmarket_hubspot_tasks

  - name: int_midmarket
    database: hive_metastore
    description: "Mid Market tables"
    schema: data_midmarket
    tables:
      - name: midmarket_success_stores
        description: "List of current active stores in the Mid Market portfolio"
      - name: midmarket_weekly_business_review
      - name: midmarket_monthly_business_review

  - name: int_product
    database: hive_metastore
    description: "Product Data Products"
    schema: data_product
    tables:
      - name: product_issues_and_problems_summary
        description: "Main table listing every Issue and Problem and their associated stores"

  - name: int_nuvem_credito
    description: "Source containing tables related to Nuvem credito"
    database: hive_metastore
    schema: nuvem_credito
    tables:
      - name: contracts
        description: "Credit proposals generated by merchants"
      - name: payers
        description: "Information related to the payer of the contract"
      - name: quotations
        description: "Information related the quotations generated by merchants"
      - name: offers
        description: "Information related to the offers available in merchants admin"
      - name: installments
        description: "Contains all installments associated to a contract"

  - name: int_credito
    description: "Source containing tables generated by the credit data team"
    database: hive_metastore
    schema: credito_dev
    tables:
      - name: historical_credits_offers
        description: "Credit proposals link with engine offer id"
      - name: renegotiated_contracts
        description: "Renegotiated contracts with offer id"
      - name: renegotiation_offers
        description: "Renegotiation offers"

  - name: int_github_data
    description: "Information about Issues and Problems in Github"
    database: hive_metastore
    schema: github_data
    tables:
      - name: issue
        description: "Issue/Problem list"
      - name: issue_milestone
        description: "If an Issue/Problem is considered a part of a roadmap, it should have a milestone asociated, such as a date"
      - name: issue_label
        description: "Labels are properties associated to an Issue/Problem to identify the domain, affected countries, state."
      - name: issue_comment
        description: "Comments are the +1 of the Issue/Problem. They should always be associated to a store."
      - name: issue_store
        description: "Stores that reported an issue/problem"
      - name: store_impact
        description: "Lists the priority or impact of the comment associated to a store. It only applies in Mid Market stores."
  
  - name: int_attribution
    database: hive_metastore
    schema: attribution
    tables:
      - name: store_attributions_external
        description: "Contains information on external clicks used for markerting attribution."
  
  - name: int_data_predictors
    database: hive_metastore
    schema: data_predictors
    description: "Intermediate tables built from raw data in the data_predictors schema, typically used to normalize or enrich store-level information."
    tables:
      - name: marketing_new_payment_predictor
        description: "Predicts the likelihood of a new payment based on the store's payment history and other relevant factors."
      - name: marketing_model_version_aux
        description: "Contains information about the version of the model used to make predictions."
      - name: marketing_cutoffs_table
        description: "Contains information about the cutoffs used to define QLs."
      - name: marketing_new_payment_predictor_profiles
        description: "Table with ql info by store"


  - name: int_ecosystem
    database: hive_metastore
    schema: ecosystem
    description: "Intermediate tables built from raw data in the ecosystem schema, typically used to normalize or enrich store-level information."
    tables:
      - name: mwp_partners
        description: "Contains information about the partners of the ecosystem."
      - name: tags
        description: "Contains information about the entities tags in ecosystem."
      - name: partners_tags_campaign
        description: "Contains information about the tags and campaigns of the partners."
      - name: partner_ledger 
        description: "Contains information about the ledger (commissions deposits and withdrawals) of the partners."
      - name: partner_ledger_entry_type
        description: "Contains information about the type of entry in the partner ledger."

  - name: int_orders
    database: hive_metastore
    schema: orders
    description: "Intermediate tables built from the multiple edit tables"
    tables:
      - name: orders_edit_history_discounts 
        description: "Contains information about all edits on discounts"
      - name: orders_edit_history_products
        description: "Contains information about all edits on products"
      - name: orders_value_history
        description: "Contains all changes on total and subtotal for an order after each edit"
      - name: mwp_orders_logging
        description: "event table with changes for all orders"
      - name: orders_edit_history_shipping
        description: "Contains information about all requotes after an edit"
      - name: orders_edit_history
        description: "Contains information about all editions and their timestamps"
      - name: mwp_orders_fulfillments
        description: "Table with order fullfilment data"
      - name: order_saved_search
        description: "Table with orders saved searches"
      - name: orders_auto_cancel_configuration
        description: "Table with merchant's auto cancel configurations"

  - name: int_storefronts_curated
    database: hive_metastore
    schema: storefronts_curated
    tables:
      - name: mwp_stores_logging
      - name: events
        description: "Events associated to Consumer journey on storefronts"

  - name: int_data_legacy
    database: raw
    schema: data_legacy
    tables:
      - name: stitchdata__wbr_success
        description: "WBR (Success) snapshot from legacy Postgres."
      - name: stitchdata__mbr_success
        description: "MBR (Success) snapshot from legacy Postgres."
      - name: stitchdata__success_deals_warning
        description: "Success deals warning snapshot from legacy Postgres."

  - name: int_hubspot
    database: raw
    schema: hubspot
    tables:
      - name: companies
        description: "Hubspot companies information."
      - name: deals_archived

  - name: int_nuvem_envio_conciliation
    database: hive_metastore
    schema: nuvem_envio_conciliation
    tables:
      - name: accounting_entry
        description: "Accounting data about shipping"
      - name: pre_invoice
        description: "Table with Order's invoices informations"

  - name: int_logistics_tracking
    database: hive_metastore
    schema: logistics_tracking
    tables:
      - name: tracking_history
        description: "Shipments tracking history"

  - name: int_shipping
    database: hive_metastore
    schema: shipping
    description: "Staging tables built from raw data in the shipping schema, typically used to normalize or enrich store-level information."
    tables:
      - name: locations
        description: "Contains information about the store's distribution centers"

  - name: int_offline
    database: hive_metastore
    description: "Source containing tables related to Offline (point of sale)"
    schema: offline
    tables:
      - name: plans
        description: "Offline plans available for stores"

  - name: int_catalog
    database: hive_metastore
    schema: catalog
    description: "Intermediate tables built from raw data in the catalog schema"
    tables:
      - name: mwp_stock_transfer
        description: "Table with each stock transfer process created by merchants. Including information regarding the distribution center, the type of transfer, status etc."
      - name: mwp_stock_transfer_detail
        description: "Table with details regarding each stock transfer. Contains each product id and variant id that is required to be transferred and the quantities finally transferred"

  - name: int_zendesk_support_prod
    database: raw
    schema: zendesk_support_prod
    description: "Intermediate tables built from raw data in the zendesk_support_prod schema, typically used to normalize or enrich support(CX) team information."
    tables:
      - name: groups
        description: "Contains information about support agent groups used for ticket assignment, workflow organization, and permissions management."
      - name: macros
        description: "Stores predefined actions or responses (macros) that agents can apply to tickets to automate repetitive tasks and standardize support processes."
      - name: organizations
        description: "Holds data about customer organizations, grouping end users and companies to facilitate ticket routing, reporting, and SLA management."
      - name: ticket_activities
        description: "Tracks various high-level activities or events related to tickets, such as creation, updates, merges, or satisfaction surveys."
      - name: ticket_audits
        description: "Records a detailed log of all changes and events applied to a ticket, including field updates, status transitions, and automation triggers."
      - name: ticket_comments
        description: "Contains all public and internal comments or replies associated with tickets, including metadata about authors, visibility, and timestamps."
      - name: tickets
        description: "Represents the core Zendesk support tickets — customer requests or incidents — including status, priority, requester, assignee, and organization data."
      - name: users
        description: "Stores all user profiles in the Zendesk account, including end users, agents, and administrators, along with their roles and contact information."
      - name: legacy_macros_usage
        description: "Historical snapshot of Zendesk macros usage data, capturing how predefined actions were applied to tickets over time for auditing and trend analysis."
      - name: legacy_ticket_history
        description: "Historical snapshot of Zendesk ticket events and status changes, storing ticket lifecycle data extracted from ticket audit logs for analytical purposes."
      - name: legacy_chats
        description: "Historical snapshot of Zendesk chats, storing data extracted from ticket audit logs for analytical purposes."
      - name: legacy_comments
        description: "Historical snapshot of Zendesk ticket comments, preserving all public and internal messages exchanged within tickets. This table consolidates comment-level data extracted from Zendesk audit logs or API exports, including authorship, visibility, and timestamps. It serves analytical and auditing purposes, enabling the reconstruction of historical conversations and customer-agent interactions over time."
      - name: legacy_users
        description: "Historical snapshot of Zendesk users, storing data extracted from users for analytical purposes."

  - name: int_billing
    database: hive_metastore
    schema: billing
    description: "Intermediate tables built from raw data in the billing schema."
    tables:
      - name: invoice_information
        description: "Información de facturación/razón social asociada a la tienda."

  - name: int_stg_orders
    database: hive_metastore
    schema: orders
    description: "Staging tables from orders schema used in intermediate models"
    tables:
      - name: mwp_orders
        description: "Main table, contains information about orders, including customer details, products, status, and creation and completion dates"

  - name: int_stg_unity_data_manual
    database: data_products_prd
    schema: data_manual
    description: "Staging tables from data_manual schema used in intermediate models"
    tables:
      - name: ext__partnerships__platform_development__app_managers
        description: "Contains the information of the app and tech partner managers"

  - name: int_stg_nuvem_credito
    database: hive_metastore
    schema: nuvem_credito
    description: "Staging tables from nuvem_credito schema used in intermediate models"
    tables:
      - name: installments
        description: "Contains all installments associated to a contract"

  - name: int_social
    database: hive_metastore
    schema: social
    description: "Staging tables from social schema used in intermediate models"
    tables:
      - name: tiktok_user
        description: "TikTok user integrations by store"
      - name: google_ads_account
        description: "Google Ads account installations by store"
      - name: google_merchant_center_account
        description: "Google Merchant Center account installations by store"
      - name: google_user
        description: "Google user integrations by store"

  - name: int_newadmin
    database: hive_metastore
    schema: newadmin
    description: "Intermediate tables from newadmin schema used in intermediate models"
    tables:
      - name: authentication_factors
        description: "Contains authentication factors (2FA) configuration for users"

  - name: data_manual
    database: data_products_prd
    schema: data_manual
    tables:
      - name: ext__marketing__acquisition__mkt_monthly_kpis_plan
        description: Monthly plan of acquisition KPIs by country and mkt_source.
      - name: ext__marketing__acquisition__key_dates_by_country
        description: Country-level key dates (holidays + commercial days) for seasonality/weighting.
      - name: ext__marketing__brand_comms__searches_keyword_planner
        description: "Manual Google Keyword Planner data uploads containing search volume by keyword, country and date"
      - name: ext__marketing__brand_comms__marketing_brand_nobrand_daily_goals
        description: "Daily marketing goals and targets for branded/non-branded performance tracking across Search Console and KWP"
      - name: ext__marketing__acquisition__content_classification_br_blog
        description: "Manual classification of Blog content for Brazil (Growth Acquisition), including funnel stage and persona."
      - name: ext__marketing__acquisition__content_classification_br_cases
        description: "Manual classification of Success Cases pages for Brazil."
      - name: ext__marketing__acquisition__content_classification_br_downloadables
        description: "Manual classification of Rich Materials (Ebooks, spreadsheets) for Brazil."
      - name: ext__marketing__acquisition__content_classification_br_tools
        description: "Manual classification of Tools and Calculators for Brazil."
      - name: ext__marketing__acquisition__content_classification_latam_blog
        description: "Manual classification of Blog content for Latam (Spanish), including funnel stage and persona."
      - name: ext__marketing__acquisition__content_classification_latam_cases
        description: "Manual classification of Success Cases pages for Latam."
      - name: ext__marketing__acquisition__content_classification_latam_downloadables
        description: "Manual classification of Rich Materials (Recursos) for Latam."
      - name: ext__marketing__acquisition__content_classification_latam_tools
        description: "Manual classification of Tools and Calculators for Latam."
