version: 1

models:
  - name: stg_credit_proposals
    description: "Staging model credit proposals, cleaning data."
    columns:
      - name: id
        description: "Unique internal identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: hub_contract_id
        description: "Unique external identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null