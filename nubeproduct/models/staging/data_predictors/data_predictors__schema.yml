version: 2
models:
  - name: marketing__data_predictors__quality_leads__ref
    description: "Staging model that contains information about quality leads, such as store_id, created_at, model_id, predicted_prob and year_month_day_code."
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: store_id
        description: "Unique identifier of the store."
        tests:
          - not_null
          - unique
      - name: created_at
        description: "Timestamp when the quality lead was created."
        tests:
          - not_null
      - name: model_id
        description: "Unique identifier of the model used to predict the quality lead."
      - name: predicted_prob
        description: "Estimated probability that the store will convert to a paying customer."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format used for partitioning or filtering."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: data_predictors__quality_leads
    description: "Staging model that contains information about quality leads, such as store_id, created_at, model_id, predicted_prob and year_month_day_code."
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: store_id
        description: "Unique identifier of the store."
        tests:
          - not_null
          - unique
      - name: created_at
        description: "Timestamp when the quality lead was created."
        tests:
          - not_null
      - name: model_id
        description: "Unique identifier of the model used to predict the quality lead."
      - name: predicted_prob
        description: "Estimated probability that the store will convert to a paying customer."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format used for partitioning or filtering."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: data_predictors__churn_predictions
    description: "Staging model that contains information about churn predictions (Stores the outputs of the Potential Churn model):
    - The model runs on the 1st day of each month for all active stores with a paid subscription.
    - If a store keeps its subscription for more than one month, its `store_id` will appear multiple times in the table (one row per prediction month and model run date).
    - Normally, the model runs once a month; however, reprocessing may occur after the 5th day.
    - In such cases, the most recent run for each month should always be considered as the valid one.
    - See internal documentation (https://docs.google.com/document/d/1VOUsUj_KOQp7krS9WcusGtmO1X8Yq-VJEvIaxCB8ozo/edit?tab=t.7yr9b3opplss)"
    config:
      meta:
        owner: "ianca.leite@nuvemshop.com.br"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: store_id
        description: "Unique identifier of the store."
        tests:
          - not_null
      - name: country
        description: "Country of the store."
        tests:
          - not_null
      - name: month_end
        description: "Date (last day of the month) representing the observation/reference period of the store."
        tests:
          - not_null
      - name: timestamp
        description: "Date of the execution of the churn prediction model."
        tests:
          - not_null
      - name: life_stage
        description: "Store lifecycle stage at the time of prediction:
                    - A1 = Up to 30 days old
                    - A2 = Between 1 and 6 months old
                    - B  = More than 6 months old
                    - C = More than 12 months old"
        tests:
          - not_null
          - accepted_values:
              values: ['A1', 'A2', 'B', 'C']
      - name: month_segment
        description: "Segment the store belonged to at the time of prediction."
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['no-seller', 'struggling-seller', 'tiny-seller', 'small-seller', 'medium-seller', 'large-seller', 'top-seller', null]
      - name: max_segment
        description: "Highest segment ever reached by the store historically."
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['no-seller', 'struggling-seller', 'tiny-seller', 'small-seller', 'medium-seller', 'large-seller', 'top-seller', null]
      - name: seller_type
        description: "Store classification according to segment:
            - no-seller: segmento_max ∈ {null, struggling, no-seller}
            - seller: segmento_max ≥ tiny"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['no-seller', 'seller']
      - name: profile
        description: "Segmentation label based on life_stage and additional model features (e.g., orders, products, admin access, and sessions at different thresholds). 
                      For more details, see the documentation (https://docs.google.com/document/d/1VOUsUj_KOQp7krS9WcusGtmO1X8Yq-VJEvIaxCB8ozo/)."
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['1. Adormecido','1. Desinteressado','1. Inexperiente','2. Básico','2. Esporádico','2. Perseverante','2. Persistente','3. Baixa conversão','3. Configurado','3. Newbie','3. Regular','4. Potencial','4. Promissor','4. Regular','5. Extraordinário','5. Profissional','6. NA']
      - name: probability
        description: "Estimated probability (0–100%) that the store will become a seller. The higher the value, the greater the chance."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.00000000001
              max_value: 1
              strictly: false
      - name: threshold
        description: "Threshold used to classify probabilities as high or low."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
              strictly: true 
      - name: prediction
        description: "Binary prediction outcome:
            - 1 = store predicted as potential seller (probability ≥ cutoff)
            - 0 = store not predicted as potential seller (probability < cutoff)"
        tests:
          - accepted_values:
              values: [0, 1]
      - name: model_id
        description: "Unique identifier for the model name and version. Also indicates the location of the model registered in the Databricks Catalog. Format: catalog.schema.model_name/version_number"
        tests:
          - not_null
      - name: year_month_code
        description: "Date code in YYYYMM format used for identification row."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."