version: 2
models:
  - name: stg_active_merchants
    description: "Staging model that contains the list of every active merchant monthly."
    config:
      meta:
        tech_steward: "renan.ferrari@nuvemshop.com.br"
        domain: "finance"
        business_owner: "Operations"
    columns:
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null
      - name: store_country
        description: "Country of the store."
        tests:
          - not_null
      - name: store_id_plan_country
        description: "Plan ID in store country."
      - name: date
        description: "Date of the first day of the evaluated month."
        tests:
          - not_null
      - name: year
        description: "Year extracted from the original date of the merchant snapshot."
      - name: month
        description: "Month extracted from the original date of the merchant snapshot."
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."
        tests:
          - not_null


  - name: moltres__contracts
    description: "Staging model containing contracts created through plan subscription events."
    config:
      meta:
        tech_steward: "renan.ferrari@nuvemshop.com.br"
        domain: "finance"
        business_owner: "Operations"
    columns:
      - name: id
        description: "Unique contract identifier."
        tests:
          - not_null
          - unique
      - name: store_id
        description: "Store identifier linked to the contract."
        tests:
          - not_null
      - name: plan_id
        description: "Plan identifier associated with the contract."
      - name: created_at
        description: "Timestamp when the contract entry was created."
      - name: start_date
        description: "Date when the contract started."
      - name: end_date
        description: "Date when the contract ended."
      - name: type
        description: "Type of contract event (e.g., freemium, change-plan)."
      - name: total
        description: "Total value of the contract."
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp when the row was last updated in this table."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."
        tests:
          - not_null


  - name: moltres__mwp_store_info
    description: "Staging model that contains data about each store, such as store ID, country, creation and churn dates and other attributes."
    config:
      meta:
        owner: "rodrigo.torres@tiendanube.com"
        domain: "finance"
        business_owner: "Analytics Engineering"
    columns:
      - name: store_id
        description: "Store identifier."
        tests:
          - unique
          - not_null
      - name: country
        description: "Country of the store."
      - name: current_segment
        description: "Current segment of the store."
      - name: churned_at
        description: "Date when the store was churned."
      - name: first_payment
        description: "Date when the store made its first payment."
      - name: state
        description: "Billing state of the store"
        tests:
          - not_null
      - name: created_at
        description: "Date when the store was created."
        tests:
          - not_null
      - name: currency
        description: "Currency of the store."
      - name: plan
        description: "Current plan of the store."
      - name: verified
        description: "Code indicating the device used during store creation."
      - name: register_url
        description: "URL of the store's registration page."
      - name: partner_id
        description: "ID of the store's partner, if a partner was involved in the store's creation."
      - name: partner_code
        description: "Code of the store's partner, if a partner was involved in the store's creation."
      - name: partnership_type
        description: "Type of partnership, if a partner was involved in the store's creation."
      - name: domain
        description: "Custom store domain name created by the client."
      - name: main_user_id
        description: "Main user ID of the store."
      - name: is_store_blocked
        description: >
          Boolean flag indicating whether the store has received either of the tags
          'sre-block-store-404' or 'sre-block-store-429'.
        tests:
          - not_null
        accepted_values:
          values: [TRUE, FALSE]
      - name: custom_theme
        description: "Identifies the date on which the store began using a custom theme (open FTP). If the field is blank, the store is using a default theme (closed FTP)."
      - name: disabled
        description: "Boolean flag indicating if the store is disabled/cancelled."
      - name: paid_until
        description: "Date when the store's paid subscription expires. Null if the store doesn't have a paid subscription."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."

  - name: nuvem_credito__credit_proposals
    config:
      meta:
        owner: "sofia.sanchez@tiendanube.com"
        domain: "fintech"
        business_owner: "Lending"
    description: "Staging model with credit proposals, clean data with current store_id"
    columns:
      - name: id
        description: "Unique internal identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: hub_contract_id
        description: "Unique external identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null
      - name: disbursed_at
        description: "Date when the credit amount was disbursed."
      - name: finished_at
        description: "Date when the credit was finalized (It could be by being renegotiated or fully paid)."
      - name: original_contract_ids
        description: "Not null only if the credit is a renegotiation. It contains all contracts ids that were renegotiated."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."

  - name: nuvem_credito__initial_installments
    config:
      meta:
        owner: "sofia.sanchez@tiendanube.com"
        domain: "fintech"
        business_owner: "Lending"
    description: "Staging model with initial installments of each contract"
    columns:
      - name: hub_contract_id
        description: "Unique external identifier for each contract."
      - name: initial_due_month
        description: "Due date month of the installment according to the initial structure of the contract."
      - name: initial_due_at
        description: "Due date of the installment according to the initial structure of the contract."
      - name: initial_expected_amount
        description: "Expected amount to be received according to the initial structure of the contract."
      - name: initial_principal_expected_amount
        description: "Expected amount of principal component to be received according to the initial structure of the contract."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."

  - name: nuvem_credito__last_credit_offer
    config:
      meta:
        owner: "calvin.hetem@nuvemshop.com.br"
        domain: "fintech"
        business_owner: "Lending"
    description: "Staging model with last credit available limit registered"
    columns:
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null
      - name: available_limit
        description: "Amount available for hiring."
      - name: closed_at
        description: "Date when the credit offer was closed."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."

  - name: credito_dev__mova_installment_present_value
    config:
      meta:
        owner: "calvin.hetem@nuvemshop.com.br"
        domain: "fintech"
        business_owner: "Lending"
    description: "Staging model with daily details taken directly from Mova's system regarding installments compostion"
    columns:
      - name: data_ref
        description: "Reference date."
      - name: hub_contract_id
        description: "Contract identifier provided by Mova."
        tests:
          - not_null
      - name: hub_installment_id
        description: "Installment identifier provided by Mova."
        tests:
          - not_null
      - name: original_hub_installment_id
        description: "Original installment identifier provided by Mova. Aplicable only in some cases where the original installment was partialy paid or renegotiated"
      - name: deep_hub_installment_id
        description: "First original installment identifier provided by Mova. Aplicable only in some cases where the original installment was partialy paid or renegotiated multiple times"
      - name: installment_status
        description: "Installment status. Possible values are 'A VENCER', 'ATRASADA', 'INADIMPLENTE', 'PDD', 'EM APURAÇÃO'"
      - name: installment_due_date
        description: "Installment's due date."
      - name: installment_number
        description: "Installment's number. If an installment is partialy paid, the new installment will have an new number."
      - name: installment_base_amount
        description: "Installment's expected amount to be paid at installment's due date."
      - name: installment_principal_amount
        description: "Installment's principal amount to be paid at any point."
      - name: installment_interest_amount
        description: "Installment's expected interest amount to be paid at installment's due date."
      - name: additional_late_fine
        description: "Fine amount to be paid."
      - name: additional_late_contract_interest
        description: "Addicional interest amount to be paid."
      - name: additional_late_penalty_interest
        description: "Penalty interest amount to be paid."
      - name: additional_late_taxes
        description: "Additional taxes amount to be paid."
      - name: discount_pre_payment
        description: "Possible discount amount if installment is paid at data_ref."
      - name: installment_updated_amount
        description: "Total amount to be paid if installment is paid at data_ref."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."

  - name: antifraud_service__vertifier_store_inferences
    description: "Staging model with vertifier of current store_id provided by antifraud inferences."
    config:
      meta:
        owner: "djalma.dias@nuvemshop.com.br"
        domain: "operations"
        business_owner: "Analytics Engineering"
    columns:
      - name: store_id
        description: "Unique identifier of the store. External key."
        tests:
          - not_null
      - name: vertifier
        description: "Identification of a possible vertical for the store."
      - name: created_at
        description: "Timestamp when the vertifier was originally created."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
      - name: sys_audit_created_by
        description: "System or user that created the row."
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the row."
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."


  - name: github_data__issue_labels
    description: "Staging model that concatenates every label associated to the issue in one row, to avoid duplicates. We use this table to categorize the Issue/Problem in different ways."
    config:
      meta:
        owner: "fabrizio.crivella@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns: 
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_number
        description: "Identifies the identification of the Issue/Problem. Combined with repo_name, they make the unique key"
      - name: labels_tipo
        description: "Type of Issue/Problem, based on the nature of the domain. It can be App, Others or Core"
      - name: labels_domain
        description: "Domain related to the Issue/Problem"
      - name: labels
        description: "List of all labels related to the Issue/Problem"
      - name: labels_country
        description: "Used only for Platform Development. Specifies which country is affected by an Issue/Problem"
      - name: labels_wip
        description: "Labels that determine if the Issue/Problem is being solved, and which step is it in"
      - name: labels_quick_fix
        description: "If the issue has a quick fix, will have a label with that name"


  - name: github_data__wip_labels
    description: "Staging model that persists information about Working in Progress labels, becouse we need to know when they started and ended, to determine de duration of the lifecycle of an Issue/Problem"
    config:
      meta:
        owner: "fabrizio.crivella@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns:
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_number
        description: "Identifies the identification of the Issue/Problem. Combined with repo_name, they make the unique key"
      - name: wip_label
        description: "Step of Working in Progress in whitch the Issue/Problem is right now"
      - name: wip_last_updated
        description: "Date when the WIP label was included"
      - name: wip_last_deleted
        description: "Date when the WIP label was removed"
  

  - name: github_data__merchant_impact
    description: "Staging model that gets information about merchants associated to an Issue/Problem. Information such as GMV and impact"
    config:
      meta:
        owner: "fabrizio.crivella@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns:
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_number
        description: "Identifies the identification of the Issue/Problem. Combined with repo_name, they make the unique key"
      - name: issue_state
        description: "Determines if the Issue/Problem is Open or Closed"
      - name: store_id
        description: "Unique identifier to the store related to the Issue/Problem"
      - name: store_impact
        description: "Only for Mid Market stores, determines the criticity of the comment"
      - name: sum_gmv
        description: "Monthly average GMV from the last 4 closed months"
      - name: sum_gmv_usd
        description: "Monthly average GMV from the last 4 closed months in USD"


  - name: ga4__event_info
    description: "Staging model for GA4 events information. Includes user sessions and event metadata."
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: unique_session
        description: "Unique identifier for the user session."
        tests:
          - not_null
      - name: event_name
        description: "Name of the event triggered during the session."
      - name: event_date
        description: "Date when the event occurred."
      - name: event_timestamp    
        description: "Epoch of the GA4 event (BIGINT)."
        tests: [not_null]
      - name: event_device
        description: "Device category (mobile, desktop, etc.) associated with each event."
      - name: event_type
        description: "Classifies the event as 'login' or 'other' based on event_name content."
      - name: year_month_day_code
        description: "YYYYMMDD code for daily partitioning."


  - name: ga4__tp_info
    description: "Staging model for trials and payments information from GA4."
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: unique_session
        description: "Unique identifier for the user session."
        tests:
          - not_null
      - name: trial_timestamp
        description: "Timestamp when the trial started, if available."
      - name: payment_timestamp
        description: "Timestamp when the payment was made, if available."
      - name: trial_date
        description: "Date when the trial started."
      - name: payment_date
        description: "Date when the payment was made."
      - name: event_date
        description: "Unified event date: COALESCE(trial_date, payment_date)."
        tests: [not_null]
      - name: year_month_day_code
        description: "YYYYMMDD  event_date."

  - name: ga4__session_info
    description: "Staging model for user sessions duration and engagement flags."
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: unique_session
        description: "Unique identifier for the user session."
        tests:
          - not_null
      - name: start_session_time
        description: "Timestamp when the session started."
      - name: end_session_time
        description: "Timestamp when the session ended."
      - name: session_duration_minutes
        description: "Duration of the session in minutes."
      - name: engage
        description: "Engagement flag for the session (1 if engaged, 0 otherwise)."
      - name: start_session_date
        description: "Date when the session started."
      - name: year_month_day_code
        description: "YYYYMMDD code for daily partitioning."


  - name: ga4__mod_pv_info
    description: "Staging model for GA4 pageviews enriched with traffic source, landing page, and UTM parameters."
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: event_timestamp
        description: "Timestamp of the pageview event."
        tests:
          - not_null
      - name: event_date
        description: "Parsed event date from GA4."
      - name: year_month_day_code
        description: "YYYYMMDD code for daily partitioning."
      - name: user_pseudo_id
        description: "Anonymized identifier for the user."
      - name: unique_session
        description: "Unique identifier for the user session."
        tests:
          - not_null
      - name: source_ga4_classification
        description: "Traffic source classification."
      - name: original_user_country
        description: "User's original country as reported by GA4."
      - name: env_pagegroup
        description: "Environment or page group indicator."
      - name: landing_page
        description: "Full landing page URL of the session."
      - name: landing_page_domain
        description: "Domain part of the landing_page URL."
      - name: landing_page_path
        description: "Path part of the landing_page URL, excluding query string."
      - name: utm_ad_id
        description: "Value extracted from the URL parameter after 'id_' up to the next '&'."
      - name: utm_content
        description: "Value extracted from the 'utm_content' URL parameter."
      - name: utm_term
        description: "Value extracted from the 'utm_term' URL parameter."
      - name: last_source
        description: "Last known traffic source for the session."
      - name: last_medium
        description: "Last known traffic medium for the session."
      - name: last_campaign
        description: "Last recorded campaign parameter."
  

  - name: data_predictors__quality_leads
    description: "Staging model that contains information about quality leads, such as store_id, created_at, model_id, predicted_prob and year_month_day_code."
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: store_id
        description: "Unique identifier of the store."
        tests:
          - not_null
          - unique
      - name: created_at
        description: "Timestamp when the quality lead was created."
        tests:
          - not_null
      - name: model_id
        description: "Unique identifier of the model used to predict the quality lead."
      - name: predicted_prob
        description: "Estimated probability that the store will convert to a paying customer."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format used for partitioning or filtering."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: moltres__platform_mwp_apps_stores
    description: "Extracted data of apps installed and uninstalled by stores"
    config:
      meta:
        owner: "fernando.martinez@tiendanube.com"
        domain: "product"
        business_owner: "Nicolas Loreti"
    columns:
      - name: app_id
        description: "determines the app_id of the installation"
      - name: store_id
        description: "determines the store_id of the installation"
      - name: installed_app_id
        description: "determines the unique identifier of the installation"
      - name: app_install_date
        description: "determines the date when the app was installed"
      - name: app_uninstall_date
        description: "determines the date when the app was uninstalled"
      - name: sys_admin_created_at
        description: "determines the date when the installation was created"
      - name: sys_audit_updated_at
        description: "determines the date when the installation was updated"


  - name: billing__receipt
    description: "Staging model for billing receipts. Contains only the necessary fields to link to the billing cycle."
    config:
      meta:
        owner: "gustavo.oliveira@nuvemshop.com.br"
        domain: "finance"
        business_owner: "Mônica Orlando"
    columns:
      - name: id
        description: "Receipt identifier"
        tests: [not_null]
      - name: number
        description: "Receipt code"


  - name: billing__charge
    description: "Staging model for billing charges. Contains charge information including amounts, dates, and references."
    config:
      meta:
        owner: "gustavo.braga@nuvemshop.com.br"
        domain: "finance"
        business_owner: "Pablo San Martin"
    columns:
      - name: charge_id
        description: "Unique charge identifier"
        tests:
          - not_null
          - unique
      - name: store_id
        description: "Store identifier linked to the charge"
        tests:
          - not_null
      - name: concept_id
        description: "Concept identifier associated with the charge"
      - name: invoice_id
        description: "Invoice identifier linked to the charge"
      - name: subscription_id
        description: "Subscription identifier linked to the charge"
      - name: amount_value
        description: "Monetary value of the charge"
      - name: from_date
        description: "Start date for the charge period"
      - name: to_date
        description: "End date for the charge period"
      - name: external_reference
        description: "External reference for the charge"
      - name: deleted_at
        description: "Timestamp when the charge was deleted"
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format extracted from from_date"
      - name: updated_at
        description: "Timestamp when the record was last updated in the source"
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model"
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model"
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed"
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run"
        tests:
          - not_null


  - name: billing__concept
    description: "Staging model for billing concepts. Contains concept codes and identifiers."
    config:
      meta:
        owner: "gustavo.braga@nuvemshop.com.br"
        domain: "finance"
        business_owner: "Pablo San Martin"
    columns:
      - name: concept_id
        description: "Unique concept identifier"
        tests:
          - not_null
          - unique
      - name: concept_code
        description: "Code identifier for the billing concept"
      - name: type
        description: "Type of billing concept"
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format extracted from creation date"
      - name: updated_at
        description: "Timestamp when the record was last updated in the source"
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model"
        tests:
