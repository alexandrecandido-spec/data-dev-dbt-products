version: 2
models:
  - name: moltres__mwp_store_info
    description: "Staging model that contains data about each store, such as store ID, country, creation and churn dates and other attributes."
    config:
      meta:
        tech_steward: "rodrigo.torres@tiendanube.com"
        domain: "finance"
        business_owner: "Analytics Engineering"
    columns:
      - name: store_id
        description: "Store identifier."
        tests:
          - unique
          - not_null
      - name: country
        description: "Country of the store."
      - name: current_segment
        description: "Current segment of the store."
      - name: churned_at
        description: "Date when the store was churned."
      - name: first_payment
        description: "Date when the store made its first payment."
      - name: state
        description: "Billing state of the store"
        tests:
          - not_null
      - name: created_at
        description: "Date when the store was created."
        tests:
          - not_null
      - name: currency
        description: "Currency of the store."
      - name: plan
        description: "Current plan of the store."
      - name: verified
        description: "Code indicating the device used during store creation."
      - name: register_url
        description: "URL of the store's registration page."
      - name: partner_id
        description: "ID of the store's partner, if a partner was involved in the store's creation."
      - name: partner_code
        description: "Code of the store's partner, if a partner was involved in the store's creation."
      - name: partnership_type
        description: "Type of partnership, if a partner was involved in the store's creation."
      - name: domain
        description: "Custom store domain name created by the client."


  - name: orders__mwp_orders
    description: "All the orders in their different statuses"
    config:
      meta:
        tech_steward: "rodrigo.torres@tiendanube.com"
        domain: "finance"
        business_owner: "Nico Loreti"
    columns:
      - name: id
        description: "Unique identifier for the order."
        tests:
          - unique:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: id
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: store_id
        description: "Identifier of the store associated with the order."
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: started_checkout_at
        description: "Timestamp when the user started the checkout process."
      - name: completed_contact_at
        description: "Timestamp when the customer provided contact information during checkout."
      - name: completed_at
        description: "Timestamp when the order was successfully completed."
      - name: cancelled_at
        description: "Timestamp when the order was cancelled, if applicable."
      - name: created_at
        description: "Timestamp when the order was created."
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: contact_email
        description: "Email address of the customer who placed the order."
      - name: currency
        description: "Currency used for the transaction."
      - name: status
        description: "Current status of the order (e.g., open, completed, cancelled)."
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: total_in_usd
        description: "Total value of the order converted to USD."
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: total
        description: "Total value of the order in the original currency."
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: storefront
        description: "Sales channel through which the order was placed (e.g., store, mobile)."
      - name: device_type
        description: "Type of device used to place the order (e.g., computer, phone, tablet)."
      - name: payment_status
        description: "Payment status of the order (e.g., paid, pending, failed)."
      - name: gateway
        description: "Name of the payment gateway used to process the transaction."
      - name: shipping_method
        description: "Shipping method selected for the order."
      - name: shipping_cost
        description: "Cost of shipping for the order."
      - name: shipping_option
        description: "Shipping option chosen by the customer."
      - name: shipping_pickup_type
        description: "Type of shipping pickup (e.g., delivery, in-store pickup)."
      - name: shipping_province
        description: "Province or region where the order was shipped."
      - name: gateway_integration_type
        description: "Integration type used with the payment gateway (e.g., direct, aggregator)."
      - name: gateway_installments
        description: "Number of payment installments selected by the customer, if applicable."
      - name: gateway_method
        description: "Specific method used in the gateway (e.g., credit_card, boleto)."
      - name: order_date_store_id
        description: "Composite key representing the order date and store identifier, used for partitioning or indexing."
      - name: app_id
        description: "Identifier of the app or plugin involved in the order, if applicable."
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format used for partitioning or filtering."
      - name: is_paid_order
        description: "Indicates whether the order was successfully completed and paid (not cancelled, status is 'paid', and completed_at is not null)."
      - name: device
        description: "Normalized device type used to place the order. Returns 'computer', 'phone', or 'other'."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: orders__mwp_order_products
    description: "Products associated with the order"
    config:
      meta:
        tech_steward: "rodrigo.torres@tiendanube.com"
        domain: "finance"
        business_owner: "Giselle Galli"
    columns:
      - name: id
        description: "Identifier of the order associated with the product."
        tests:
          - unique
      - name: id
        tests:
          - not_null
      - name: order_id
        description: "Identifier of the order associated with the product."
        tests:
          - not_null
      - name: product_id
        description: "Identifier of the product included in the order."
        tests:
          - not_null
      - name: quantity
        description: "Number of units of the product included in the order."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 998
              row_condition: "quantity IS NOT NULL AND sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: created_at
        description: "Timestamp when the order-product record was created."
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp of the most recent update to the order-product record."
      - name: deleted_at
        description: "Timestamp when the order-product record was soft-deleted, if applicable."
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format used for partitioning or filtering."
      - name: change_timestamp
        description: "The most recent change timestamp among created_at, updated_at, and deleted_at."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: nuvem_credito__credit_proposals
    config:
      meta:
        tech_steward: "sofia.sanchez@tiendanube.com"
        domain: "fintech"
        owner: "Calvin Hetem"
    description: "Staging model with credit proposals, clean data with current store_id"
    config:
      meta:
        tech_steward: "sofia.sanchez@tiendanube.com"
        domain: "fintech"
        business_owner: "Calvin Hetem"
    columns:
      - name: id
        description: "Unique internal identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: hub_contract_id
        description: "Unique external identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null
      - name: disbursed_at
        description: "Date when the credit amount was disbursed."
      - name: finished_at
        description: "Date when the credit was finalized (It could be by being renegotiated or fully paid)."
      - name: original_contract_ids
        description: "Not null only if the credit is a renegotiation. It contains all contracts ids that were renegotiated."


  - name: antifraud_service__vertifier_store_inferences
    description: "Staging model with vertifier of current store_id provided by antifraud inferences."
    config:
      meta:
        tech_steward: "djalma.dias@nuvemshop.com.br"
        domain: "operations"
        business_owner: "Analytics Engineering"
    columns:
      - name: store_id
        description: "Unique identifier of the store. External key."
        tests:
          - not_null
      - name: vertifier
        description: "Identification of a possible vertical for the store."
      - name: created_at
        description: "Timestamp when the vertifier was originally created."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
      - name: sys_audit_created_by
        description: "System or user that created the row."
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the row."
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."


  - name: github_data__issue_labels
    description: "Staging model that concatenates every label associated to the issue in one row, to avoid duplicates. We use this table to categorize the Issue/Problem in different ways."
    config:
      meta:
        tech_steward: "fabrizio.crivella@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns: 
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_number
        description: "Identifies the identification of the Issue/Problem. Combined with repo_name, they make the unique key"
      - name: labels_tipo
        description: "Type of Issue/Problem, based on the nature of the domain. It can be App, Others or Core"
      - name: labels_domain
        description: "Domain related to the Issue/Problem"
      - name: labels
        description: "List of all labels related to the Issue/Problem"
      - name: labels_country
        description: "Used only for Platform Development. Specifies which country is affected by an Issue/Problem"
      - name: labels_wip
        description: "Labels that determine if the Issue/Problem is being solved, and which step is it in"
      - name: labels_quick_fix
        description: "If the issue has a quick fix, will have a label with that name"


  - name: github_data__wip_labels
    description: "Staging model that persists information about Working in Progress labels, becouse we need to know when they started and ended, to determine de duration of the lifecycle of an Issue/Problem"
    config:
      meta:
        tech_steward: "fabrizio.crivella@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns:
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_number
        description: "Identifies the identification of the Issue/Problem. Combined with repo_name, they make the unique key"
      - name: wip_label
        description: "Step of Working in Progress in whitch the Issue/Problem is right now"
      - name: wip_last_updated
        description: "Date when the WIP label was included"
      - name: wip_last_deleted
        description: "Date when the WIP label was removed"
  

  - name: github_data__merchant_impact
    description: "Staging model that gets information about merchants associated to an Issue/Problem. Information such as GMV and impact"
    config:
      meta:
        tech_steward: "fabrizio.crivella@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns:
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_number
        description: "Identifies the identification of the Issue/Problem. Combined with repo_name, they make the unique key"
      - name: issue_state
        description: "Determines if the Issue/Problem is Open or Closed"
      - name: store_id
        description: "Unique identifier to the store related to the Issue/Problem"
      - name: store_impact
        description: "Only for Mid Market stores, determines the criticity of the comment"
      - name: sum_gmv
        description: "Monthly average GMV from the last 4 closed months"
      - name: sum_gmv_usd
        description: "Monthly average GMV from the last 4 closed months in USD"


  - name: ga4__event_info
    description: "Staging model for GA4 events information. Includes user sessions and event metadata."
    config:
      meta:
        tech_steward: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: unique_session
        description: "Unique identifier for the user session."
        tests:
          - not_null
      - name: event_name
        description: "Name of the event triggered during the session."
      - name: event_date
        description: "Date when the event occurred."
      - name: event_device
        description: "Device category (mobile, desktop, etc.) associated with each event."
      - name: event_type
        description: "Classifies the event as 'login' or 'other' based on event_name content."
      - name: year_month_day_code
        description: "YYYYMMDD code for daily partitioning."


  - name: ga4__tp_info
    description: "Staging model for trials and payments information from GA4."
    config:
      meta:
        tech_steward: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: unique_session
        description: "Unique identifier for the user session."
        tests:
          - not_null
      - name: trial_timestamp
        description: "Timestamp when the trial started, if available."
      - name: payment_timestamp
        description: "Timestamp when the payment was made, if available."
      - name: trial_date
        description: "Date when the trial started."
      - name: payment_date
        description: "Date when the payment was made."
      - name: year_month_day_code
        description: "YYYYMMDD code based on the earliest of trial_date or payment_date."


  - name: ga4__session_info
    description: "Staging model for user sessions duration and engagement flags."
    config:
      meta:
        tech_steward: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: unique_session
        description: "Unique identifier for the user session."
        tests:
          - not_null
      - name: start_session_time
        description: "Timestamp when the session started."
      - name: end_session_time
        description: "Timestamp when the session ended."
      - name: session_duration_minutes
        description: "Duration of the session in minutes."
      - name: engage
        description: "Engagement flag for the session (1 if engaged, 0 otherwise)."
      - name: start_session_date
        description: "Date when the session started."
      - name: year_month_day_code
        description: "YYYYMMDD code for daily partitioning."


  - name: ga4__mod_pv_info
    description: "Staging model for GA4 pageviews enriched with traffic source, landing page, and UTM parameters."
    config:
      meta:
        tech_steward: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: event_timestamp
        description: "Timestamp of the pageview event."
        tests:
          - not_null
      - name: event_date
        description: "Parsed event date from GA4."
      - name: year_month_day_code
        description: "YYYYMMDD code for daily partitioning."
      - name: user_pseudo_id
        description: "Anonymized identifier for the user."
      - name: unique_session
        description: "Unique identifier for the user session."
        tests:
          - not_null
      - name: source_ga4_classification
        description: "Traffic source classification."
      - name: original_user_country
        description: "User's original country as reported by GA4."
      - name: env_pagegroup
        description: "Environment or page group indicator."
      - name: landing_page
        description: "Full landing page URL of the session."
      - name: landing_page_domain
        description: "Domain part of the landing_page URL."
      - name: landing_page_path
        description: "Path part of the landing_page URL, excluding query string."
      - name: utm_ad_id
        description: "Value extracted from the URL parameter after 'id_' up to the next '&'."
      - name: utm_content
        description: "Value extracted from the 'utm_content' URL parameter."
      - name: utm_term
        description: "Value extracted from the 'utm_term' URL parameter."
      - name: last_source
        description: "Last known traffic source for the session."
      - name: last_medium
        description: "Last known traffic medium for the session."
      - name: last_campaign
        description: "Last recorded campaign parameter."
  
  
  - name: orders__mwp_orders_source
    description: Staging da origem de tráfego dos pedidos, com normalização dos parâmetros UTM e referrer.
    config:
      meta:
        tech_steward: "gustavo.braga@nuvemshop.com.br"
        domain: "product"
        owner: "Francisco Ramirez"
    columns:
      - name: order_id
        description: ID do pedido
        tests:
          - not_null
          - unique
      - name: source
        description: Nome bruto da origem de tráfego
      - name: source_details
        description: Detalhes adicionais da origem (raw)
      - name: utm_source
        description: Parâmetro UTM de origem
      - name: utm_medium
        description: Parâmetro UTM de meio
      - name: http_referrer
        description: Referência HTTP de origem
      - name: created_at
        description: Data de criação do pedido
        tests:
          - not_null
      - name: sys_audit_created_on
        description: Timestamp de criação do registro na modelagem
      - name: sys_audit_created_by
        description: Responsável pela criação do registro
      - name: sys_audit_updated_on
        description: Timestamp da última atualização
      - name: sys_audit_updated_by
        description: Responsável pela última atualização
      - name: year_month_code
        description: Partition de ano e mês


  - name: data_predictors__quality_leads
    description: "Staging model that contains information about quality leads, such as store_id, created_at, model_id, predicted_prob and year_month_day_code."
    config:
      meta:
        tech_steward: "ronald.corcho@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: store_id
        description: "Unique identifier of the store."
        tests:
          - not_null
          - unique
      - name: created_at
        description: "Timestamp when the quality lead was created."
        tests:
          - not_null
      - name: model_id
        description: "Unique identifier of the model used to predict the quality lead."
      - name: predicted_prob
        description: "Estimated probability that the store will convert to a paying customer."
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format used for partitioning or filtering."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: moltres__platform_mwp_apps_stores
