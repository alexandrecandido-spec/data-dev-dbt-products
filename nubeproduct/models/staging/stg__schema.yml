version: 2
models:
  - name: cx__general__zendesk_organization__ref
    description: "Zendesk organizations mapped to store_id (external_id). One row per organization."
    meta:
      domain: "cx"
      owner: "santiago.gandolfo@tiendanube.com"
    columns:
      - name: organization_id
        description: "Zendesk organization id (bigint)."
        tests:
          - not_null
      - name: store_id
        description: "Store id mapped from Zendesk external_id (bigint)."
  - name: cx__general__zendesk_user_base__ref
    description: "Base user data for Zendesk integration joined to organization by store_id."
    meta:
      domain: "cx"
      owner: "santiago.gandolfo@tiendanube.com"
    columns:
      - name: user_id
        description: "Unique identifier of the user (int)."
        tests:
          - not_null
      - name: email
        description: "User email address."
        tests:
          - not_null
      - name: name
        description: "User name formatted from first_name/last_name with fallback to 'User-{user_id}'."
        tests:
          - not_null
      - name: phone
        description: "Store owner phone number in E.164 format. Null if unavailable or invalid."
      - name: user_is_partner
        description: "Boolean flag indicating if user is also a partner."
        tests:
          - not_null
      - name: partner_id
        description: "Partner ID. Null if user is not a partner."
      - name: organization_id
        description: "Zendesk organization id matched by external_id = store_id. Null if no match."
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: bigint
          - dbt_utils.expression_is_true:
              expression: "is null or organization_id > 0"
      - name: store_id
        description: "Store ID associated with the user."
        tests:
          - not_null
      - name: has_store
        description: "Boolean flag indicating if user has a store. Always true (filtered by active stores)."
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "= true"
  - name: stg_active_merchants
    description: "Staging model that contains the list of every active merchant monthly."
    config:
      meta:
        tech_steward: "renan.ferrari@nuvemshop.com.br"
        domain: "finance"
        business_owner: "Operations"
    columns:
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null
      - name: store_country
        description: "Country of the store."
        tests:
          - not_null
      - name: store_id_plan_country
        description: "Plan ID in store country."
      - name: date
        description: "Date of the first day of the evaluated month."
        tests:
          - not_null
      - name: year
        description: "Year extracted from the original date of the merchant snapshot."
      - name: month
        description: "Month extracted from the original date of the merchant snapshot."
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row."
        tests:
          - not_null


  - name: nuvem_credito__credit_proposals
    config:
      meta:
        owner: "sofia.sanchez@tiendanube.com"
        domain: "fintech"
        business_owner: "Lending"
    description: "Staging model with credit proposals, clean data with current store_id"
    columns:
      - name: id
        description: "Unique internal identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: hub_contract_id
        description: "Unique external identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null
      - name: disbursed_at
        description: "Date when the credit amount was disbursed."
      - name: finished_at
        description: "Date when the credit was finalized (It could be by being renegotiated or fully paid)."
      - name: original_contract_ids
        description: "Not null only if the credit is a renegotiation. It contains all contracts ids that were renegotiated."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: nuvem_credito__initial_installments
