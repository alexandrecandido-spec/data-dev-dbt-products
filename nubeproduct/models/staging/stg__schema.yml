version: 2
models:
  - name: moltres__mwp_store_info
    config:
      meta:
        owner: "rodrigo.torres@tiendanube.com"
        domain: "finance"
    columns:
      - name: store_id
        tests:
          - unique
      - name: store_id
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null

  - name: orders__mwp_orders
    columns:
      - name: id
        tests:
          - unique
      - name: id
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null
      - name: status
        tests:
          - not_null
      - name: total_in_usd
        tests:
          - not_null
      - name: total
        tests:
          - not_null

  - name: nuvem_credito__credit_proposals
    description: "Staging model credit proposals, cleaning data."
    columns:
      - name: id
        description: "Unique internal identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: hub_contract_id
        description: "Unique external identifier for each proposal."
        tests:
          - unique
          - not_null
      - name: store_id
        description: "Store identifier."
        tests:
          - not_null