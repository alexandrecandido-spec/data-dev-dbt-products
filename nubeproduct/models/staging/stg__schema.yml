  - name: product__shipping_locations
    description: "Contains information on all the distribution centers of the stores"
    config:
      meta:
        owner: "sol.abelleyro@tiendanube.com"
        domain: "product"
        business_owner: "Francisco Ramirez"
    columns:
      - name: address
        description: "Object with adress metadata (region, city, zipcode)"
      - name: chosenAsDefaultAt
        description: "Timestamp when the distribution center was chosen as the default. If the CD is no longer default, the date gets deleted from this field"
      - name: createdAt
        description: "Timestamp when the distribution center was created"
      - name: deletedAt
        description: "Timestamp when the distribution center was deleted"
      - name: id
        description: "Unique identifier for the distribution center. This id is present in the CD's URL in the admin "
        tests:
          - not_null
          - unique
      - name: isDraft
        description: "A location will only have this field set to true when the store is being created until the merchant created a location which will be the default. The id for this first location they add will be the same as the draft one. Only recently created merchants will have a location in isDraft = true"
      - name: name
        description: "Name of the distribution center"
      - name: priority
        description: "This priority level is determined by the merchant and it will be taken into account when deciding the shipping sources if that's the rule selected."
      - name: storeId
        description: "Unique identifier of the store linked to the distribution center."
      - name: tags
        description: "If a merchant has both online and PDV, this tag will inform if the CD can be used for a specific channel or both. If a merchant has only online or has enabled the CD for both,the field will be null. So the tags will only show up if only 1 of the options is allowed for the CD"
      - name: updatedAt
        description: "Timestamp when the distribution center was last updated"
      - name: year_month_code
        description: "Reference year and month. Also the field used to partition the table."


