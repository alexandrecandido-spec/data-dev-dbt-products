  - name: storefronts_curated__events_cart_product_add
    description: >
      Curated model that maps the relationship between sessions and carts based on the event 'cart_product_add'.
      It generates a deterministic technical session key and selects a single representative event per (session, cart) pair.
      Used to identify which session originated or interacted with each cart. Valid data available since 2024-01-23.
    config:
      meta:
        owner: "barbara.marques@nuvemshop.com.br"
        domain: "product"
        business_owner: "Tomas Musich"
    columns:
      - name: event_id
        description: "Unique identifier of the raw event emitted by the storefront."
        tests:
          - not_null
          - unique
      - name: event_timestamp
        description: "Original timestamp of the event 'cart_product_add'."
        tests:
          - not_null
      - name: base_date
        description: "Partition date for the table, based on the event timestamp."
        tests:
          - not_null
      - name: unique_session_key
        description: "Deterministic technical key for each session (MD5 of session_id, consumer_id, store_id)."
        tests:
          - not_null
      - name: session_id
        description: "Identifier of the session generated by the storefront visitor."
      - name: consumer_id
        description: "Identifier of the consumer (visitor) associated with the session."
      - name: store_id
        description: "Store identifier where the session occurred."
        tests:
          - not_null
      - name: event
        description: "Type of event recorded. Filtered to 'cart_product_add' in this model."
        tests:
          - not_null
          - accepted_values:
              values: ['cart_product_add']
      - name: cart_id
        description: "Identifier of the cart associated with the event, extracted from attributes."
        tests:
          - not_null
      - name: sys_audit_created_on
        description: "Timestamp when the record was first inserted into this table."
      - name: sys_audit_created_by
        description: "User or process that first inserted the record."
      - name: sys_audit_updated_on
        description: "Timestamp of the most recent update to the record."
      - name: sys_audit_updated_by
        description: "User or process that performed the last update."

