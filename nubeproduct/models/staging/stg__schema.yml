  - name: marketing_analytics_events
    description: |
      GA4/Analytics marketing events already deduplicated by the composite key
      (event_bundle_sequence_id, event_timestamp, user_pseudo_id, batch_event_index, event_name).
      Keeps the newest record per key by ordering on event_date and year_month_code.
      Includes sys_audit_* fields, is partitioned by year_month_day_code, and is materialized incrementally.
    config:
      meta:
        owner: "sofia.torres@tiendanube.com"
        domain: "marketing"
        business_owner: "Giselle Galli"
    columns:
      - name: source
        description: Ingestion source or upstream dataset identifier.
        tests:
          - not_null
      - name: event_bundle_sequence_id
        description: Event bundle sequence identifier provided by GA4.
        tests:
          - not_null
      - name: batch_event_index
        description: Position of the event within its bundle.
      - name: user_pseudo_id
        description: Anonymous user pseudo ID.
        tests:
          - not_null
      - name: id
        description: Synthetic ID `source-user_pseudo_id` for convenient joins.
        tests:
          - not_null
      - name: ga_session_id
        description: GA4 session id parsed from event_params (int or string coerced to bigint).
      - name: unique_session
        description: Unique session identifier combining source, user_pseudo_id, and ga_session_id.
      - name: event_name
        description: GA4 event name (e.g., page_view, session_start, purchase).
        tests:
          - not_null
      - name: event_params
        description: Array/struct of event parameters in GA4 native format.
      - name: event_date
        description: Event date (YYYYMMDD or date type depending on the warehouse).
        tests:
          - not_null
      - name: event_timestamp
        description: Event timestamp.
        tests:
          - not_null
      - name: device_category
        description: Device category (desktop, mobile, tablet).
      - name: country
        description: Country as resolved by geo IP.
      - name: region
        description: Region/State/Province as resolved by geo IP.
      - name: year_month_code
        description: YYYYMM monthly partition code.
        tests:
          - not_null
      - name: year_month_day_code
        description: YYYYMMDD daily partition code.
        tests:
          - not_null
      - name: sys_audit_created_on
        description: Creation timestamp for audit purposes.
        tests:
          - not_null
      - name: sys_audit_created_by
        description: User/process that created the record (audit).
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: Last update timestamp (audit).
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: User/process that updated the record (audit).
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - event_bundle_sequence_id
            - event_timestamp
            - user_pseudo_id
            - batch_event_index
            - event_name


  - name: storefronts_curated__sessions
    description: >
      Staging model that standardizes raw storefront sessions.
      Includes normalization of UTM parameters, referrer, and creation of a
      technical unique key for incremental loading. Serves as the clean base
      for downstream traffic and attribution analysis.
    config:
      meta:
        owner: "barbara.marques@nuvemshop.com.br"
        domain: "product"
        business_owner: "Tomas Musich"
    columns:
      - name: unique_session_key
        description: "Deterministic technical key for each session (MD5 of session_id, consumer_id, store_id)."
        tests:
          - not_null
          - unique
      - name: session_timestamp
        description: "Original timestamp of the session event."
        tests:
          - not_null
      - name: base_date
        description: "Partition date for the table, based on the session timestamp."
        tests:
          - not_null
      - name: session_id
        description: "Identifier of the session generated by the storefront visitor."
        tests:
          - not_null
      - name: consumer_id
        description: "Identifier of the consumer (visitor) associated with the session."
      - name: store_id
        description: "Store identifier where the session occurred."
        tests:
          - not_null
      - name: visitor_country
        description: "Country of the visitor as reported in the session."
      - name: device
        description: "Device category (desktop, mobile, etc.) used in the session."
      - name: theme
        description: "Theme identifier of the storefront during the session."
      - name: user_agent
        description: "User agent string of the device/browser from the session."
      - name: ip_address
        description: "IP address of the visitor during the session."
      - name: utm_source
        description: "Normalized UTM parameter indicating the traffic source."
      - name: utm_medium
        description: "Normalized UTM parameter indicating the traffic medium."
      - name: utm_campaign
        description: "Normalized UTM parameter indicating the traffic campaign."
      - name: utm_term
        description: "Normalized UTM parameter indicating the keyword used in paid search."
      - name: utm_content
        description: "Normalized UTM parameter indicating the ad creative or variation."
      - name: landing_page
        description: "Normalized landing page URL of the session."
      - name: http_referral
        description: "Normalized referrer URL of the session."
      - name: sys_audit_created_on
        description: "Timestamp when the row was originally created in this model."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "System or user that created the row in this model."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp when the row was last updated in this model."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "System or user that last updated the row in this model."
        tests:
          - not_null


  - name: midmarket_hubspot_archived_deals
    description: >
      Staging model that processes HubSpot deals that have been archived.
      This model extracts deal information from archived deals source and applies 
      incremental loading strategy to capture only new or updated records.
      Part of the HubSpot deals processing pipeline.
    config:
      meta:
        owner: "pedro.fregonese@tiendanube.com"
        domain: "midmarket"
        business_owner: "Franco Tiberti"
    columns:
      - name: deal_id
        description: "Unique identifier for the HubSpot deal. Primary key."
        tests:
          - unique
          - not_null
      - name: deletion_type
        description: "Type of deal removal. Always 'archived' for this model."
        tests:
          - not_null
          - accepted_values:
              values: ["archived"]
      - name: archived_at
        description: "Timestamp when the deal was archived in HubSpot."
        tests:
          - not_null
      - name: updatedAt
        description: "Timestamp when the record was last updated."
      - name: createdAt
        description: "Timestamp when the record was originally created in archived list."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Preserved from previous loads for existing records."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."
        tests:
          - not_null

  - name: midmarket_hubspot_merged_deals
    description: >
      Staging model that processes HubSpot deals that have been merged into other deals.
      This model extracts deal IDs from the merged_deal_ids field by exploding the 
      semicolon-separated list. Uses incremental loading strategy to capture only 
      new or updated records based on the audit_merged_updated_on timestamp from source.
      Part of the HubSpot deals processing pipeline.
    config:
      meta:
        owner: "pedro.fregonese@tiendanube.com"
        domain: "midmarket"
        business_owner: "Franco Tiberti"
    columns:
      - name: deal_id
        description: "Unique identifier for the HubSpot deal that was merged. Primary key."
        tests:
          - unique
          - not_null
      - name: deletion_type
        description: "Type of deal removal. Always 'merged' for this model."
        tests:
          - not_null
          - accepted_values:
              values: ["merged"]
      - name: archived_at
        description: "Timestamp when the deal was archived. Always null for merged deals as they don't have archive timestamps."
      - name: audit_merged_updated_on
        description: "Timestamp when the resulting deal from the merge information was last updated in the source system. Used for incremental loading."
      - name: pipeline
        description: "HubSpot pipeline identifier associated with the merged deal."
      - name: dealstage
        description: "Current stage of the deal within the HubSpot pipeline at the time of merging."
      - name: hubspot_owner_id
        description: "Identifier of the HubSpot user who owns/owned the merged deal."
      - name: createdate
        description: "Timestamp when the merged deal was originally created in HubSpot."
      - name: closedate
        description: "Timestamp when the merged deal was closed in HubSpot, if applicable."
      - name: last_modified_date
        description: "Timestamp of the last modification made to the deal in HubSpot."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Preserved from previous loads for existing records."
        tests:
          - not_null
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
        tests:
          - not_null
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
        tests:
          - not_null
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."
        tests:
          - not_null
                    
  - name: github_data__issue_comment
    description: >
      Staging model that contains the list of every comment associated to an Issue/Problem.
      This table has no filter applied, so it contains all comments.
      In order to replicate what is found on GitHub (deleted comments will not be included as well as previews versions of edited comments), this model is not incremental but performs a full refresh on each run.
    config:
      meta:
        owner: "matias.scasso@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns: 
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_number
        description: "Issue/problem identification number. Must be combined with repo_name to correctly identify the issue/problem"
      - name: comment_id
        description: "Comment identification number. Must be combined with repo_name and issue_number to get the unique key of the model"
      - name: author
        description: "Author of the comment"
      - name: is_relevant
        description: "Determines if the comment is relevant to the Issues & Problems model logic, i.e. if it is a +1 comment"
      - name: comment_date
        description: "Date when the comment was created"


  - name: github_data__issue_store
    description: > 
      Staging model that contains ONE store that is associated to the comment.
      Some comments contain references to multiple stores, which is not according to the standard practice.
      In order to replicate what is found on GitHub (deleted comments will not be included as well as previews versions of edited comments), this model is not incremental but performs a full refresh on each run.
    config:
      meta:
        owner: "matias.scasso@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns:
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_number
        description: "Issue/problem identification number. Must be combined with repo_name to correctly identify the issue/problem"
      - name: comment_id
        description: "Comment identification number. Must be combined with repo_name and issue_number to get the unique key of the model"
      - name: store_id
        description: "Store identification number. Only one is included per comment_id."
  

  - name: github_data__store_impact
    description: >
      Staging model that contains the impact of the comment related to the store. It applied only to Mid Market stores.
      Comment_id < 0 are not included and only one impact is included per comment_id, just in case.
      In order to replicate what is found on GitHub (deleted comments will not be included as well as previews versions of edited comments), this model is not incremental but performs a full refresh on each run.
    config:
      meta:
        owner: "matias.scasso@tiendanube.com"
        domain: "product"
        business_owner: "Martin Palombo"
    columns:
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_number
        description: "Issue/problem identification number. Must be combined with repo_name to correctly identify the issue/problem"
      - name: comment_id
        description: "Comment identification number. Must be combined with repo_name and issue_number to get the unique key of the model"
      - name: impact
        description: "Only for Mid Market stores, determines the criticity of the comment"
        
