    config:
      meta:
        tech_steward: "fernando.martinez@tiendanube.com"
        domain: "product"
        business_owner: "Nicolas Loreti"
    columns:
      - name: issue_number
        description: "Identifies the identification of the Issue/Problem. Combined with repo_name, they make the unique key"
      - name: repo_name
        description: "Determines if row is related to an Issue or Problem"
      - name: issue_label_name
        description: "name of the label"
      - name: label_country
        description: "determines the country of the label"
      - name: label_created_at
        description: "date when the label was created"
      - name: label_updated_at
        description: "date when the label was updated"


  - name: billing__receipt
