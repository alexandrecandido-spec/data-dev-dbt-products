      - name: created_date
        description: "Date when the metaplan was created."
        tests:
          - not_null
      - name: store_id
        description: "Store identifier of the store with the metaplan."
        tests:
          - not_null
      - name: promotion_id
        description: "Promotion identifier of the promotion with the metaplan."
      - name: metaplan_name
        description: "Name of the metaplan."
      - name: is_metaplan_deleted
        description: "Indicates if the metaplan is deleted."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model."
      - name: sys_audit_created_by
