version: 2
models:
  - name: orders__mwp_orders
    description: "All the orders in their different statuses"
    config:
      meta:
        owner: "gustavo.braga@nuvemshop.com.br"
        domain: "finance"
        business_owner: "Nico Loreti"
    columns:
      - name: id
        description: "Unique identifier for the order."
        tests:
          - unique:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: order_id
        description: "Unique identifier for the order."
      - name: store_id
        description: "Identifier of the store associated with the order."
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: started_checkout_at
        description: "Timestamp when the user started the checkout process."
      - name: completed_contact_at
        description: "Timestamp when the customer provided contact information during checkout."
      - name: completed_at
        description: "Timestamp when the order was successfully completed."
      - name: cancelled_at
        description: "Timestamp when the order was cancelled, if applicable."
      - name: cancel_reason
        description: "Reason for the order cancellation, if applicable."
      - name: created_at
        description: "Timestamp when the order was created."
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: contact_email
        description: "Email address of the customer who placed the order."
      - name: contact_name
        description: "Name of the customer who placed the order."
      - name: currency
        description: "Currency used for the transaction."
      - name: status
        description: "Current status of the order (e.g., open, completed, cancelled)."
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: total_in_usd
        description: "Total value of the order converted to USD."
        tests:
          - not_null:
              where: "sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: total
        description: "Total value of the order in the original currency."
      - name: storefront
        description: "Sales channel through which the order was placed (e.g., store, mobile)."
      - name: device_type
        description: "Type of device used to place the order (e.g., computer, phone, tablet)."
      - name: payment_status
        description: "Payment status of the order (e.g., paid, pending, failed)."
      - name: gateway
        description: "Name of the payment gateway used to process the transaction."
      - name: internal_extra
        description: "Additional internal information about the order."
      - name: shipping_method
        description: "Shipping method selected for the order."
      - name: shipping_cost
        description: "Cost of shipping for the order."
      - name: shipping_option
        description: "Shipping option chosen by the customer."
      - name: shipping_pickup_type
        description: "Type of shipping pickup (e.g., delivery, in-store pickup)."
      - name: shipping_province
        description: "Province or region where the order was shipped."
      - name: gateway_integration_type
        description: "Integration type used with the payment gateway (e.g., direct, aggregator)."
      - name: gateway_installments
        description: "Number of payment installments selected by the customer, if applicable."
      - name: gateway_method
        description: "Specific method used in the gateway (e.g., credit_card, boleto)."
      - name: order_date_store_id
        description: "Composite key representing the order date and store identifier, used for partitioning or indexing."
      - name: app_id
        description: "Identifier of the app or plugin involved in the order, if applicable."
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format used for partitioning or filtering."
      - name: discount
        description: "Coupon discount."
      - name: discount_gateway
        description: "Discount on gateway"
      - name: promotional_discount_id
        description: "Promotional discount"
      - name: shipping_cost_owner
        description: "Shipping cost on the owner side"
      - name: fulfillment_status
        description: "Fulfillment status of the order."
      - name: coupon_id
        description: "Coupon id"
      - name: shipping_extra
        description: "Shipping extra"
      - name: order_traits
        description: "Traits of the order (currently shows subscription_initial when the order is the first order from a subscription and subscription_recurrence for the subsequent orders within a subscription)"
      - name: is_paid_order
        description: "Indicates whether the order was successfully completed and paid (not cancelled, status is 'paid', and completed_at is not null)."
      - name: device
        description: "Normalized device type used to place the order. Returns 'computer', 'phone', or 'other'."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."


  - name: orders__mwp_order_products
    description: "Products associated with the order"
    config:
      meta:
        owner: "gustavo.braga@nuvemshop.com.br"
        domain: "finance"
        business_owner: "Giselle Galli"
    columns:
      - name: id
        description: "Identifier of the order associated with the product."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Identifier of the order associated with the product."
        tests:
          - not_null
      - name: product_id
        description: "Identifier of the product included in the order."
        tests:
          - not_null
      - name: product_name
        description: "Name of the product included in the order."
      - name: product_price
        description: "Price of the product included in the order."
      - name: quantity
        description: "Number of units of the product included in the order."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 998
              row_condition: "quantity IS NOT NULL AND sys_audit_updated_on >= current_timestamp - interval '1 hours'"
      - name: created_at
        description: "Timestamp when the order-product record was created."
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp of the most recent update to the order-product record."
      - name: deleted_at
        description: "Timestamp when the order-product record was soft-deleted, if applicable."
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format used for partitioning or filtering."
      - name: change_timestamp
        description: "The most recent change timestamp among created_at, updated_at, and deleted_at."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."
  
  
  - name: orders__mwp_orders_source
    description: Staging da origem de tráfego dos pedidos, com normalização dos parâmetros UTM e referrer.
    config:
      meta:
        owner: "gustavo.braga@nuvemshop.com.br"
        domain: "product"
        owner: "Francisco Ramirez"
    columns:
      - name: order_id
        description: ID do pedido
        tests:
          - not_null
          - unique
      - name: source
        description: Nome bruto da origem de tráfego
      - name: source_details
        description: Detalhes adicionais da origem (raw)
      - name: utm_source
        description: Parâmetro UTM de origem
      - name: utm_medium
        description: Parâmetro UTM de meio
      - name: http_referrer
        description: Referência HTTP de origem
      - name: created_at
        description: Data de criação do pedido
        tests:
          - not_null
      - name: sys_audit_created_on
        description: Timestamp de criação do registro na modelagem
      - name: sys_audit_created_by
        description: Responsável pela criação do registro
      - name: sys_audit_updated_on
        description: Timestamp da última atualização
      - name: sys_audit_updated_by
        description: Responsável pela última atualização
      - name: year_month_code
        description: Partition de ano e mês


  - name: orders__mwp_orders_b2b
    description: "Staging model that contains all the b2b orders generated by the blended store solution"
    config:
      meta:
        owner: "matias.scasso@tiendanube.com"
        domain: "product"
        business_owner: "Wagner Moynier"
    columns:
      - name: id
        description: "Unique identifier for the b2b order"
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: price_table_id
        description: "Wholesale pricetable id associated with the order"
      - name: percentage_applied
        description: "Percentage of discount applied to the order for being a wholesale order"
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."

  - name: product__orders__order_logging__event
