  - name: orders__order_money_flows__event
    description: "Money flows associated with orders"
    config:
      meta:
        owner: "gustavo.braga@nuvemshop.com.br"
        domain: "product"
        business_owner: "Giselle Galli"
    columns:
      - name: id
        description: "Unique identifier for the money flow event."
        tests:
          - unique
          - not_null
      - name: store_id
        description: "Identifier of the store associated with the money flow."
      - name: order_id
        description: "Identifier of the order associated with the money flow."
        tests:
          - not_null
      - name: currency
        description: "Currency used for the money flow transaction."
      - name: amount
        description: "Amount of the money flow in the original currency."
      - name: amount_usd
        description: "Amount of the money flow converted to USD."
      - name: hash
        description: "Hash identifier for the money flow transaction."
      - name: source
        description: "Source of the money flow (e.g., payment, refund, fee)."
      - name: payment_transaction_id
        description: "Identifier of the payment transaction associated with the money flow."
      - name: payment_transaction_event_id
        description: "Identifier of the payment transaction event associated with the money flow."
      - name: happened_at
        description: "Timestamp when the money flow event occurred."
        tests:
          - not_null
      - name: effective_amount
        description: "Effective amount of the money flow in the original currency."
      - name: effective_amount_usd
        description: "Effective amount of the money flow converted to USD."
      - name: year_month_day_code
        description: "Date code in YYYYMMDD format used for partitioning or filtering."
      - name: sys_audit_created_on
        description: "Timestamp when the record was first loaded into the model. Defaults to current_timestamp if not available."
      - name: sys_audit_created_by
        description: "User or process that first loaded the record into the model. Defaults to 'data-dev-dbt-products'."
      - name: sys_audit_updated_on
        description: "Timestamp of the current model run when the record was processed."
      - name: sys_audit_updated_by
        description: "User or process responsible for the current model run. Defaults to 'data-dev-dbt-products'."