version: 2

sources:
  - name: stg_active_merchants
    database: hive_metastore
    schema: finance
    tables:
      - name: active_merchants
        description: "Contains the list of every active merchant daily."


  - name: stg_moltres
    database: hive_metastore
    schema: moltres
    tables:
      - name: mwp_store_info
        description: "Contains all the list of stores with their information"
      - name: mwp_apps_stores
        description: "Contains all the list of stores who installed and or uninstalled an app"
      - name: mwp_tags
        description: "Tags associadas a lojas e outras entidades. Inclui flags como sre-block-store-404 e sre-block-store-429"
      - name: mwp_user_languages
        description: "Table with user languages (from 'Paises Habilitados')"
      - name: mwp_user_countries
        description: "Table with user countries (from 'Paises Habilitados')"
      - name: mwp_store_settings
      - name: mwp_countries
      - name: mwp_provinces
      - name: mwp_cities_ar
      - name: mwp_cities_mx
      - name: mwp_plans
      - name: regions
      - name: cidades
      - name: mwp_invoice_info
      - name: mwp_payment_stores
      - name: mwp_payments
      - name: mwp_contracts
      - name: mwp_invoices
      - name: mwp_payment_tax
      - name: mwp_invoices_credit_notes
      - name: mwp_payment_transaction_fees
      - name: mwp_payment_apps
      - name: mwp_payment_domains
      - name: mwp_options
      - name: wp_users
      - name: mwp_apps
        description: "Contains information about apps installed by merchants"
      - name: mwp_zipcodes_ar
        description: "Table with zipcodes from Argentina."
      - name: mwp_zipcodes_mx
        description: "Table with zipcodes from Mexico."
      - name: ceps
        description: "Table with zipcodes from Brazil."


  - name: stg_orders
    description: "Source containing tables related to order movements"
    database: hive_metastore
    schema: orders
    tables:
      - name: mwp_orders
        description: "Main table, contains information about orders, including customer details, products, status, and creation and completion dates"
      - name: mwp_order_products
        description: "Products associated with an order."
      - name: mwp_orders_source
        description: "Contains information about the traffic source of the orders, including UTM parameters, referrer, and source classifications"
      - name: mwp_order_products_deleted
        description: "Deleted regs of products associated with an order."
      - name: mwp_orders_b2b
        description: "Orders generated through the B2B solution."


  - name: stg_nuvem_credito
    description: "Source containing tables related to Nuvem credito"
    database: hive_metastore
    schema: nuvem_credito
    tables:
      - name: contracts
        description: "Credit proposals generated by merchants"
      - name: payers
        description: "Information related to the payer of the contract"
      - name: installments
        description: "Contains all installments associated to a contract"
      - name: offers
        description: "Contains all credit offers that were once given to our merchants"

  - name: stg_credito_dev
    description: "Source containing tables created by Underwritting team"
    database: hive_metastore
    schema: credito_dev
    tables:
      - name: engine_offers
        description: "Offers generated by out engine"
      - name: mova_installments_present_value
        description: "Daily installments' details taken directly from Mova's system"


  - name: stg_antifraud_service
    database: hive_metastore
    schema: antifraud_service
    tables:
      - name: vertifier_store_inferences
        description: ""


  - name: stg_github_data
    database: hive_metastore
    schema: github_data
    tables:
      - name: issue_events 
        description: "Contains timestamps of every modification applied to the Issue/Problem. For example, adding a label"
      - name: issue_label
        description: "Contains the labels or tags associated to the Issue/Problem. We use labels for different purposes, such as determine the domain"
      - name: issue_store
        description: "Contains the list of every store who commented on the Issue/Problem"
      - name: issue
        description: "Contains the list of every Issue/Problem, regardless of its state"
      - name: store_impact
        description: "Lists the priority or impact of the comment associated to a store. It only applies in Mid Market stores."
      - name: issue_comment
        description: "Contains the list of every comment associated to an Issue/Problem"

  - name: bronze_risk_ecosystem
    database: bronze_risk
    schema: ecosystem
    tables:
      - name: apps
        description: "Apps table from bronze_risk.ecosystem"
      - name: mwp_countries
        description: "countries table from bronze_risk.ecosystem"
  
  - name: bronze_risk_new_admin
    database: bronze_risk
    schema: new_admin
    tables:
      - name: auth_authentication_factors
        description: "Authentication factors per user (2FA) from bronze_risk.new_admin"
  
  
  - name: stg_data_predictors
    database: hive_metastore
    schema: data_predictors
    description: "Intermediate tables built from raw data in the data_predictors schema, typically used to normalize or enrich store-level information."
    tables:
      - name: marketing_new_payment_predictor
        description: "Predicts the likelihood of a new payment based on the store's payment history and other relevant factors."
      - name: marketing_model_version_aux
        description: "Contains information about the version of the model used to make predictions."
      - name: marketing_cutoffs_table
        description: "Contains information about the cutoffs used to define QLs."
      - name: marketing_potential_churn_predictions
        description: "Contains the outputs of the Potential Churn model. Predicts the likelihood of a store churning based on its payment history and other relevant factors."


  - name: stg_billing
    description: "Source containing tables related to billing operations, including charges, invoices, payments, and store information"
    database: hive_metastore
    schema: billing
    tables:
      - name: charge
        description: "Contains billing charges for plans and services, including amounts, dates, and references to stores and concepts"
      - name: concept
        description: "Defines billing concept types and codes (e.g., plan-cost, transaction-fee) used to categorize charges"
      - name: country
        description: "Contains country information and codes for billing purposes, linked to store locations"
      - name: invoice
        description: "Contains invoices issued to stores, including document types, numbers, amounts, and issue dates"
      - name: invoice_tax
        description: "Contains tax information applied to invoices, including tax codes and amounts"
      - name: pay_order
        description: "Contains payment orders with status information for processing billing transactions"
      - name: pay_order_charge
        description: "Links payment orders to their associated charges, establishing the relationship between payments and billing items"
      - name: payment_method
        description: "Contains information about payment methods available and used in billing transactions"
      - name: payment_transaction
        description: "Contains payment transactions processed through billing system, including status, timestamps, and payment method details"
      - name: receipt
        description: "Contains receipts generated for billing purposes, including receipt identifiers and numbers for tracking"
      - name: store
        description: "Maps billing system store identifiers to core store IDs, providing the link between billing and main store data"
      - name: invoice_information
        description: "Contains tax and fiscal information required for invoice issuance, including business details and tax identifiers"
      - name: invoice_information_ar
        description: "Contains additional fiscal information specific to Argentina for invoice issuance and tax compliance"
      
  - name: stg_nuvem_envio_billing
    database: hive_metastore
    schema: nuvem_envio_billing
    tables:
      - name: billing_cycle
        description: "Billing cycle information per store. Includes charges, adjustments, invoice metadata, and cycle status."
      - name: cycle_by_carrier
        description: "Carrier-specific delivery cost breakdown for each billing cycle."

  - name: stg_onboarding
    database: hive_metastore
    schema: onboarding
    tables:
      - name: onboarding_store_preference_types 
        description: "Merchant sales channels. Responses are received when the merchant completes the pre-onboarding questionnaire. Merchants can choose multiple options and each selection is stored as a distinct entry in the table."
      - name: domain_types
        description: "It includes every possible answer choice for the pre-onboarding survey questions that the user will see in the frontend."
      - name: domain_mappings
        description: "It links the question groups of the questionnaires with the answer options from the domain types."
      - name: store_preferences
        description: "It records the preferences of each store based on the options selected in the questionnaire."
      - name: store_questionnaire_statuses
        description: "It records the status of the pre-onboarding questionnaire for each store. A row is created when a new store is generated, with the status 'pending'. The status only changes to 'completed' when the store finishes the pre-onboarding."
  
  - name: stg_offline
    database: hive_metastore
    description: "Source containing tables related to Offline (point of sale)"
    schema: offline
    tables:
      - name: plan_subscriptions
        description: "Offline subscription records for stores"
      - name: plans
        description: "Offline plans available for stores"

  - name: stg_nuvem_envio_conciliation
    database: hive_metastore
    schema: nuvem_envio_conciliation
    tables:
      - name: delivery_order
        description: "Orders delivered with Nuvem Envio/Envio Nube"

  - name: stg_marketing
    database: hive_metastore
    description: "Source containing tables related to marketing"
    schema: marketing
    tables:
      - name: analytics_events
        description: "Raw events from marketing analytics"

  - name: stg_catalog
    database: hive_metastore
    description: "Source containing tables related to catalog"
    schema: catalog
    tables:
      - name: mwp_product_categories
        description: "Contains the list of every product category"
      - name: mwp_inventory_levels
        description: "Contains information stock on each CD for each variant"
      - name: mwp_product_list 
        description: "Contains all products"
      - name: mwp_product_variants
        description: "Contains all product variants"
      - name: mwp_product_videos
        description: "Contains all product videos"
      - name: mwp_stock_history
        description: "Contains all the stock changes and variant creations with information on the source of the change"

  - name: stg_shipping
    database: hive_metastore
    schema: shipping
    description: "Staging tables built from raw data in the shipping schema, typically used to normalize or enrich store-level information."
    tables:
      - name: locations
        description: "Contains information about the store's distribution centers"

  - name: stg_storefronts
    database: hive_metastore
    description: "Source containing tables related to storefronts events and sessions"
    schema: storefronts_curated
    tables:
      - name: sessions
        description: "Raw sessions from users"
      - name: events
        description: "Raw events from users"


  - name: stg_hubspot
    database: raw
    schema: hubspot
    tables:
      - name: deals_archived 
        description: "Contains a record of Hubspot deals that were archived (only last 90 days)"


  - name: stg_third_party
    database: hive_metastore    
    description: "Raw tables loaded from the ingestion of external data sources"
    schema: third_party
    tables:
      - name: finance_exchange_rate_ars_to_usd
      - name: marketing_github_mkt_attribution
        description: "List of marketing github issues/inputs created by the marketing team"
      - name: midmarket_hubspot_deals
      - name: midmarket_hubspot_calls
      - name: midmarket_hubspot_meetings
      - name: midmarket_hubspot_email
      - name: midmarket_hubspot_communications
      - name: midmarket_hubspot_tasks
      - name: marketing_google_search_console_urls_results
        description: "Results from the Google Search Console URLs report"
      - name: marketing_google_search_console_urls_unsplit_results
        description: "Results from the Google Search Console URLs unsplit report"

  - name: stg_nuvemchat
    database: hive_metastore
    description: "Source containing tables related to Nuvemchat"
    schema: nuvemchat_api_backend
    tables:
      - name: store
        description: "All merchants that have Nuvemchat installed"
      - name: billing_plan
        description: "Information on billing and trials for merchants"
      - name: conversation
        description: "All conversations with Nuvemchat"
      - name: message
        description: "All messages with Nuvemchat"
      - name: channel
        description: "All channels for chats with Nuvemchat"
      - name: invoice
        description: "Data on all invoices related to Nuvemchat"
      - name: invoice_state
        description: "Data on all invoice states over time"
        
  - name: stg_metafields
    database: hive_metastore
    schema: metafields
    description: "Intermediate tables built from the multiple metafields tables"
    tables:
      - name: metafield_product_variants
        description: "Contains all product variants metafields"
      - name: metafield_products
        description: "Contains all products metafields"
      - name: metafield_date_resource_products
        description: "Contains all assigned date type products metafields"
      - name: metafield_numeric_resource_products
        description: "Contains all assigned numeric type products metafields"
      - name: metafield_option_resource_products
        description: "Contains all assigned option type products metafields"
      - name: metafield_text_resource_products
        description: "Contains all assigned text type products metafields"  
      - name: metafield_text_resource_product_variants
        description: "Contains all assigned text type product variants metafields"
      - name: metafield_date_resource_product_variants
        description: "Contains all assigned date type product variants metafields"
      - name: metafield_numeric_resource_product_variants
        description: "Contains all assigned numeric type product variants metafields"
      - name: metafield_option_resource_product_variants
        description: "Contains all assigned option type product variants metafields"

  - name: stg_ecosystem
    database: hive_metastore
    schema: ecosystem
    description: "Intermediate tables built from the multiple metafields tables"
    tables:
      - name: mwp_partner_partner_types
        description: "Contains the type of the partner"
      - name: apps_categories
        description: "Contains the category of the partner"
      - name: apps_countries
        description: "Contains the countries of the apps"
      - name: mwp_partners
        description: "Contains the information of the partners"
      - name: countries
        description: "Contains the countries of the partners"
      - name: apps
        description: "Contains app information"
      
  
  - name: stg_data_manual
    database: hive_metastore
    schema: "{{ 'testing_manual' if target.name == 'dev' else 'data_manual' }}"
    tables:
      - name: operations__grouping_plans_aux
      - name: dimensions__segment_type
      - name: dimensions__region
      - name: logistics__shipping_classification
