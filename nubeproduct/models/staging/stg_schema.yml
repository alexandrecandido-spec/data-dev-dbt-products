version: 2
models:
  - name: moltres__mwp_store_info
    columns:
      - name: store_id
        tests:
          - unique
      - name: store_id
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null

  - name: orders__mwp_orders
    columns:
      - name: id
        tests:
          - unique
      - name: id
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: created_at
        tests:
          - not_null
      - name: status
        tests:
          - not_null
      - name: total_in_usd
        tests:
          - not_null
      - name: total
        tests:
          - not_null
        
  - name: third_party__github_marketing_attribution
    config:
      meta:
        owner: "ronald.corcho@tiendanube.com"
        domain: "marketing"
    description: "Standarizes raw marketing github issues/inputs data. Adds standard field names."
    columns:
      - name: id
        description: "Unique identifier for the GitHub issue/input"
        tests:
          - not_null
          - unique
      - name: input_number
        description: "Number assigned to the GitHub issue/input"
        tests:
          - not_null
      - name: input_title
        description: "Title of the GitHub issue/input"
        tests:
          - not_null
      - name: user_create
        description: "Username of the person who created the issue/input"
        tests:
          - not_null
      - name: state
        description: "Current state of the issue/input (open or closed)"
        tests:
          - accepted_values:
              values: ['open', 'closed']
      - name: body
        description: "Content/description of the GitHub issue/input"
        tests:
          - not_null
      - name: assignee
        description: "Username of the person assigned to the issue/input"
      - name: comments
        description: "Number of comments on the issue/input"
      - name: created_at
        description: "Timestamp when the issue/input was created"
        tests:
          - not_null
      - name: updated_at
        description: "Timestamp when the issue/input was last updated"
        tests:
          - not_null
      - name: closed_at
        description: "Timestamp when the issue/input was closed"
      - name: sys_audit_extracted_on 
        description: "Timestamp when the issue/input was extracted from the source system"
      - name: sys_audit_created_on
        description: "Timestamp when the issue/input was created in the source system"
      - name: sys_audit_updated_on
        description: "Timestamp when the issue/input was last updated in the source system"
      - name: sys_audit_created_by
        description: "Job/Process who created the issue/input in the source system"
      - name: sys_audit_updated_by
        description: "Job/Process who last updated the issue/input in the source system"
        
